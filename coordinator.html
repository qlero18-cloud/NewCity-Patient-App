// --- src/domain/time.js ---
// Formato y aritmética de horas en America/Tijuana (PRD §7.1 INV-5, R6).
//
// Regla de esta fase: ninguna función de este archivo consulta el reloj
// del sistema (INV-1) ni la zona horaria del proceso (INV-5). Toda lectura
// de "qué hora es en Tijuana" pasa por Intl.DateTimeFormat con
// timeZone: 'America/Tijuana' explícito — eso es independiente de
// process.env.TZ, a diferencia de Date#getHours/getMinutes/getDay/getDate,
// que sí leen la zona local del proceso y por eso están prohibidas aquí.
//
// `new Date(iso)` con argumento es aritmética de instante (milisegundos
// desde epoch, siempre UTC internamente) y no depende de ninguna zona
// horaria: es distinto de `new Date()` sin argumento, que sí lee el reloj
// del sistema y está prohibido por INV-1.

const TZ = 'America/Tijuana';
const HOUR_MS = 60 * 60 * 1000;

const WEEKDAYS_ES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const WEEKDAYS_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const PARTS_FORMATTER = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ,
  hour12: false,
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
  hour: '2-digit',
  minute: '2-digit',
  second: '2-digit',
  weekday: 'long',
});

// Descompone un instante en sus campos de calendario/reloj vistos desde
// America/Tijuana. No usa Date#getHours ni similares: todo sale de
// Intl.DateTimeFormat con timeZone explícito.
function tijuanaParts(date) {
  const raw = Object.fromEntries(PARTS_FORMATTER.formatToParts(date).map((p) => [p.type, p.value]));
  const hour = raw.hour === '24' ? 0 : Number(raw.hour); // ICU a veces da "24" para medianoche
  return {
    year: Number(raw.year),
    month: Number(raw.month),
    day: Number(raw.day),
    hour,
    minute: Number(raw.minute),
    second: Number(raw.second),
    weekdayEn: raw.weekday,
  };
}

// Offset UTC vigente en America/Tijuana para ese instante (en minutos,
// negativo porque Tijuana siempre está al oeste de UTC). Se deriva
// comparando el instante real contra el mismo instante interpretado como
// si sus campos de calendario fueran UTC — funciona en cualquier lado del
// cambio de horario de verano sin tabla de reglas propia.
function tijuanaOffsetMinutes(date) {
  const p = tijuanaParts(date);
  const asIfUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
  return Math.round((asIfUtc - date.getTime()) / 60000);
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function formatOffset(minutes) {
  const sign = minutes <= 0 ? '-' : '+';
  const abs = Math.abs(minutes);
  return `${sign}${pad2(Math.floor(abs / 60))}:${pad2(abs % 60)}`;
}

// Convierte cualquier ISO con desplazamiento explícito a milisegundos desde
// epoch. Es aritmética de instante pura, no lectura de reloj (INV-1: el
// argumento siempre llega desde afuera).
function instantMs(iso) {
  return new Date(iso).getTime();
}

// Suma milisegundos a un instante y lo serializa como ISO 8601 con el
// desplazamiento que America/Tijuana tenga vigente en ese instante
// resultante (nunca 'Z', nunca sin zona — PRD §7).
function toTijuanaIso(ms) {
  const date = new Date(ms);
  const p = tijuanaParts(date);
  const offset = tijuanaOffsetMinutes(date);
  return `${p.year}-${pad2(p.month)}-${pad2(p.day)}T${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}${formatOffset(offset)}`;
}

// Clave de día de calendario en America/Tijuana, ordenable como string
// ("2026-03-10"). Se usa para agrupar (itinerary.js) y para medir
// diferencia de días.
function dayKeyTijuana(iso) {
  const p = tijuanaParts(new Date(iso));
  return `${p.year}-${pad2(p.month)}-${pad2(p.day)}`;
}

// Diferencia en días de calendario (Tijuana) entre iso y referenceIso:
// 0 = mismo día, 1 = el día siguiente, -1 = el día anterior, etc.
function dayDiffTijuana(iso, referenceIso) {
  const a = tijuanaParts(new Date(iso));
  const b = tijuanaParts(new Date(referenceIso));
  const utcA = Date.UTC(a.year, a.month - 1, a.day);
  const utcB = Date.UTC(b.year, b.month - 1, b.day);
  return Math.round((utcA - utcB) / 86400000);
}

// formatTimeTijuana(iso, lang) -> "9:00 AM" (en) / "9:00 a.m." (es)
// Reloj de 12 horas sin cero a la izquierda en la hora, minutos siempre a
// dos dígitos. "a.m./p.m." en minúsculas con puntos es la convención
// habitual en español de México; no la dicta el PRD de forma literal, así
// que queda documentada aquí como decisión de implementación, no de
// producto.
function formatTimeTijuana(iso, lang) {
  const { hour, minute } = tijuanaParts(new Date(iso));
  const isAm = hour < 12;
  const period = lang === 'es' ? (isAm ? 'a.m.' : 'p.m.') : isAm ? 'AM' : 'PM';
  let hour12 = hour % 12;
  if (hour12 === 0) hour12 = 12;
  return `${hour12}:${pad2(minute)} ${period}`;
}

// isOpenNow(hours, now) -> true | false | null
//
// Añadido en la fase 05 (pantalla "Horarios"): la fase pide un indicador
// "abierto ahora / cerrado" "calculado con now inyectado, nunca con el
// reloj leído dentro de la vista" — eso es una regla de dominio (lee hora
// de Tijuana, compara contra un horario), no una decisión de presentación,
// así que vive aquí y no en src/ui/screens/hours.js, igual que el resto de
// este archivo.
//
// hours.weekly[].day usa la misma convención que Date#getUTCDay():
// 0 = domingo … 6 = sábado. Ningún dato real del proyecto lo confirma
// todavía (locations.js, support.js y plaza.js traen el mismo horario
// placeholder los 7 días, así que el número en sí es indistinguible en la
// práctica) — queda documentada aquí como la convención a seguir cuando
// haya horario real distinto por día.
//
// hours.exceptions no se consulta: ninguna fixture ni contenido real lo
// puebla todavía (siempre `[]`) y el PRD no fija su forma. Inventar una
// forma sin dato real que la respalde sería peor que dejarlo pendiente —
// mismo criterio que ya se aplicó en fase 03 para amenidades y farmacia.
function isOpenNow(hours, now) {
  if (!hours || !Array.isArray(hours.weekly)) return null;
  const p = tijuanaParts(new Date(now));
  const dow = WEEKDAYS_EN.indexOf(p.weekdayEn); // 0=domingo..6=sábado
  const today = hours.weekly.find((w) => w.day === dow);
  if (!today) return false;
  const hm = `${pad2(p.hour)}:${pad2(p.minute)}`;
  return hm >= today.open && hm <= today.close;
}

// formatDayLabel(iso, now, lang) -> { es, en }
// Devuelve SIEMPRE ambos idiomas (igual que groupByDay's `label`): la UI
// puede alternar ES/EN sin volver a llamar al dominio. El parámetro `lang`
// se acepta por simetría con formatTimeTijuana y porque quien llama ya lo
// tiene a mano, pero no cambia qué se calcula.
function formatDayLabel(iso, now, _lang) {
  const diff = dayDiffTijuana(iso, now);
  const { day, weekdayEn } = tijuanaParts(new Date(iso));
  const idx = WEEKDAYS_EN.indexOf(weekdayEn);
  const weekdayEs = WEEKDAYS_ES[idx];

  const es = diff === 0 ? `Hoy · ${weekdayEs} ${day}` : diff === 1 ? `Mañana · ${weekdayEs} ${day}` : `${weekdayEs} ${day}`;
  const en = diff === 0 ? `Today · ${weekdayEn} ${day}` : diff === 1 ? `Tomorrow · ${weekdayEn} ${day}` : `${weekdayEn} ${day}`;

  return { es, en };
}

// --- src/ui/screens/coordinator/lodging.js ---
// Fase 09 — Hospedaje: registro/edición de Lodging (PRD §7) para una
// visita seleccionada del panel de coordinadores. ctx = { store, visitId,
// lang, t }. store.getVisit(visitId) regresa el record completo
// { visit, appointments, passes, lodging } (src/ui/coordinatorStore.js).
//
// No hay pantalla de edición aparte: si record.lodging ya existe (no es
// null), este mismo formulario se prellena con esos valores, y volver a
// enviarlo sobrescribe el hospedaje de la visita vía store.setLodging —
// eso ES "editar" en esta demo (docs/phases/phase-09-coordinator-demo.md,
// "Alcance": "Registro de hospedaje ... asociado a una visita").
//
// checkIn/checkOut son <input type="text">, igual que el resto de fechas
// capturadas a mano en esta demo (mismo razonamiento que intake.js con
// startsAt/endsAt): sin dependencia de un date-picker.
//
// Nombres de campo iguales a los que ya lee src/ui/screens/stay.js del
// lado paciente: hotel, reservationCode, checkIn, checkOut,
// breakfastIncluded, recoveryRoom.





// Etapa D — el servidor valida lo mismo que validateLodging, y a veces
// más. Los errores por campo de ARRIBA (los <span> junto a cada input) los
// pone la validación local; este mapa es para los que llegan del servidor,
// que se resumen en bloque porque no siempre corresponden a un input
// visible.
// (Sufijo _HOSPEDAJE por la colisión de scope que documenta intake.js.)
const CAMPOS_HOSPEDAJE = {
  hotel: 'coordinator.lodging.hotelLabel',
  reservationCode: 'coordinator.lodging.reservationCodeLabel',
  checkIn: 'coordinator.lodging.checkInLabel',
  checkOut: 'coordinator.lodging.checkOutLabel',
};

// Puro y exportado: bajo la restricción de no simular DOM en node:test,
// esta es la única forma de probar la validación de verdad. Devuelve
// { ok, errors } con un motivo por campo ('required' | 'invalidDate' |
// 'order'), no un mensaje: el texto lo pone la pantalla desde i18n, para
// que esta función no dependa del idioma.
//
// hotel/checkIn/checkOut son obligatorios; reservationCode no: el hotel a
// veces se aparta antes de que exista el código, y obligarlo empujaría a
// la coordinadora a inventar uno.
//
// El orden importa: si una fecha ni siquiera se puede interpretar, el
// motivo es 'invalidDate' y NO se compara contra la otra — comparar NaN
// daría siempre falso y reportaría 'order', que manda a corregir el campo
// equivocado.
function validateLodging(values) {
  const errors = {};
  const trimmed = (v) => (typeof v === 'string' ? v.trim() : '');

  for (const field of ['hotel', 'checkIn', 'checkOut']) {
    if (!trimmed(values?.[field])) errors[field] = 'required';
  }

  const parse = (field) => {
    if (errors[field]) return null; // ya está marcado como vacío
    const ms = instantMs(trimmed(values[field]));
    if (!Number.isFinite(ms)) {
      errors[field] = 'invalidDate';
      return null;
    }
    return ms;
  };

  const inMs = parse('checkIn');
  const outMs = parse('checkOut');

  // Igual (no solo anterior) también es error: una estancia de duración
  // cero no es un dato real, es un dedazo.
  if (inMs !== null && outMs !== null && outMs <= inMs) {
    errors.checkOut = 'order';
  }

  return { ok: Object.keys(errors).length === 0, errors };
}

// name siempre es un literal fijo en cada punto de llamada (nunca dato de
// paciente/coordinadora) — igual se envuelve en escapeHtml aquí (fix de
// revisión adversarial, fase 09): era el único sitio de interpolación de
// este proyecto sin escapeHtml, y la convención de util.js es usarlo
// SIEMPRE en texto/atributos interpolados, no solo donde hoy hay dato
// no confiable.
function textField(name, value, label) {
  return `
    <label class="nc-lodging-field">
      <span class="nc-lodging-field-label">${escapeHtml(label)}</span>
      <input type="text" name="${escapeHtml(name)}" value="${escapeHtml(value ?? '')}" class="nc-lodging-input" aria-describedby="nc-lodging-error-${escapeHtml(name)}" />
      <span class="nc-lodging-error" id="nc-lodging-error-${escapeHtml(name)}" data-role="lodging-error" data-field="${escapeHtml(name)}" hidden></span>
    </label>
  `;
}

function checkboxField(name, checked, label) {
  return `
    <label class="nc-lodging-field nc-lodging-field--checkbox">
      <input type="checkbox" name="${escapeHtml(name)}" class="nc-lodging-checkbox"${checked ? ' checked' : ''} />
      <span class="nc-lodging-field-label">${escapeHtml(label)}</span>
    </label>
  `;
}

function renderLodgingScreen(ctx) {
  const { store, visitId, t, flash, errors, requestError } = ctx;
  const title = t('coordinator.lodging.title');
  const record = store.getVisit(visitId);

  // Guard: visita inexistente -> fallback corto, sin formulario, sin
  // lanzar (misma disciplina de defensa en profundidad que ya usa
  // src/ui/screens/stay.js para lodging ausente). Antes esto devolvía solo
  // el <h1>: una pantalla vacía sin explicación. Ahora dice lo mismo que
  // itinerary.js y qpass.js, desde la misma llave.
  if (!record) {
    return `
      <section class="nc-screen">
        <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
        <p class="nc-empty-state">${escapeHtml(t('coordinator.visitNotFound'))}</p>
      </section>
    `;
  }

  const lodging = record.lodging;

  return `
    <section class="nc-screen">
      <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
      <form data-role="lodging-form" class="nc-lodging-form">
        ${renderCard(`
          ${textField('hotel', lodging?.hotel, t('coordinator.lodging.hotelLabel'))}
          ${textField('reservationCode', lodging?.reservationCode, t('coordinator.lodging.reservationCodeLabel'))}
          ${textField('checkIn', lodging?.checkIn, t('coordinator.lodging.checkInLabel'))}
          ${textField('checkOut', lodging?.checkOut, t('coordinator.lodging.checkOutLabel'))}
          ${checkboxField('breakfastIncluded', !!lodging?.breakfastIncluded, t('coordinator.lodging.breakfastLabel'))}
          ${checkboxField('recoveryRoom', !!lodging?.recoveryRoom, t('coordinator.lodging.recoveryLabel'))}
        `)}
        ${renderRequestError(requestError, t)}
        ${renderFormErrors(errors, t, CAMPOS_HOSPEDAJE)}
        ${flash === 'saved' ? `<p class="nc-lodging-saved" data-role="lodging-saved" role="status">${escapeHtml(t('coordinator.lodging.saved'))}</p>` : ''}
        <button type="submit" class="nc-button nc-button--primary nc-lodging-submit">${escapeHtml(t('coordinator.lodging.save'))}</button>
      </form>
    </section>
  `;
}

// ctx aquí además trae { onChange } (mismo contrato que el resto de
// attach*Screen interactivos de esta fase): se llama después de insertar
// el HTML en el DOM, nunca antes.
function attachLodgingScreen(rootEl, ctx) {
  const { store, visitId, onChange, t } = ctx;
  const form = rootEl.querySelector('[data-role="lodging-form"]');
  if (!form) return;

  const errorEls = [...rootEl.querySelectorAll('[data-role="lodging-error"]')];

  // Solo los errores se manejan aquí, de forma imperativa, y a propósito:
  // el camino inválido NO repinta (repintar borraría lo que la persona
  // acaba de teclear, que es justo lo que hay que corregir). El camino
  // válido sí repinta, así que su confirmación no puede vivir en el DOM
  // — la pinta renderLodgingScreen desde ctx.flash.
  //
  // Como el camino inválido no repinta, la confirmación del guardado
  // ANTERIOR seguiría en pantalla junto al error nuevo ("Hospedaje
  // guardado." arriba de "Fecha no reconocida"), que es peor que no
  // decir nada. Se quita al empezar cada intento.
  function clearFeedback() {
    for (const el of errorEls) {
      el.textContent = '';
      el.hidden = true;
    }
    rootEl.querySelector('[data-role="lodging-saved"]')?.remove();
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const fields = form.elements;
    const values = {
      hotel: fields.hotel.value,
      reservationCode: fields.reservationCode.value,
      checkIn: fields.checkIn.value,
      checkOut: fields.checkOut.value,
      breakfastIncluded: fields.breakfastIncluded.checked,
      recoveryRoom: fields.recoveryRoom.checked,
    };

    clearFeedback();

    // No se guarda nada si algo falla. Antes se guardaba siempre, así que
    // un check-out mal escrito llegaba tal cual a la pantalla del paciente
    // (src/ui/screens/stay.js lo muestra sin validar) y ahí ya no había
    // quién lo notara.
    const { ok, errors } = validateLodging(values);
    if (!ok) {
      for (const el of errorEls) {
        const reason = errors[el.dataset.field];
        if (!reason) continue;
        el.textContent = t(`coordinator.lodging.error.${reason}`);
        el.hidden = false;
      }
      form.querySelector(`[name="${Object.keys(errors)[0]}"]`)?.focus();
      return;
    }

    // Etapa D — esto ahora va al servidor y puede fallar por cosas que la
    // validación de arriba no puede ver: sin conexión, sesión vencida, o la
    // visita borrada desde otra pantalla. El resultado se le entrega entero
    // al router, que decide entre confirmar y explicar.
    //
    // El await deja el botón vivo mientras tanto; se acepta a sabiendas: un
    // doble clic manda dos PUT y el segundo escribe lo mismo que el primero
    // (setLodging reemplaza, no acumula), así que el peor caso es una
    // escritura de más, no un hospedaje duplicado.
    store.setLodging(visitId, values).then((res) => {
      // 'saved' viaja al repintado (coordinatorApp.js lo pasa como
      // ctx.flash y lo consume en el siguiente render). Sin confirmación no
      // había ninguna señal de que el clic hubiera servido: el formulario es
      // el mismo para alta y edición, y se queda idéntico después de
      // guardar.
      onChange?.(res, 'saved');
    });
  });
}

// --- src/domain/passes.js ---
// R3 — Qué QPASS se muestra (PRD §8, §6.5).
//
// Visible si se cumplen las tres:
//   1. now >= validFrom
//   2. validUntil == null (no caduca) O now <= validUntil
//   3. revokedAt == null
//
// `revokedAt` no es "revocado a partir de esa hora": es la marca de que YA
// se revocó. Cualquier valor no nulo lo apaga de inmediato, sin comparar
// contra `now` — es el único mecanismo de invalidación de un pase sin
// caducidad (INV-4, §6.5).
//
// Orden en pantalla: torre → piso27 → estacionamiento.


const SCOPE_ORDER = { torre: 0, piso27: 1, estacionamiento: 2 };

// Exportada (antes era local a este módulo): la pantalla de emisión del
// panel necesita el MISMO criterio de "revocado" para no contar un pase
// revocado como pase vigente (src/ui/screens/coordinator/qpass.js). Que
// sean dos definiciones distintas de "revocado" es exactamente el bug
// que INV-4 no perdona, así que hay una sola.
function isRevoked(pass) {
  return pass.revokedAt !== null && pass.revokedAt !== undefined;
}

function hasStarted(pass, nowMs) {
  return instantMs(pass.validFrom) <= nowMs;
}

function notYetExpired(pass, nowMs) {
  if (pass.validUntil === null || pass.validUntil === undefined) return true; // no caduca — §6.5
  return instantMs(pass.validUntil) >= nowMs;
}

function visiblePasses(passes, now) {
  const nowMs = instantMs(now);

  return passes
    .filter((p) => !isRevoked(p) && hasStarted(p, nowMs) && notYetExpired(p, nowMs))
    .sort((a, b) => {
      const byScope = SCOPE_ORDER[a.scope] - SCOPE_ORDER[b.scope];
      if (byScope !== 0) return byScope;
      return a.id.localeCompare(b.id);
    });
}

// --- src/ui/screens/coordinator/qpass.js ---
// Fase 09 (D29) — Emisión de QPASS: la coordinadora sube una imagen ya
// existente del pase (foto o export de un pase físico/pre-hecho) en vez de
// escribir un payload corto para que qr.js/code128.js lo codifiquen. Ver
// "Emisión de QPASS: imagen subida por el coordinador" en
// docs/phases/phase-09-coordinator-demo.md para el diseño completo — este
// archivo sigue ese diseño al pie de la letra, no lo reinterpreta.
//
// ctx de renderQpassScreen: { store, visitId, lang, t }.
// ctx de attachQpassScreen: lo anterior + { onIssued }.
//
// Etapa D — `now` desapareció: la hora de emisión la pone el servidor. El
// reloj de la máquina de coordinación no tiene por qué ser el que quede
// escrito en el expediente.
//
// "Emitido" para ESTA pantalla significa específicamente que la visita ya
// tiene un QPass con format:'image' — no "la visita ya tiene algún QPass".
// Varias fixtures (v_demo1 entre ellas) ya traen pases qr/code128 de
// fábrica (src/data/fixtures.js); esos no deben hacer que esta pantalla
// salte directo al estado "emitido" la primera vez que se abre.
//
// Ningún símbolo se genera aquí (no se importa generateQrMatrix ni el
// generador de Code128): el símbolo ya viene armado en la imagen que sube
// la coordinadora. Al emitir, esta pantalla solo enlaza con
// data-nav="pass-preview" hacia la vista previa como paciente —
// coordinatorApp.js (el enrutador, construido aparte) es quien resuelve
// esa ruta reutilizando renderPassScreen/attachPassScreen de pass.js.






const SCOPES = ['torre', 'piso27', 'estacionamiento'];

// 2 MB. La imagen se guarda como data URL en el pase (payload), así que
// el peso del archivo se convierte casi 1:1 en peso del registro y de lo
// que después viaja a la pantalla del paciente. El límite es de producto,
// no técnico: una foto de un pase impreso cabe de sobra.
const QPASS_MAX_BYTES = 2 * 1024 * 1024;

// Puro y exportado a propósito: es la única forma de probar la validación
// bajo la restricción de este proyecto de no simular DOM en node:test —
// el <input type="file"> y FileReader no existen ahí, pero el criterio sí
// se puede ejercitar con un objeto { type, size }.
//
// accept="image/*" en el input es una sugerencia del navegador, no una
// garantía: el selector de archivos deja cambiar el filtro a "todos", y
// arrastrar y soltar lo ignora por completo. Por eso se vuelve a revisar
// aquí. Motivos: 'missing' | 'type' | 'size'.
function validateQpassFile(file) {
  if (!file) return { ok: false, reason: 'missing' };
  if (typeof file.type !== 'string' || !file.type.startsWith('image/')) {
    return { ok: false, reason: 'type' };
  }
  if (typeof file.size === 'number' && file.size > QPASS_MAX_BYTES) {
    return { ok: false, reason: 'size' };
  }
  return { ok: true };
}

// "Emitido" = tiene un QPass de imagen VIGENTE. Un pase revocado sigue en
// record.passes (es historia, ver coordinatorStore.revokeQpass), pero no
// debe dejar la pantalla atorada en el estado emitido: si se revocó, la
// coordinadora tiene que poder subir otro. isRevoked viene de domain/
// passes.js — el mismo criterio que usa R3 del lado del paciente.
function activeImagePass(passes) {
  return passes.find((p) => p.format === 'image' && !isRevoked(p)) ?? null;
}

function renderQpassScreen(ctx) {
  const { store, visitId, t } = ctx;

  const record = store.getVisit(visitId);

  // Guard: visita inexistente -> fallback corto, sin formulario, sin
  // lanzar (misma disciplina de defensa en profundidad que ya usa
  // src/ui/screens/stay.js para lodging ausente, y
  // src/ui/screens/coordinator/lodging.js para visitId inexistente).
  // coordinator.visitNotFound es compartida con itinerary.js y lodging.js
  // — ver el comentario de itinerary.js para el porqué.
  if (!record) {
    return `
      <section class="nc-screen">
        <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
        <p class="nc-qpass-fallback">${escapeHtml(t('coordinator.visitNotFound'))}</p>
      </section>
    `;
  }

    // Revocar lleva el data-pass-id del pase vigente: la visita puede
    // tener varios pases de imagen a lo largo del tiempo (uno revocado y

    return `

  return `

        <label class="nc-qpass-field">

// Llamado después de insertar renderQpassScreen en el DOM (mismo contrato
// que el resto de attach*Screen de esta fase). No llama attachNav ni
// engancha su propio listener sobre [data-nav="pass-preview"] — ese botón
// lo cablea el enrutador central con attachNav(root) una sola vez sobre
// todo el árbol ya renderizado (src/ui/nav.js, D28); esta función NO debe
// competir con eso ni disparar dos veces el mismo clic. Por eso, al
// emitir, esta función solo muta el store y llama onIssued?.() — no pinta
// ella misma la vista de "emitido": eso lo decide coordinatorApp.js
// volviendo a llamar renderQpassScreen/attachQpassScreen (y attachNav)
// para la misma ruta, para que el botón data-nav="pass-preview" que
// aparece recién nazca ya cableado.
function attachQpassScreen(rootEl, ctx) {
  const { store, visitId, onIssued, t } = ctx;

  // Local al closure de ESTA llamada (no variable de módulo): una segunda
  // llamada a attach para otra visita no debe heredar la imagen de la
  // anterior.
  let qpassImageDataUrl = null; // efímera a propósito: solo en memoria, nunca localStorage ni servidor (docs/phases/phase-09-coordinator-demo.md, "Emisión de QPASS")

  // Vista "emitido": revocar y re-emitir. Ninguno de los dos existe en la
  // vista de captura, y viceversa — por eso ambos bloques usan `?.` y
  // conviven en la misma función, igual que el resto de attach*Screen.
  const revokeBtn = rootEl.querySelector('[data-role="revoke-qpass"]');
  const reissueBtn = rootEl.querySelector('[data-role="reissue-qpass"]');

  // Los dos hacen lo mismo en el store — la diferencia es de intención, y
  // se nota en lo que ve la coordinadora después: "revocar" deja la visita
  // sin pase (y la pantalla, al re-renderizarse, vuelve al formulario
  // vacío), "emitir otro" es el mismo camino leído como "empiezo de
  // nuevo". Se separan porque son dos decisiones distintas para quien las
  // toma, aunque compartan implementación.
  for (const btn of [revokeBtn, reissueBtn]) {
    btn?.addEventListener('click', async () => {
      const passId = btn.dataset.passId;
      if (!passId) return;
      btn.disabled = true; // aquí sí: revocar dos veces el mismo pase es un 404 confuso, y no hay nada escrito que perder
      const res = await store.revokeQpass(visitId, passId);
      // Mismo callback: "el estado del pase cambió, vuelve a pintar". Ahora
      // lleva el resultado, para que un fallo no se vea igual que un éxito.
      onIssued?.(res);
      if (!res.ok) btn.disabled = false;
    });
  }

  const input = rootEl.querySelector('[data-role="qpass-image-input"]');
  const scopeSelect = rootEl.querySelector('[data-role="qpass-scope-select"]');
  const preview = rootEl.querySelector('[data-role="qpass-preview"]');
  const issueBtn = rootEl.querySelector('[data-role="issue-qpass"]');
  const errorEl = rootEl.querySelector('[data-role="qpass-error"]');

  function showError(reason) {
    qpassImageDataUrl = null;
    if (issueBtn) issueBtn.disabled = true; // que no quede emitible con la imagen anterior
    if (preview) {
      preview.innerHTML = `<p class="nc-qpass-preview-empty">${escapeHtml(t('coordinator.qpass.noImage'))}</p>`;
    }
    if (errorEl) {
      errorEl.textContent = t(`coordinator.qpass.error.${reason}`);
      errorEl.hidden = false;
    }
  }

  // El store devuelve banderas, no códigos: aquí se elige cuál explica
  // mejor lo que pasó. `gone` (la visita ya no está) es el caso en que
  // reintentar no sirve de nada.
  //
  // La sesión caída NO sale por aquí: no es un problema de esta pantalla
  // sino del panel entero, y se resuelve volviendo a entrar. Se le pasa al
  // router, que es quien sabe pintar la pantalla de acceso.
  function motivoDeFallo(res) {
    if (res.notFound) return 'gone';
    if (res.errors) return Object.values(res.errors)[0] ?? 'invalid';
    return 'network';
  }

  function clearError() {
    if (errorEl) {
      errorEl.textContent = '';
      errorEl.hidden = true;
    }
  }

  input?.addEventListener('change', () => {
    const file = input.files?.[0];
    if (!file) return; // cancelar el diálogo no es un error: no se toca nada
    const check = validateQpassFile(file);
    if (!check.ok) {
      showError(check.reason);
      return;
    }
    clearError();
    const reader = new FileReader();
    reader.onload = () => {
      qpassImageDataUrl = reader.result; // "data:image/...;base64,...."
      if (preview) {
        preview.innerHTML = `<img src="${escapeHtml(qpassImageDataUrl)}" alt="${escapeHtml(t('coordinator.qpass.previewTitle'))}" class="nc-qpass-preview-image" />`;
      }
      if (issueBtn) issueBtn.disabled = false;
    };
    // Antes no existía: un archivo ilegible (permisos, unidad de red que
    // se cayó, archivo borrado entre elegirlo y leerlo) dejaba la pantalla
    // en silencio, con el botón deshabilitado y sin decir por qué.
    reader.onerror = () => showError('read');
    reader.readAsDataURL(file);
  });

  issueBtn?.addEventListener('click', async () => {
    if (!qpassImageDataUrl) return;
    const scope = scopeSelect?.value ?? SCOPES[0];

    clearError();
    issueBtn.disabled = true; // la imagen puede pesar 2 MB: la subida tarda y el doble clic emitiría dos pases
    const res = await store.issueQpass(visitId, { format: 'image', payload: qpassImageDataUrl, scope });

    if (!res.ok) {
      // Sesión caída: la arregla el router volviendo a pedir acceso, no
      // esta pantalla con un renglón rojo.
      if (res.unauthenticated) {
        onIssued?.(res);
        return;
      }
      // A diferencia de showError, esto NO tira la imagen ni vacía la vista
      // previa: lo que falló fue el viaje, no el archivo, y volver a elegir
      // una foto de 2 MB por un tropiezo de red es trabajo perdido por nada.
      // Tampoco se repinta la pantalla, por lo mismo.
      if (errorEl) {
        errorEl.textContent = errorText(t, motivoDeFallo(res));
        errorEl.hidden = false;
      }
      issueBtn.disabled = false;
      return;
    }

    onIssued?.(res);
  });
}

// --- src/ui/screens/coordinator/signin.js ---
// Etapa D — entrada al panel. La Etapa C construyó /api/auth/*, pero no
// había pantalla: el panel pedía datos a /api/coordinator, que exige sesión
// en toda ruta, y contestaba 401 a todo sin decir por qué.
//
// Esta pantalla no decide nada de sesión: junta usuario y contraseña y se
// los pasa a coordinatorApp.js, que llama al authClient. La contraseña
// nunca se guarda ni se repinta — sale del campo, va al servidor y se
// suelta.


// `error` es un código, no un texto: 'invalidCredentials' y 'expired'
// salen del bloque auth (son cosas de la sesión), y el resto del bloque
// coordinator.error, que comparten los cuatro formularios del panel.
function mensajeDeError(t, error) {
  if (!error) return '';
  const llave = error === 'invalidCredentials' || error === 'expired' ? `coordinator.auth.${error}` : `coordinator.error.${error}`;
  // role="alert" y no un párrafo cualquiera: el error aparece sin que la
  // pantalla cambie de sitio, así que con lector de pantalla, sin esto, el
  // botón simplemente "no hace nada".
  return `<p class="nc-signin-error" role="alert" data-role="signin-error">${escapeHtml(t(llave))}</p>`;
}

function renderSignInScreen(ctx) {
  const { t, error, username = '', busy = false } = ctx;

  return `
    <section class="nc-screen nc-signin">
      <h1 class="nc-screen-title">${escapeHtml(t('coordinator.auth.title'))}</h1>
      <p class="nc-signin-intro">${escapeHtml(t('coordinator.auth.intro'))}</p>
      <form class="nc-form" data-role="signin-form">
        <label class="nc-field">
          <span class="nc-field-label">${escapeHtml(t('coordinator.auth.usernameLabel'))}</span>
          <input
            type="text"
            name="username"
            class="nc-input"
            value="${escapeHtml(username)}"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          />
        </label>

        <label class="nc-field">
          <span class="nc-field-label">${escapeHtml(t('coordinator.auth.passwordLabel'))}</span>
          <!-- Sin value, nunca, ni después de un error: repintarla la
               dejaría escrita en el HTML del documento, legible por
               cualquier extensión y por quien abra el inspector.
               autocomplete="current-password" es lo que hace que el gestor
               del navegador ofrezca guardarla — la alternativa real es un
               papelito pegado al monitor. -->
          <input type="password" name="password" class="nc-input" autocomplete="current-password" required />
        </label>

        ${mensajeDeError(t, error)}

        <button type="submit" class="nc-button nc-button--primary"${busy ? ' disabled' : ''}>
          ${escapeHtml(t(busy ? 'coordinator.auth.signingIn' : 'coordinator.auth.signIn'))}
        </button>
      </form>
    </section>
  `;
}

function attachSignInScreen(rootEl, ctx = {}) {
  const { onSubmit } = ctx;
  const form = rootEl.querySelector('[data-role="signin-form"]');
  form?.addEventListener('submit', (event) => {
    event.preventDefault();
    const data = new FormData(form);
    onSubmit?.({ username: String(data.get('username') ?? ''), password: String(data.get('password') ?? '') });
    // El campo se vacía en cuanto sale, sin esperar la respuesta: si la red
    // tarda, la contraseña no se queda en pantalla mientras tanto.
    form.elements.password.value = '';
  });

  // El foco donde toca: al usuario si está vacío, a la contraseña si el
  // usuario ya viene puesto de un intento anterior.
  const usuario = rootEl.querySelector('[name="username"]');
  const clave = rootEl.querySelector('[name="password"]');
  (usuario?.value ? clave : usuario)?.focus?.();
}

// loopback y exige el mismo motivo del servidor.
//
// El `+` no es opcional: la pantalla del paciente arma `wa.me/<dígitos>` con
// este número (D73).
function telefonoValido(raw) {
  if (!/^\+[\d\s-]+$/.test(raw)) return false;
  const digitos = raw.replace(/\D/g, '').length;
  return digitos >= 8 && digitos <= 15;
}

// Puro y exportado: sin DOM falso en node:test (D8), esta es la única forma
// de probar de verdad la validación del formulario. Devuelve { ok, errors }
// con un motivo por campo —los mismos códigos del servidor— y nunca un
// mensaje: el texto lo pone la pantalla desde i18n.
//
// Obligatorio: qué (kind), cuándo (scheduledAt) y dónde (meetingPointId).
// Nada más. El chofer y el vehículo se asignan la víspera y exigirlos para
// poder guardar la hora de recogida empujaría a inventarlos — mismo
// razonamiento que dejó `reservationCode` opcional en el hospedaje.
function validateTransfer(values) {
  const errors = {};
  const trimmed = (v) => (typeof v === 'string' ? v.trim() : '');

  const kind = values?.kind;
  if (!kind) errors.kind = 'required';
  else if (!TRANSFER_KINDS.includes(kind)) errors.kind = 'unknown';

  const punto = values?.meetingPointId;
  if (!punto) errors.meetingPointId = 'required';
  else if (!transferPoints.some((p) => p.id === punto)) errors.meetingPointId = 'unknown';

  const cuando = trimmed(values?.scheduledAt);
  if (!cuando) errors.scheduledAt = 'required';
  else if (!Number.isFinite(instantMs(cuando))) errors.scheduledAt = 'invalidDate';
  // Sin zona horaria, el mismo texto escrito por una Function en UTC y leído
  // en Tijuana ya son dos horas distintas (PRD §7).
  else if (!/(?:Z|[+-]\d{2}:?\d{2})$/.test(cuando)) errors.scheduledAt = 'noOffset';

  const tel = trimmed(values?.driverPhone);
  if (tel && !telefonoValido(tel)) errors.driverPhone = 'invalid';

  const tipo = values?.vehicleType;
  if (tipo && !VEHICLE_TYPES.includes(tipo)) errors.vehicleType = 'unknown';

  return { ok: Object.keys(errors).length === 0, errors };
}

function campo(name, label, control) {
  return `
    <label class="nc-coord-transfer-field">
      <span class="nc-coord-transfer-field-label">${escapeHtml(label)}</span>
      ${control}
      <span class="nc-coord-transfer-error" data-role="transfer-error" data-field="${escapeHtml(name)}" hidden></span>
    </label>
  `;
}

function textoCampo(name, label, value = '', extra = '') {
  return campo(
    name,
    label,
    `<input type="text" name="${escapeHtml(name)}" value="${escapeHtml(value ?? '')}" class="nc-coord-transfer-input"${extra} />`,
  );
}

// Las opciones de un enum se traducen desde transfer.*, el MISMO bloque que
// lee la pantalla del paciente: duplicarlas en coordinator.* garantizaría
// que un día el panel y el teléfono llamen distinto a lo mismo.
function enumOpciones(valores, prefijo, t, selected) {
  return valores
    .map((v) => `<option value="${escapeHtml(v)}"${v === selected ? ' selected' : ''}>${escapeHtml(t(`${prefijo}.${v}`))}</option>`)
    .join('\n');
}

function selectCampo(name, label, opciones) {
  return campo(name, label, `<select name="${escapeHtml(name)}" class="nc-coord-transfer-input">${opciones}</select>`);
}

// Un mismo cuerpo para alta y edición: son los mismos catorce controles con
// otros valores. Dos copias divergirían al primer campo nuevo, y el campo
// que faltara en la de edición sería un dato que ya no se puede corregir.
function camposTraslado(lang, t, transfer = null) {
  const sinConfirmar = t('common.unconfirmedBadge');
  const v = transfer?.vehicle ?? {};
  const d = transfer?.driver ?? {};

  return `
    ${selectCampo('kind', t('coordinator.transfers.kindLabel'), enumOpciones(TRANSFER_KINDS, 'transfer.kind', t, transfer?.kind))}
    ${textoCampo('scheduledAt', t('coordinator.transfers.scheduledAtLabel'), transfer?.scheduledAt, ` placeholder="${escapeHtml(SCHEDULED_AT_PLACEHOLDER)}"`)}
    ${selectCampo('meetingPointId', t('coordinator.transfers.meetingPointLabel'), transferPointOptionsHtml(transferPoints, lang, transfer?.meetingPointId, sinConfirmar))}
    ${textoCampo('flightNumber', t('coordinator.transfers.flightNumberLabel'), transfer?.flightNumber)}
    <p class="nc-coord-transfer-hint">${escapeHtml(t('coordinator.transfers.driverOptionalHint'))}</p>
    ${textoCampo('driverName', t('coordinator.transfers.driverNameLabel'), d.name)}
    ${textoCampo('driverPhone', t('coordinator.transfers.driverPhoneLabel'), d.phone, ' placeholder="+52 664 123 4567"')}
    ${selectCampo('vehicleType', t('coordinator.transfers.vehicleTypeLabel'), `<option value=""></option>${enumOpciones(VEHICLE_TYPES, 'transfer.vehicleType', t, v.type)}`)}
    ${textoCampo('vehicleMake', t('coordinator.transfers.vehicleMakeLabel'), v.make)}
    ${textoCampo('vehicleModel', t('coordinator.transfers.vehicleModelLabel'), v.model)}
    ${textoCampo('vehicleColor', t('coordinator.transfers.vehicleColorLabel'), v.color)}
    ${textoCampo('vehiclePlate', t('coordinator.transfers.plateLabel'), v.plate)}
    ${campo('notes', t('coordinator.transfers.notesLabel'), `<textarea name="notes" rows="2" class="nc-coord-transfer-input">${escapeHtml(transfer?.notes ?? '')}</textarea>`)}
  `;
}

function renderTransferCard(transfer, lang, t) {
  const cancelled = transfer.status === 'cancelled';
  const chofer = transfer.driver?.name || '—';
  const vehiculo = [
    transfer.vehicle?.type ? t(`transfer.vehicleType.${transfer.vehicle.type}`) : '',
    transfer.vehicle?.make,
    transfer.vehicle?.model,
    transfer.vehicle?.color,
  ].filter(Boolean).join(' · ') || '—';

  // Editar y cancelar se omiten en uno ya cancelado, mismo criterio que las
  // citas: corregir el color del coche de un traslado que no va a salir no
  // es una acción con sentido, y "Cancelar" dos veces solo confunde.
  const acciones = cancelled
    ? ''
    : `
      <div class="nc-coord-transfer-actions">
        <button type="button" class="nc-button" data-role="edit-transfer" data-transfer-id="${escapeHtml(transfer.id)}">${escapeHtml(t('coordinator.transfers.edit'))}</button>
        <button type="button" class="nc-button" data-role="cancel-transfer" data-transfer-id="${escapeHtml(transfer.id)}">${escapeHtml(t('coordinator.transfers.cancel'))}</button>
      </div>
    `;

  return renderCard(
    `
      <p class="${classNames(['nc-coord-transfer-what', cancelled && 'nc-coord-transfer-what--cancelled'])}">${escapeHtml(t(`transfer.kind.${transfer.kind}`))}</p>
      <p class="nc-coord-transfer-row"><span>${escapeHtml(t('coordinator.transfers.scheduledAtLabel'))}</span> ${escapeHtml(transfer.scheduledAt)}</p>
      <p class="nc-coord-transfer-row"><span>${escapeHtml(t('coordinator.transfers.meetingPointLabel'))}</span> ${escapeHtml(transferPointName(transferPoints, transfer.meetingPointId, lang))}</p>
      ${transfer.flightNumber ? `<p class="nc-coord-transfer-row"><span>${escapeHtml(t('coordinator.transfers.flightNumberLabel'))}</span> ${escapeHtml(transfer.flightNumber)}</p>` : ''}
      <p class="nc-coord-transfer-row"><span>${escapeHtml(t('coordinator.transfers.driverNameLabel'))}</span> ${escapeHtml(chofer)}</p>
      ${transfer.driver?.phone ? `<p class="nc-coord-transfer-row"><span>${escapeHtml(t('coordinator.transfers.driverPhoneLabel'))}</span> ${escapeHtml(transfer.driver.phone)}</p>` : ''}
      <p class="nc-coord-transfer-row"><span>${escapeHtml(t('coordinator.transfers.vehicleTypeLabel'))}</span> ${escapeHtml(vehiculo)}</p>
      ${transfer.vehicle?.plate ? `<p class="nc-coord-transfer-row"><span>${escapeHtml(t('coordinator.transfers.plateLabel'))}</span> ${escapeHtml(transfer.vehicle.plate)}</p>` : ''}
      ${cancelled ? `<p class="nc-coord-transfer-status">${renderBadge(t('coordinator.transfers.cancelledBadge'), 'cancelled')}</p>` : ''}
      ${acciones}
      ${cancelled ? '' : `
      <form data-role="edit-transfer-form" data-transfer-id="${escapeHtml(transfer.id)}" class="nc-coord-transfer-form nc-coord-transfer-form--inline" hidden>
        ${camposTraslado(lang, t, transfer)}
        <button type="submit" class="nc-button nc-button--primary nc-coord-transfer-submit">${escapeHtml(t('coordinator.transfers.save'))}</button>
      </form>`}
    `,
    { extraClass: cancelled ? 'nc-card--muted' : '' },
  );
}

function renderTransfersScreen(ctx) {
  const { store, visitId, lang, t, flash, errors, requestError } = ctx;
  const title = t('coordinator.transfers.title');
  const record = store.getVisit(visitId);

  // Guard: visita inexistente → alternativa corta, sin formulario y sin
  // lanzar. Misma llave y mismo trato que itinerary.js, lodging.js y
  // qpass.js.
  if (!record) {
    return `
      <section class="nc-screen">
        <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
        <p class="nc-empty-state">${escapeHtml(t('coordinator.visitNotFound'))}</p>
      </section>
    `;
  }

  // `?? []`: los expedientes guardados antes de esta etapa no traen la
  // llave. Sin esto, abrir esta pestaña en una visita vieja reventaría.
  //
  // Copia nueva antes de ordenar — nunca se muta el arreglo de la store —
  // y por hora, no por orden de captura: la coordinadora casi siempre da de
  // alta el regreso después de la llegada, pero no siempre.
  const transfers = [...(record.transfers ?? [])].sort(
    (a, b) => instantMs(a.scheduledAt) - instantMs(b.scheduledAt),
  );

  const body = transfers.length === 0
    ? `<p class="nc-empty-state">${escapeHtml(t('coordinator.transfers.empty'))}</p>`
    : `<div class="nc-coord-transfer-list">${transfers.map((tr) => renderTransferCard(tr, lang, t)).join('\n')}</div>`;

  return `
    <section class="nc-screen">
      <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
      ${body}
      ${renderRequestError(requestError, t)}
      ${renderFormErrors(errors, t, CAMPOS_TRASLADO)}
      ${flash === 'saved' ? `<p class="nc-coord-transfer-saved" data-role="transfer-saved" role="status">${escapeHtml(t('coordinator.transfers.saved'))}</p>` : ''}
      <form data-role="add-transfer-form" class="nc-coord-transfer-form">
        ${camposTraslado(lang, t)}
        <button type="submit" class="nc-button nc-button--primary nc-coord-transfer-submit">${escapeHtml(t('coordinator.transfers.addTransfer'))}</button>
      </form>
    </section>
  `;
}

// Del formulario plano al objeto anidado que espera el servidor. Es el único
// sitio donde se hace esa traducción, y por eso vive junto a los <label>
// que la producen y no dentro de la store.
function valoresDelFormulario(form) {
  const f = form.elements;
  return {
    kind: f.kind.value,
    scheduledAt: f.scheduledAt.value,
    meetingPointId: f.meetingPointId.value,
    flightNumber: f.flightNumber.value,
    driverName: f.driverName.value,
    driverPhone: f.driverPhone.value,
    vehicleType: f.vehicleType.value,
    vehicleMake: f.vehicleMake.value,
    vehicleModel: f.vehicleModel.value,
    vehicleColor: f.vehicleColor.value,
    vehiclePlate: f.vehiclePlate.value,
    notes: f.notes.value,
  };
}

function aModelo(v) {
  return {
    kind: v.kind,
    scheduledAt: v.scheduledAt,
    meetingPointId: v.meetingPointId,
    flightNumber: v.flightNumber,
    driver: { name: v.driverName, phone: v.driverPhone },
    vehicle: {
      type: v.vehicleType,
      make: v.vehicleMake,
      model: v.vehicleModel,
      color: v.vehicleColor,
      plate: v.vehiclePlate,
    },
    notes: v.notes,
  };
}

function attachTransfersScreen(rootEl, ctx) {
  const { store, visitId, onChange, t } = ctx;

  // Los errores locales se pintan de forma imperativa, sin repintar: un
  // repintado borraría lo que la persona acaba de teclear, que es justo lo
  // que hay que corregir. Solo el camino válido repinta, y por eso su
  // confirmación la pinta el render desde ctx.flash y no este archivo.
  function limpiar(form) {
    form.querySelectorAll('[data-role="transfer-error"]').forEach((el) => {
      el.textContent = '';
      el.hidden = true;
    });
    rootEl.querySelector('[data-role="transfer-saved"]')?.remove();
  }

  function marcar(form, errors) {
    form.querySelectorAll('[data-role="transfer-error"]').forEach((el) => {
      const motivo = errors[el.dataset.field];
      if (!motivo) return;
      el.textContent = t(`coordinator.error.${motivo}`);
      el.hidden = false;
    });
    form.querySelector(`[name="${Object.keys(errors)[0]}"]`)?.focus();
  }

  const alta = rootEl.querySelector('[data-role="add-transfer-form"]');
  alta?.addEventListener('submit', (event) => {
    event.preventDefault();
    limpiar(alta);
    const values = valoresDelFormulario(alta);
    const { ok, errors } = validateTransfer(values);
    if (!ok) return marcar(alta, errors);
    store.addTransfer(visitId, aModelo(values)).then((res) => onChange?.(res, 'saved'));
  });

  // Mismo patrón que itinerary.js: el botón no captura nada, revela el
  // formulario inline de su propia tarjeta. Abrir uno cierra los demás para
  // que no queden dos ediciones a medias en pantalla; tras una mutación
  // exitosa el router repinta y todos vuelven a quedar ocultos solos.
  rootEl.querySelectorAll('[data-role="edit-transfer"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const target = rootEl.querySelector(`[data-role="edit-transfer-form"][data-transfer-id="${btn.dataset.transferId}"]`);
      if (!target) return;
      const estabaOculto = target.hidden;
      rootEl.querySelectorAll('.nc-coord-transfer-form--inline').forEach((f) => { f.hidden = true; });
      target.hidden = !estabaOculto;
      if (!target.hidden) target.querySelector('input, select')?.focus();
    });
  });

  rootEl.querySelectorAll('[data-role="edit-transfer-form"]').forEach((form) => {
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      limpiar(form);
      const values = valoresDelFormulario(form);
      const { ok, errors } = validateTransfer(values);
      if (!ok) return marcar(form, errors);
      store.editTransfer(visitId, form.dataset.transferId, aModelo(values)).then((res) => onChange?.(res, 'saved'));
    });
  });

  rootEl.querySelectorAll('[data-role="cancel-transfer"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      store.cancelTransfer(visitId, btn.dataset.transferId).then((res) => onChange?.(res, 'saved'));
    });
  });
}

// --- src/domain/expiry.js ---
// R1 — Caducidad del enlace (PRD §8).
//
//   expiresAt = max( última cita no cancelada ,
//                    checkout del hospedaje ,
//                    último traslado no cancelado ) + 24h
//
// `lodging` puede ser null (visita sin hospedaje, caso 1g) y `transfers`
// puede faltar (expedientes guardados antes de la Etapa G). Si además no
// hay ninguna cita no cancelada, no hay de dónde tomar el máximo: cae al
// caso degenerado 1e (visit.startsAt + 24h) para que el enlace no quede
// vivo para siempre.
//
// Etapa G — el traslado de REGRESO ocurre después de la última cita y
// después del checkout: sin él en el máximo, el enlace caducaba mientras el
// paciente esperaba el coche, con el teléfono del chofer adentro.
//
// D69 — ambas funciones reciben el EXPEDIENTE, no argumentos posicionales.
// Con un cuarto posicional antes de `now`, un punto de llamada olvidado le
// habría pasado `now` a `transfers` dejando `now` en undefined;
// `instantMs(undefined)` es NaN y `NaN > x` es false, así que el enlace
// habría dejado de caducar en silencio — justo lo que R1 existe para
// impedir. Con el expediente, ese mismo olvido revienta al leer `.visit` de
// undefined.


function lastNonCancelledAppointmentEndMs(appointments) {
  const ends = (appointments ?? [])
    .filter((a) => a.status !== 'cancelled')
    .map((a) => instantMs(a.startsAt) + a.durationMin * 60 * 1000);
  return ends.length > 0 ? Math.max(...ends) : null;
}

// Un traslado es un instante, no un intervalo: la coordinadora captura la
// hora de recogida y no cuánto dura el trayecto. Cuenta su `scheduledAt`
// tal cual, y las 24 horas de gracia de R1 cubren de sobra el camino.
function lastNonCancelledTransferMs(transfers) {
  const times = (transfers ?? [])
    .filter((tr) => tr.status !== 'cancelled')
    .map((tr) => instantMs(tr.scheduledAt));
  return times.length > 0 ? Math.max(...times) : null;
}

function computeExpiresAt(record) {
  const { visit, appointments, lodging, transfers } = record;

  const lastAppointmentEndMs = lastNonCancelledAppointmentEndMs(appointments);
  const checkoutMs = lodging ? instantMs(lodging.checkOut) : null;
  const lastTransferMs = lastNonCancelledTransferMs(transfers);

  const candidates = [lastAppointmentEndMs, checkoutMs, lastTransferMs].filter((v) => v !== null);
  const baseMs = candidates.length > 0 ? Math.max(...candidates) : instantMs(visit.startsAt);

  return toTijuanaIso(baseMs + 24 * HOUR_MS);
}

function isExpired(record, now) {
  const expiresAt = computeExpiresAt(record);
  return instantMs(now) > instantMs(expiresAt);
}

// --- src/domain/itinerary.js ---
// R5 — Cita movida (PRD §8) y agrupado del itinerario por día (PRD §9,
// "Visita de varios días").
//
// groupByDay incluye TODAS las citas, también las cancelled (§9 "Cita
// cancelada": permanece en la línea de tiempo, tachada y en gris). Que una
// cancelled quede fuera de "tu siguiente paso" lo decide nextStep.js, no
// este módulo.


function groupByDay(appointments, now) {
  const sorted = [...appointments].sort((a, b) => instantMs(a.startsAt) - instantMs(b.startsAt));

  const groups = new Map();
  for (const appointment of sorted) {
    const key = dayKeyTijuana(appointment.startsAt);
    if (!groups.has(key)) {
      groups.set(key, {
        dayKey: key,
        label: formatDayLabel(appointment.startsAt, now),
        items: [],
      });
    }
    groups.get(key).items.push(appointment);
  }

  return [...groups.values()].sort((a, b) => a.dayKey.localeCompare(b.dayKey));
}

// El distintivo "actualizado" se muestra si el cambio es posterior a la
// última vez que el paciente vio el itinerario en este dispositivo. Sin
// una marca previa (dispositivo nuevo, caso 5c) no se inventa una
// referencia: no hay distintivos.
function isUpdated(appointment, lastViewedItineraryAt) {
  if (lastViewedItineraryAt === null || lastViewedItineraryAt === undefined) return false;
  return instantMs(appointment.updatedAt) > instantMs(lastViewedItineraryAt);
}

// --- src/domain/nextStep.js ---
// R2 — "Tu siguiente paso" (PRD §8).
//
// Si existe una cita in_progress, esa es el siguiente paso. Si no, la
// scheduled más próxima con startsAt >= now. cancelled y done nunca son
// candidatas. Desempate determinista: startsAt, luego locationId, luego id.


function byTiebreak(a, b) {
  const byStart = instantMs(a.startsAt) - instantMs(b.startsAt);
  if (byStart !== 0) return byStart;
  const byLocation = a.locationId.localeCompare(b.locationId);
  if (byLocation !== 0) return byLocation;
  return a.id.localeCompare(b.id);
}

function nextStep(appointments, now) {
  const inProgress = appointments.filter((a) => a.status === 'in_progress');
  if (inProgress.length > 0) {
    return [...inProgress].sort(byTiebreak)[0];
  }

  const nowMs = instantMs(now);
  const upcoming = appointments.filter((a) => a.status === 'scheduled' && instantMs(a.startsAt) >= nowMs);
  if (upcoming.length === 0) return null;

  return [...upcoming].sort(byTiebreak)[0];
}

// --- src/domain/timeline.js ---
// Etapa G — línea de tiempo unificada del itinerario (citas + traslados).
//
// El día del paciente no está hecho solo de citas: si contrató el traslado,
// el coche que lo recoge a las 06:00 es lo primero que le pasa, y tiene que
// salir arriba de la cita de las 08:00 y no en otra pantalla.
//
// Este módulo NO agrupa ni formatea: solo etiqueta y ordena. El agrupado lo
// sigue haciendo groupByDay, que ya era genérico (solo lee `startsAt` y
// dayKeyTijuana) y por eso no se tocó — sus pruebas siguen significando
// exactamente lo mismo que antes de esta etapa.
//
// Los cancelados NO se filtran aquí, igual que groupByDay nunca filtró las
// citas canceladas (PRD §9): un traslado cancelado tachado es información;
// que se esfume, no. Filtrar es decisión de quien pinta, no del dominio.


function timelineItems(appointments, transfers) {
  const items = [
    ...(appointments ?? []).map((a) => ({ kind: 'appointment', startsAt: a.startsAt, entity: a })),
    ...(transfers ?? []).map((tr) => ({ kind: 'transfer', startsAt: tr.scheduledAt, entity: tr })),
  ];

  // Empate exacto de hora: primero la cita. Es a lo que el paciente tiene
  // que llegar; el traslado de esa misma hora es cómo llega o cómo se va.
  return items.sort((a, b) => {
    const diff = instantMs(a.startsAt) - instantMs(b.startsAt);
    if (diff !== 0) return diff;
    return a.kind === b.kind ? 0 : a.kind === 'appointment' ? -1 : 1;
  });
}

// El traslado que se anuncia en la tarjeta de Inicio (D71). Vive aquí y no
// en la pantalla por la misma razón que nextStep vive en el dominio: "cuál
// es el siguiente" es una regla, y una pantalla no puede probarse sin DOM.
//
// R2 no se toca: nextStep sigue siendo SOLO de citas, con sus ejemplos
// trabajados del PRD §8 intactos. Esto es su hermano para traslados, en su
// propia tarjeta.
//
// `now` entra como parámetro, nunca se lee el reloj (INV-1).
function nextTransfer(transfers, now) {
  const nowMs = instantMs(now);

  // Cancelados fuera, al revés que en timelineItems. No es incoherencia: el
  // itinerario tiene que mostrar el traslado cancelado —tachado— para que
  // el paciente no se plante a esperarlo; anunciarlo en Inicio como "tu
  // próximo traslado" sería justo lo contrario.
  const candidatos = (transfers ?? []).filter(
    (tr) => tr.status !== 'cancelled' && instantMs(tr.scheduledAt) >= nowMs,
  );
  if (candidatos.length === 0) return null;

  // Desempate por id, como nextStep: dos repintados del mismo minuto tienen
  // que anunciar el mismo traslado, no uno u otro según el orden en que
  // vinieron del servidor.
  return candidatos.reduce((mejor, tr) => {
    const diff = instantMs(tr.scheduledAt) - instantMs(mejor.scheduledAt);
    if (diff < 0) return tr;
    if (diff > 0) return mejor;
    return tr.id < mejor.id ? tr : mejor;
  });
}

// --- src/domain/index.js ---
// Superficie pública del dominio (Fase 01). Todo lo que vive fuera de
// src/domain/ debe importar de aquí, no de los archivos internos, salvo
// las propias pruebas de fase 01 (que verifican cada módulo por separado).

// --- src/render/code128.js ---
// Fase 06 — generador de Code128 (subset B) sin dependencias externas.
//
// Solo Code Set B: cubre ASCII imprimible 32–126 (`valor = código - 32`),
// que es todo lo que produce src/data/fixtures.js hoy (`payload-${id}`).
// A diferencia de qr.js (modo byte, acepta UTF-8 arbitrario), Code128 no
// tiene un "modo byte" universal — un payload con acentos simplemente no
// es representable en subset B y esta función lo rechaza con un mensaje
// claro en vez de corromperlo o transliterarlo por su cuenta.
//
// La tabla de 107 patrones de barras (CODES) y el algoritmo de checksum
// (start + Σ valor_i × posición_i, mod 103) se verificaron leyendo el
// código fuente de la librería de referencia python-barcode (MIT, PyPI)
// instalada en este entorno — no de memoria — y el símbolo resultante se
// decodificó con éxito con cv2.barcode_BarcodeDetector de OpenCV
// (independiente de este archivo y de esa librería) para varios textos.

const CODES = [
  '11011001100', '11001101100', '11001100110', '10010011000', '10010001100',
  '10001001100', '10011001000', '10011000100', '10001100100', '11001001000',
  '11001000100', '11000100100', '10110011100', '10011011100', '10011001110',
  '10111001100', '10011101100', '10011100110', '11001110010', '11001011100',
  '11001001110', '11011100100', '11001110100', '11101101110', '11101001100',
  '11100101100', '11100100110', '11101100100', '11100110100', '11100110010',
  '11011011000', '11011000110', '11000110110', '10100011000', '10001011000',
  '10001000110', '10110001000', '10001101000', '10001100010', '11010001000',
  '11000101000', '11000100010', '10110111000', '10110001110', '10001101110',
  '10111011000', '10111000110', '10001110110', '11101110110', '11010001110',
  '11000101110', '11011101000', '11011100010', '11011101110', '11101011000',
  '11101000110', '11100010110', '11101101000', '11101100010', '11100011010',
  '11101111010', '11001000010', '11110001010', '10100110000', '10100001100',
  '10010110000', '10010000110', '10000101100', '10000100110', '10110010000',
  '10110000100', '10011010000', '10011000010', '10000110100', '10000110010',
  '11000010010', '11001010000', '11110111010', '11000010100', '10001111010',
  '10100111100', '10010111100', '10010011110', '10111100100', '10011110100',
  '10011110010', '11110100100', '11110010100', '11110010010', '11011011110',
  '11011110110', '11110110110', '10101111000', '10100011110', '10001011110',
  '10111101000', '10111100010', '11110101000', '11110100010', '10111011110',
  '10111101110', '11101011110', '11110101110', '11010000100', '11010010000',
  '11010011100',
];
const STOP_PATTERN = '11000111010' + '11'; // patrón de paro + barra final ancha

const START_B = 104;
const MIN_CHAR = 32;
const MAX_CHAR = 126;

function charValueB(char) {
  const code = char.charCodeAt(0);
  if (code < MIN_CHAR || code > MAX_CHAR) {
    throw new Error(`code128: el carácter "${char}" (código ${code}) no está en el subset B (ASCII ${MIN_CHAR}–${MAX_CHAR})`);
  }
  return code - MIN_CHAR;
}

function encodedValues(text) {
  const values = [START_B];
  for (const char of text) values.push(charValueB(char));
  let checksum = values[0];
  for (let i = 1; i < values.length; i++) checksum += i * values[i];
  values.push(checksum % 103);
  return values;
}

// generateCode128Bars(text) -> string de '1'/'0' (ancho de barra=1 unidad
// por carácter), sin margen quieto. El renderer decide unidades por
// símbolo y margen.
function generateCode128Bars(text) {
  const values = encodedValues(text);
  return values.map((v) => CODES[v]).join('') + STOP_PATTERN;
}

function renderCode128Svg(text, { quietZone = 10, unitWidth = 2, height = 80 } = {}) {
  const bars = generateCode128Bars(text);
  const totalUnits = bars.length + quietZone * 2;
  const px = totalUnits * unitWidth;
  let rects = '';
  let x = quietZone * unitWidth;
  for (const bit of bars) {
    if (bit === '1') rects += `<rect x="${x}" y="0" width="${unitWidth}" height="${height}"/>`;
    x += unitWidth;
  }
  // Sin width/height explícitos en el <svg>: "auto" no es un valor válido
  // para el atributo SVG height (a diferencia de CSS) — el viewBox solo ya
  // alcanza para que escale, y el ancho/alto real lo pone el CSS del
  // contenedor (.nc-pass-symbol svg en src/ui/screens/pass.js).
  return `<svg viewBox="0 0 ${px} ${height}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="0" y="0" width="${px}" height="${height}" fill="#FFFFFF"/><g fill="#000000">${rects}</g></svg>`;
}

// decodeCode128Bars — SOLO para el redondeo de las pruebas de esta fase,
// igual que decodeQrMatrix en qr.js: no es un lector general (asume un
// símbolo bien formado, subset B puro, sin corrección de errores — Code128
// no la tiene, a diferencia de QR).
function decodeCode128Bars(bars) {
  if (!bars.endsWith(STOP_PATTERN)) {
    throw new Error('code128 decode: no termina en el patrón de paro esperado');
  }
  const body = bars.slice(0, -STOP_PATTERN.length);
  if (body.length % 11 !== 0) {
    throw new Error('code128 decode: longitud de cuerpo no es múltiplo de 11');
  }
  const values = [];
  for (let i = 0; i < body.length; i += 11) {
    const chunk = body.slice(i, i + 11);
    const idx = CODES.indexOf(chunk);
    if (idx === -1) throw new Error(`code128 decode: patrón de 11 bits no reconocido en la posición ${i}`);
    values.push(idx);
  }
  if (values[0] !== START_B) throw new Error('code128 decode: no empieza con START B — este decodificador solo entiende subset B');
  const dataValues = values.slice(1, -1);
  const checksum = values[values.length - 1];
  let expected = values[0];
  for (let i = 0; i < dataValues.length; i++) expected += (i + 1) * dataValues[i];
  if (expected % 103 !== checksum) throw new Error('code128 decode: checksum no coincide');
  return dataValues.map((v) => String.fromCharCode(v + MIN_CHAR)).join('');
}

const CODE128_CONFIG = { minChar: MIN_CHAR, maxChar: MAX_CHAR };

// --- src/ui/passCache.js ---
// Fase 06 — guarda el último estado de pases conocido en el dispositivo
// para que "sin conexión" siga mostrando algo (PRD/fase 06). Guarda los
// pases CRUDOS (con su propio revokedAt/validUntil), no un resultado ya
// filtrado: filtra de nuevo con visiblePasses (R3, fase 01) usando el
// `now` de cada apertura, nunca el guardado — así un pase revocado
// DESPUÉS de guardarse en caché deja de verse la próxima vez que se
// evalúa, en vez de quedar "congelado" como válido para siempre (INV-4).
//
// JSON.stringify/parse preserva `null` como `null` (no como string ni
// como campo ausente), así que `validUntil: null` sobrevive el viaje
// completo por localStorage sin ambigüedad — es el caso que el archivo de
// esta fase marca como "el fallo más caro": un null mal interpretado como
// fecha inválida apagaría un pase que en realidad nunca caduca.


const CACHE_KEY_PREFIX = 'nc_pass_cache:';

function savePassCache(visitId, passes, now) {
  const record = { visitId, passes, savedAt: now };
  localStorage.setItem(CACHE_KEY_PREFIX + visitId, JSON.stringify(record));
}

function loadPassCache(visitId) {
  const raw = localStorage.getItem(CACHE_KEY_PREFIX + visitId);
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.passes) || typeof parsed.savedAt !== 'string') return null;
    return parsed;
  } catch {
    return null; // JSON corrupto: se trata como "sin caché", no rompe la pantalla
  }
}

// getCachedVisiblePasses(visitId, now) -> { passes: Pass[], savedAt } | null
// Los `passes` ya vienen filtrados por R3 evaluado con el `now` de AHORA,
// no con el que tenía el dispositivo cuando se guardó la caché.
function getCachedVisiblePasses(visitId, now) {
  const cache = loadPassCache(visitId);
  if (!cache) return null;
  return { passes: visiblePasses(cache.passes, now), savedAt: cache.savedAt };
}

// --- src/ui/screens/pass.js ---
// Fase 06 — pantalla completa del QPASS. Reemplaza el placeholder de la
// fase 05 (que solo probaba R3 con texto plano). Comportamiento pedido
// por la fase:
//   - símbolo lo más grande posible, margen quieto, negro sobre blanco
//     puro — ESTA pantalla nunca usa tema oscuro, a propósito
//   - debajo: para qué acceso sirve y hasta qué hora vale
//   - varios pases válidos: deslizar entre ellos
//   - sin conexión: último pase guardado, con aviso "guardado a las HH:MM"
//   - Wake Lock mientras la pantalla esté abierta, si el navegador lo
//     soporta
//
// Brillo de pantalla al máximo: NO existe una API web estándar para
// controlarlo (por diseño — ninguna página puede subir el brillo del
// teléfono de alguien sin su permiso explícito fuera de flujos muy
// específicos). Se le pide al paciente que lo suba él mismo con un aviso
// en pantalla, en vez de fingir que la app lo hace.
//
// "Sin conexión" en ESTE prototipo: no hay backend real (fase 08, fuera
// de alcance) — nunca hay una petición de red que de verdad pueda
// fallar. El mecanismo de caché (src/ui/passCache.js) SÍ es real y está
// probado, pero no hay forma honesta de ejercitar "modo avión" sin una
// fuente de datos viva de la que desconectarse; por eso showFallback se
// deja disponible para cuando exista un backend, no se simula aquí.






// t como segundo parámetro (fase 09, D29): la rama 'image' necesita
// traducir pass.scope para el atributo alt de la imagen — a diferencia de
// 'qr'/'code128', que nunca tocaron t. Sin este parámetro la rama nueva
// lanzaría ReferenceError la primera vez que corriera (t no existe en el
// scope de nivel de módulo de esta función, solo dentro de
// attachPassScreen más abajo). Documentado así en el doc de fase 09 antes
// de escribir este archivo, precisamente para no repetir ese error.
function renderSymbol(pass, t) {
  try {
    if (pass.format === 'image') {
      // QPASS real (D29): una imagen que ya subió la coordinadora, no un
      // payload corto para que este archivo lo codifique — el símbolo ya
      // viene armado, solo se pinta. No pasa por generateQrMatrix ni por
      // el generador de Code128.
      return `<img src="${escapeHtml(pass.payload)}" alt="${escapeHtml(t(`pass.scope.${pass.scope}`))}" class="nc-pass-image" />`;
    }
    if (pass.format === 'code128') {
      return renderCode128Svg(pass.payload);
    }
    return renderQrSvg(generateQrMatrix(pass.payload));
  } catch (err) {
    // Un payload real que no quepa (QR) o tenga caracteres fuera de
    // subset B (Code128) no debe tumbar la pantalla completa — se avisa
    // en vez de dejar una página en blanco justo donde el paciente más
    // la necesita.
    return `<p class="nc-pass-error">${escapeHtml(err.message)}</p>`;
  }
}

function renderPassScreen(ctx) {
  const { t } = ctx;
  return `
    <section class="nc-screen nc-pass-screen">
      <h1 class="nc-screen-title">${escapeHtml(t('pass.title'))}</h1>
      <p class="nc-pass-brightness-hint">${escapeHtml(t('pass.brightnessHint'))}</p>
      <div data-role="pass-mount"></div>
    </section>
  `;
}

function attachPassScreen(rootEl, ctx) {
  const { visit, passes, now, lang, t, ephemeral } = ctx;
  const mount = rootEl.querySelector('[data-role="pass-mount"]');

  const live = visiblePasses(passes, now);
  let source, savedAt;
  if (live.length > 0) {
    // ephemeral (fase 09, D29): bandera opt-in, default undefined/false —
    // el resto del proyecto (la sesión real del paciente vía app.js) nunca
    // la pasa, así que su comportamiento aquí queda byte a byte igual que
    // fase 06. La única llamada que SÍ pasa ephemeral: true es la ruta
    // #/pass-preview de coordinatorApp.js: ese botón abre el pase de una
    // visita AJENA (la que esté armando la coordinadora en ese momento),
    // sobre el mismo localStorage del navegador — sin este guard,
    // guardaría ahí el payload real de esa visita, violando la promesa
    // explícita del doc de esa fase ("nunca... localStorage"). Fix de
    // revisión adversarial, fase 09 — se coló en la primera pasada porque
    // nadie había ejecutado #/pass-preview de verdad, solo leído el código
    // (ver test/ui/pass.test.js para el porqué de la prueba dedicada).
    //
    // format:'image' (D29) sigue quedando fuera del caché aparte de esto,
    // sin importar ephemeral: es una data: URL completa, no el string
    // corto que este mecanismo manejaba hasta ahora, y la demo de fase 09
    // promete que nada de lo que emite sobrevive un refresh — si se
    // guardara aquí, esa promesa se rompería justo por este archivo.
    // qr/code128 se siguen cacheando exactamente igual que en fase 06
    // cuando ephemeral no está activo.
    if (!ephemeral) {
      savePassCache(visit.id, passes.filter((p) => p.format !== 'image'), now);
    }
    source = live;
    savedAt = null;
  } else {
    const cached = getCachedVisiblePasses(visit.id, now);
    source = cached ? cached.passes : [];
    savedAt = cached ? cached.savedAt : null;
  }

  let index = 0;
  requestWakeLock();

  function render() {
    if (source.length === 0) {
      mount.innerHTML = `<p class="nc-pass-empty">${escapeHtml(t('pass.empty'))}</p>`;
      return;
    }
    const pass = source[index];
    const offlineNotice = savedAt
      ? `<p class="nc-pass-offline">${escapeHtml(t('pass.offline'))} · ${escapeHtml(t('pass.savedAt')(formatSavedAt(savedAt)))}</p>`
      : '';
    const validUntilText = pass.validUntil ? t('pass.validUntil')(formatSavedAt(pass.validUntil)) : t('pass.noExpiry');
    const nav =
      source.length > 1
        ? `<div class="nc-pass-nav">
            <button type="button" class="nc-button" data-role="pass-prev" ${index === 0 ? 'disabled' : ''}>${escapeHtml(t('map.routePrev'))}</button>
            <span class="nc-pass-count">${index + 1} / ${source.length}</span>
            <button type="button" class="nc-button" data-role="pass-next" ${index === source.length - 1 ? 'disabled' : ''}>${escapeHtml(t('map.routeNext'))}</button>
          </div>`
        : '';
    mount.innerHTML = `
      ${offlineNotice}
      <div class="nc-pass-symbol">${renderSymbol(pass, t)}</div>
      <p class="nc-pass-scope">${escapeHtml(t(`pass.scope.${pass.scope}`))}</p>
      <p class="nc-pass-expiry">${escapeHtml(validUntilText)}</p>
      ${nav}
    `;
    mount.querySelector('[data-role="pass-prev"]')?.addEventListener('click', () => {
      if (index > 0) { index--; render(); }
    });
    mount.querySelector('[data-role="pass-next"]')?.addEventListener('click', () => {
      if (index < source.length - 1) { index++; render(); }
    });
  }

  render();
}

function formatSavedAt(iso) {
  // Solo hora, formato de reloj de 24h simple para el aviso "guardado a
  // las HH:MM" — no usa formatTimeTijuana (esa función es AM/PM, fase 01)
  // para no forzar una convención horaria distinta a la de esta nota
  // corta; es texto de UI, no una regla de dominio.
  const d = new Date(iso);
  return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
}

let wakeLockSentinel = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
  } catch {
    // Puede fallar por permisos, pestaña no visible, etc. — no es un
    // error que deba interrumpir la pantalla del pase.
  }
}

// --- src/ui/theme.js ---
// Tokens de marca (mismos que la presentación: navy #1C2B53, teal #14BCC4,
// blanco, tinte #EEF3F8, Barlow) más el armazón de layout. `--nc-teal-ink`

// --- src/ui/urlParams.js ---
// Etapa F (#17) — lectura de la query string, compartida por los dos
// puntos de entrada.
//
// `?now=` nació en la fase 05 dentro de src/ui/app.js: ancla el "ahora" a
// la fecha de las fixtures (todas de 2026) para poder recorrer el
// prototipo sin que cada cita se vea vencida. El panel de coordinación no
// lo tenía, y #/pass-preview —que reusa la misma pantalla del pase del
// paciente— aplicaba R3 contra el reloj real: el pase de una visita de
// marzo de 2026 se veía revocado siempre.
//
// Copiar la función al otro archivo habría bastado hoy y se habría
// separado mañana. Vive aquí por eso, y porque encerrada dentro de
// app.js no había forma de probarla: app.js necesita DOM.
//
// Lo que este módulo NO hace: leer el reloj real. Eso sigue siendo
// privilegio de los dos boot() (D20, y el encabezado de coordinatorApp.js
// para el segundo). Aquí solo se decide si lo que trae la URL es una
// fecha usable.

// parseNowOverride(search) -> string ISO tal cual venía | null
//
// Devuelve el TEXTO ORIGINAL, no un Date. Todo src/domain/ compara ISO
// contra ISO y el offset forma parte del dato: pasar por Date y volver a
// serializar convertiría '2026-03-10T10:00-07:00' en UTC y movería siete
// horas la hora que ve el paciente.
function parseNowOverride(search) {
  const raw = new URLSearchParams(search).get('now');
  if (!raw) return null;
  // Un `now` que no se entiende se DESCARTA, no rompe: un enlace mal
  // pegado en WhatsApp no puede ser la diferencia entre ver el itinerario
  // y ver una pantalla en blanco.
  return Number.isNaN(new Date(raw).getTime()) ? null : raw;
}
