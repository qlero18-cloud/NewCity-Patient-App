  ("ese ajuste se decide al implementar la fase, no aquí"). Mientras
  tanto, este archivo se sirve sin construir, igual que app.html sin
  construir: `python3 -m http.server`, nunca `file://` (mismo motivo que
  README.md — un import de módulo ES vía file:// falla por CORS en la
  mayoría de navegadores).
-->
<title>NewCity — Coordinación</title>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { boot } from './src/ui/coordinatorApp.js';
  boot(document.getElementById('app'));
