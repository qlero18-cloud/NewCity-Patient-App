<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<!--
  Fuente del panel de coordinación. Simétrico con app.html: un único
  módulo ES que llama boot(root), y build.py lo empaqueta en el archivo
  que de verdad se publica — aquí coordinator.html, allá index.html.

  Se llamaba coordinator.html hasta la Etapa F (#10), cuando este archivo
  pasó a ser fuente y le cedió ese nombre al empaquetado: la URL del panel
  no cambió, lo que cambió es que ahora se sirve construido.

  Este archivo se abre sin construir para desarrollar (`netlify dev` o
  `python3 -m http.server`, nunca `file://`: un import de módulo ES vía
  file:// falla por CORS en la mayoría de navegadores). Editar aquí no
  basta para que el panel publicado cambie — hay que correr `python3
  build.py` y volver a commitear coordinator.html; `build.py --check` y
  test/deploy/bundleUpToDate.test.js fallan si se olvida.

  A diferencia de app.html no hay `?p=` ni token de paciente que resolver:
  coordinatorApp.js aterriza en la pantalla de acceso y, con sesión, en la
  lista de visitas.

  Ojo al editar este comentario: no escribas un tag de script literal aquí
  dentro. build.py busca el primer tag de módulo del documento y un
  comentario que lo mencione engancha primero, llevándose la prosa hasta
  el cierre del script real. Pasó, y el resultado fue una página en blanco
  en producción con todo verde en local.
-->
<title>NewCity — Coordinación</title>
</head>
<body>
<div id="app"></div>
<script>
(function () {
// --- src/ui/visitRecord.js ---
// Etapa E — "¿esto tiene forma de expediente?", preguntado en los dos
// bordes por donde puede entrar uno que no lo sea:
//
//   - api.js, cuando el servidor contesta 200 con algo que no es lo que
//     dice ser (proxy, portal cautivo del wifi del hospital).
//   - visitCache.js, cuando lo guardado lo escribió una versión anterior
//     de la app, quedó truncado, o alguien lo editó a mano.
//
// Está en un módulo propio y no copiado en los dos porque es exactamente
// el tipo de predicado que se arregla en un lado y se olvida en el otro:
// el día que las pantallas empiecen a dar por hecho un campo más, hay UN
// lugar donde agregarlo.
//
// Valida solo lo que las pantallas dan por hecho sin preguntar. No valida
// el contenido —eso ya lo hizo el servidor al guardarlo— sino que exista
// la estructura sobre la que renderHomeScreen y compañía iteran a ciegas.

function isVisitRecord(value) {
  return Boolean(
    value
    && typeof value === 'object'
    && value.visit
    && typeof value.visit.id === 'string'
    && Array.isArray(value.appointments)
    && Array.isArray(value.passes)
  );
}

// --- src/ui/api.js ---
// Etapa D — el transporte HTTP del panel. Lo único de src/ui/ que toca la
// red, y a propósito: coordinatorStore.js recibe esto inyectado, así que se
// prueba entero sin fetch y sin fake DOM.
//
// createHttpApi devuelve `{ status, body }` crudo y NO interpreta nada.
// Quién decide que un 422 es "corrige el formulario" y un 401 es "vuelve a
// entrar" es el store; aquí solo se traduce de Response a objeto. Meter esa
// decisión en las dos capas es garantizar que un día no coincidan.
//
// createVisitApi (Etapa E, al final del archivo) sí interpreta, y ahí se
// explica por qué el lado paciente es distinto.


const FALLA_LECTURA = 'respuesta ilegible del servidor';

// Dos bases, porque son dos Functions distintas: coordinator.mjs atiende
// /api/coordinator/* y auth.mjs atiende /api/auth/*. Están aquí como
// constantes con nombre y no incrustadas en una cadena porque boot() ya se
// equivocó una vez: reusó el api de coordinación para el cliente de acceso
// y el panel entró a /api/coordinator/login, que no existe. La pantalla se
// veía bien y ningún test lo veía (test/ui/api.test.js lo fija ahora,
// contra las constantes que exporta el servidor).
const COORDINATOR_BASE = '/api/coordinator';
const AUTH_BASE = '/api/auth';

function createHttpApi({ fetch: fetchImpl = globalThis.fetch, base = COORDINATOR_BASE } = {}) {
  return {
    async request(method, path, body) {
      const init = {
        method,
        // La sesión es una cookie HttpOnly firmada (Etapa C): el navegador
        // solo la manda si se le pide. Sin esta línea TODO contesta 401 y
        // el síntoma que se ve —"el panel no guarda"— no apunta para acá.
        credentials: 'same-origin',
      };

      // Sin cuerpo en GET: `new Request` lo prohíbe, y mandar content-type
      // sin cuerpo convierte una petición simple en una con preflight sin
      // ganar nada a cambio.
      if (body !== undefined) {
        init.headers = { 'content-type': 'application/json' };
        init.body = JSON.stringify(body);
      }

      // Un fallo de red (fetch rechaza) sube tal cual: el store lo atrapa y
      // lo reporta como falla. Envolverlo aquí en un `{status: 0}` inventado
      // sería fabricar una respuesta que nunca existió.
      const res = await fetchImpl(`${base}${path}`, init);

      // 204 no tiene cuerpo y eso no es un error: es lo que contesta
      // logout.
      if (res.status === 204) return { status: 204, body: null };

      let parsed = null;
      let ilegible = false;
      try {
        parsed = await res.json();
      } catch {
        ilegible = true;
      }

      // Un 2xx cuyo cuerpo no se puede leer NO es un éxito con datos
      // vacíos: es un servidor roto, un proxy metiéndose en medio, o una
      // página de login de algún intermediario. Devolverlo como éxito haría
      // que el store guarde un expediente vacío y lo pinte como cierto.
      // En un error, en cambio, el status ya dice lo suficiente: un 401 con
      // página HTML de Netlify sigue siendo un 401.
      if (ilegible && res.status >= 200 && res.status < 300) {
        throw new Error(`${FALLA_LECTURA} (${res.status})`);
      }

      return { status: res.status, body: ilegible ? null : parsed };
    },
  };
}

// El mismo transporte apuntando a la otra Function. Existe como función
// propia y no como `createHttpApi({ base: AUTH_BASE })` en el llamador para
// que armar el cliente de acceso no dependa de que quien lo arma se
// acuerde de cambiar la base — que es exactamente lo que no pasó.
function createAuthApi(opciones = {}) {
  return createHttpApi({ ...opciones, base: AUTH_BASE });
}

// Etapa E — el lado del PACIENTE. Vive aquí porque este archivo es lo
// único de src/ui/ con permiso de tocar la red, pero no comparte cuerpo con
// createHttpApi y es a propósito:
//
//   - Se identifica con un encabezado, no con una cookie de sesión.
//   - Manda credentials:'omit'. Si la coordinadora abre el enlace de un
//     paciente desde el mismo navegador donde tiene el panel abierto, su
//     cookie de sesión NO tiene por qué viajar a este endpoint público.
//   - Interpreta el status y devuelve un resultado. En el panel esa
//     decisión la toma el store; del lado paciente no hay store, y dejar
//     `{status}` crudo solo movería el `if` a app.js.
//
// Los valores están duplicados a propósito respecto del servidor —
// importar src/server/ desde src/ui/ metería el handler entero en el bundle
// del paciente (build.py sigue los imports). La paridad la fija
// test/ui/api.test.js contra visitHandler.js y contra el config de la
// propia Function.
const VISIT_PATH = '/api/visit';
const VISIT_TOKEN_HEADER = 'X-Visit-Token';

// getVisit(token) -> { ok: true, record } | { ok: false, notFound: true }
//                                         | { ok: false, failed: true }
//
// `notFound` y `failed` son dos cosas distintas y la diferencia importa:
// un 404 significa "esta visita ya no existe o venció" (el servidor
// contesta lo mismo para los tres casos, INV-3) y obliga a tirar la caché
// local; una falla significa "no se pudo preguntar" y es justo cuando la
// caché tiene que servir. Confundirlas deja visitas vencidas abriéndose
// para siempre en el teléfono, o pantallas en blanco por perder el wifi.
function createVisitApi({ fetch: fetchImpl = globalThis.fetch } = {}) {
  return {
    async getVisit(token) {
      let res;
      try {
        res = await fetchImpl(VISIT_PATH, {
          method: 'GET',
          headers: { [VISIT_TOKEN_HEADER]: token },
          credentials: 'omit',
          cache: 'no-store',
        });
      } catch {
        return { ok: false, failed: true };
      }

      if (res.status === 404) return { ok: false, notFound: true };
      if (res.status < 200 || res.status >= 300) return { ok: false, failed: true };

      let body;
      try {
        body = await res.json();
      } catch {
        // 200 ilegible: portal cautivo del wifi del hospital, proxy, página
        // de error. No es un expediente vacío, es no haber llegado.
        return { ok: false, failed: true };
      }

      if (!isVisitRecord(body)) return { ok: false, failed: true };
      return { ok: true, record: body };
    },
  };
}

// --- src/ui/authClient.js ---
// Etapa D — el lado del navegador de la auth de la Etapa C.
//
// No guarda nada. La sesión vive en una cookie HttpOnly firmada por el
// servidor, que es precisamente la que JavaScript no puede leer: por eso
// "¿hay sesión?" se contesta preguntándole al servidor (`session()`) y no
// mirando una variable local. La contraseña se manda y se suelta; este
// módulo no tiene dónde guardarla y la prueba lo fija.

function createAuthClient({ api }) {
  async function pedir(method, path, body) {
    try {
      return await api.request(method, path, body);
    } catch {
      return null; // red caída
    }
  }

  return {
    // Se llama al abrir el panel, antes de que nadie haya hecho nada. Un
    // 401 aquí es la respuesta NORMAL —todavía no hay sesión—, no una
    // falla. Confundirlos haría que el panel muestre "algo salió mal" cada
    // vez que alguien lo abre por la mañana.
    async session() {
      const res = await pedir('GET', '/session');
      if (!res) return { ok: false, failed: true };
      if (res.status === 200) return { ok: true, user: res.body?.user };
      if (res.status === 401) return { ok: false, unauthenticated: true };
      return { ok: false, failed: true };
    },

    async signIn({ username, password }) {
      const res = await pedir('POST', '/login', { username, password });
      if (!res) return { ok: false, failed: true };
      if (res.status === 200) return { ok: true, user: res.body?.user };
      // Un solo motivo, porque el servidor da uno solo: usuario que no
      // existe, contraseña mala y cuenta bloqueada salen todos por el mismo
      // 401 (authHandler.js:38). El cliente no inventa una distinción que
      // el servidor se negó a dar.
      if (res.status === 401) return { ok: false, invalidCredentials: true };
      // Todo lo demás es del servidor, no de quien teclea. Sin
      // SESSION_SECRET las Functions truenan con 500, y llamarle a eso
      // "contraseña incorrecta" manda a probar contraseñas media hora en
      // vez de a revisar la variable de entorno.
      return { ok: false, failed: true };
    },

    // Siempre ok. Quien le dio a "Salir" quiere dejar de tener sesión en
    // esta pantalla; dejarla abierta porque la red falló es lo contrario de
    // lo que pidió, y en una máquina compartida de coordinación eso sí
    // importa. La cookie sigue viva del lado del servidor hasta que caduque
    // —una cookie firmada no se puede invalidar desde aquí— pero el panel
    // se cierra, que es lo que está en manos del cliente hacer.
    async signOut() {
      await pedir('POST', '/logout');
      return { ok: true };
    },
  };
}

// --- src/ui/util.js ---
// Fase 05 — utilidades compartidas de presentación. Sin lógica de fechas ni
// de negocio (eso vive en src/domain/): solo escapado de texto y armado de
// atributos, que es responsabilidad legítima de la capa de UI.

// La comilla simple también se escapa: este proyecto arma atributos por
// concatenación de plantillas, y aunque hoy todas las comillas de atributo
// son dobles, un nombre como "Farmer's Table" dentro de un atributo con
// comillas simples se escaparía del valor. Escapar los cinco caracteres
// cuesta lo mismo que escapar cuatro y quita la dependencia de que quien
// escriba la siguiente plantilla se acuerde de usar comillas dobles.
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// classNames(['a', cond && 'b', 'c']) -> "a c"  (omite valores falsy)
function classNames(list) {
  return list.filter(Boolean).join(' ');
}

// Nombre de ubicación en el idioma activo, con reserva razonable si el id
// no existiera en el catálogo (no debería pasar — probado en fase 03/04 —
// pero una pantalla nunca debe reventar por un locationId huérfano).
function locationName(locations, locationId, lang) {
  const loc = getLocationById(locations, locationId);
  if (!loc) return locationId;
  return loc.name[lang] ?? loc.name.es;
}

// El mismo .find() estaba repetido inline en media docena de sitios. Vive
// aquí para que "buscar una Location por id" tenga un solo nombre.
function getLocationById(locations, locationId) {
  return locations.find((l) => l.id === locationId) ?? null;
}

// Opciones de un <select> de ubicación, en el idioma activo. La comparten
// el formulario de agregar cita y el de editar (src/ui/screens/coordinator/
// itinerary.js), que necesitan la misma lista pero con distinto valor
// preseleccionado.
function locationOptionsHtml(locations, lang, selectedId = null) {
  return locations
    .map((loc) => {
      const selected = loc.id === selectedId ? ' selected' : '';
      return `<option value="${escapeHtml(loc.id)}"${selected}>${escapeHtml(loc.name[lang] ?? loc.name.es)}</option>`;
    })
    .join('\n');
}

// Etapa G — los puntos de encuentro de un traslado comparten la forma
// {id, name:{es,en}} con las ubicaciones, pero NO son ubicaciones (D70): no
// tienen mapPointId ni salen en el plano. Esta función existe para que las
// pantallas de traslado no llamen algo llamado "location" sobre un catálogo
// que se separó a propósito; el cuerpo se parece porque la forma se parece.
function transferPointName(points, pointId, lang) {
  const punto = points.find((p) => p.id === pointId) ?? null;
  if (!punto) return pointId;
  return punto.name[lang] ?? punto.name.es;
}

// Aquí sí hay una diferencia real con locationOptionsHtml, y es la razón de
// que no se reuse: tres de los cinco puntos están sin confirmar (§15.8) y
// la coordinadora tiene que verlo MIENTRAS elige, no después. Un <option>
// no admite un elemento de distintivo adentro, así que la marca va como
// sufijo del texto.
function transferPointOptionsHtml(points, lang, selectedId = null, unconfirmedLabel = '') {
  return points
    .map((punto) => {
      const selected = punto.id === selectedId ? ' selected' : '';
      const nombre = punto.name[lang] ?? punto.name.es;
      const sufijo = punto.unconfirmed && unconfirmedLabel ? ` [${unconfirmedLabel}]` : '';
      return `<option value="${escapeHtml(punto.id)}"${selected}>${escapeHtml(nombre + sufijo)}</option>`;
    })
    .join('\n');
}

// --- src/ui/components/badge.js ---
// Distintivo reusable: [POR CONFIRMAR] (unconfirmed: true en cualquier
// dato de src/data/) y "actualizado" (R5, cita movida). Mismo componente,
// variantes distintas de color — nunca texto libre inventado por cada
// pantalla por separado.


function renderBadge(text, variant = 'neutral') {
  return `<span class="nc-badge nc-badge--${escapeHtml(variant)}">${escapeHtml(text)}</span>`;
}

function renderUnconfirmedBadge(t) {
  return renderBadge(t('common.unconfirmedBadge'), 'unconfirmed');
}

// Fix (verificación fase 09): renderBadge(text, variant = 'neutral') tenía
// 'neutral' como default desde su primera versión (fase 05), y ya se
// llamaba así en dos pantallas reales — hours.js ("horario desconocido") y
// screens/coordinator/qpass.js ("QPASS pendiente", fase 09) — pero nunca
// existió la regla .nc-badge--neutral: esos dos badges se pintaban sin
// ningún estilo, con solo el markup de .nc-badge desnudo. A diferencia de
// los otros 3 colores (cada uno ligado a un significado semántico propio:
// aviso, actualizado, cancelado) 'neutral' no tiene un matiz propio — se
// funda en --nc-ink (src/ui/theme.js) tal cual, el mismo color de texto ya
// usado en toda la app, en vez de inventar un gris nuevo sin relación con
// el resto de la paleta; el fondo es un tinte intermedio entre --nc-bg y
// --nc-card-border (claro) / --nc-card-bg y --nc-card-border (oscuro) —
// mismo criterio estructural que los otros 3 pares, sin matiz de color
// propio.
const BADGE_CSS = `
.nc-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; line-height: 1.4; white-space: nowrap; }
.nc-badge--unconfirmed { background: #FBEBD2; color: #8A5A00; }
.nc-badge--updated { background: #DFF3EE; color: #106657; }
.nc-badge--cancelled { background: #F4E1E1; color: #8A2A2A; }
.nc-badge--neutral { background: #E4E9F1; color: #1C2B53; }
@media (prefers-color-scheme: dark) {
  .nc-badge--unconfirmed { background: #4A3110; color: #F2C97D; }
  .nc-badge--updated { background: #103B32; color: #8FDFCB; }
  .nc-badge--cancelled { background: #3B1F1F; color: #E9A9A9; }
  .nc-badge--neutral { background: #2A3654; color: #F2F5FA; }
}
`;

// --- src/ui/components/card.js ---
// Tarjeta genérica: contenedor con esquinas redondeadas y sombra sutil,
// reusado por Inicio (siguiente paso), Itinerario (cada cita), Plaza (cada
// venue) y Mi estancia. `variant` solo cambia acento visual, nunca texto.


function renderCard(innerHtml, { variant = 'default', extraClass = '' } = {}) {
  return `<div class="${classNames(['nc-card', `nc-card--${variant}`, extraClass])}">${innerHtml}</div>`;
}

const CARD_CSS = `
.nc-card { background: var(--nc-card-bg); border: 1px solid var(--nc-card-border); border-radius: 14px; padding: 14px 16px; }
.nc-card--accent { border-color: var(--nc-teal); border-width: 2px; }
.nc-card--muted { opacity: 0.7; }
`;

// --- src/ui/coordinatorStore.js ---
// Etapa D — el store del panel. Era una copia en memoria de las fixtures
// (fase 09) y ahora habla con /api/coordinator.
//
// Lo que cambia respecto de la fase 09:
//
//   · Recargar ya no borra nada (#16). Lo que se captura queda en Blobs.
//   · El token que se acuña al crear la visita SALE de aquí, en vez de
//     morir en el router (coordinatorApp.js:238). Es lo que la Etapa E
//     convierte en enlace y QR.
//   · "No existe" tiene un solo resultado con nombre en vez de un null que
//     se confunde con "no válido" (#11).
//   · Nadie valida en el navegador y ya: el servidor rechaza, y el motivo
//     por campo vuelve al formulario.
//
// FORMA: las lecturas son SÍNCRONAS y salen de una copia local; las
// mutaciones son asíncronas. Es a propósito. Las cinco pantallas del panel
// pintan HTML de un jalón, sin await, y sus ~1400 líneas de prueba dependen
// de eso; volverlas asíncronas sería reescribir la fase 09 entera para
// mover datos de un lado a otro. Así que el ciclo es: cargar → pintar, y la
// copia local es lo que se pintó.
//
// La copia local es una VISTA, no una segunda fuente de verdad: se
// reemplaza entera con lo que devuelve el servidor y nunca se parchea a
// mano. Si el panel adivinara el resultado de cada mutación, dos
// coordinadoras sobre la misma visita divergirían a la primera edición y
// ninguna de las dos sabría cuál pantalla está mintiendo.
//
// `now` desaparece de la firma de las mutaciones. Antes lo pasaba
// coordinatorApp.js desde el reloj del navegador; ahora la hora de lo que
// se guarda la pone el servidor, que es el único que puede decirla igual
// para todos. Un reloj mal puesto en la máquina de coordinación estampaba
// esa hora en el expediente que después lee el paciente.

// El transporte se inyecta (`api.request(method, path, body)`) en vez de
// llamar a fetch aquí: así este archivo se prueba entero sin red y sin
// fake DOM, que es la regla del proyecto. createHttpApi() de api.js es la
// implementación real.
function createCoordinatorStore({ api }) {
  // Dos mapas y no uno, porque son dos cosas distintas y confundirlas se
  // ve igual en pantalla: `summaries` es lo que trae GET /visits (solo los
  // Visit, sin citas ni pases ni token); `records` es lo que trae GET
  // /visits/:id (el expediente completo). Meter resúmenes en `records` con
  // `appointments: []` diría "esta visita no tiene citas" cuando lo cierto
  // es "todavía no las pedí" — y un itinerario vacío se pinta idéntico.
  const summaries = new Map();
  const records = new Map();

  // Traduce la respuesta HTTP al resultado que la pantalla sabe manejar.
  // Cuatro fallos distintos y con nombre, porque la pantalla hace cuatro
  // cosas distintas: marcar campos, decir "esa visita ya no está", mandar
  // a entrar de nuevo, o pedir que se reintente.
  async function pedir(method, path, body) {
    let res;
    try {
      res = await api.request(method, path, body);
    } catch {
      // Red caída, DNS, el túnel de netlify dev apagado. Es lo mismo que
      // un 500 para quien está capturando: no es su culpa y no hay campo
      // que corregir.
      return { ok: false, failed: true };
    }

    if (res.status >= 200 && res.status < 300) return { ok: true, body: res.body ?? {} };
    if (res.status === 401) return { ok: false, unauthenticated: true };
    if (res.status === 404) return { ok: false, notFound: true };
    // 422 sin `errors` sería una respuesta rota del servidor; el objeto
    // vacío deja que el formulario marque "algo" en vez de tronar al
    // recorrer undefined.
    if (res.status === 422) return { ok: false, errors: res.body?.errors ?? {} };
    return { ok: false, failed: true };
  }

  // Toda mutación devuelve el expediente completo (`record`) más la
  // entidad que tocó. Se guarda el expediente y se entrega la entidad:
  // quien acaba de crear una cita necesita su id, y buscarlo dentro del
  // registro sería adivinar cuál de las citas es la nueva.
  async function mutar(method, path, body, llave) {
    const res = await pedir(method, path, body);
    if (!res.ok) return res;

    if (res.body.record) records.set(res.body.record.visit.id, res.body.record);
    return { ok: true, [llave]: res.body[llave] };
  }

  return {
    // ---- carga ----

    async loadVisits() {
      const res = await pedir('GET', '/visits');
      if (!res.ok) return res;

      summaries.clear();
      for (const visit of res.body.visits ?? []) summaries.set(visit.id, { visit });
      return { ok: true };
    },

    async loadVisit(visitId) {
      const res = await pedir('GET', `/visits/${encodeURIComponent(visitId)}`);
      if (!res.ok) return res;

      records.set(visitId, res.body);
      return { ok: true };
    },

    // ---- lecturas (síncronas, de la copia local) ----

    // Los resúmenes NO traen appointments/passes/lodging. La pantalla de
    // visitas solo lee `.visit` (screens/coordinator/visits.js:41), y si
    // algún día lee más, lo correcto es que reviente ahí y no que pinte
    // una lista vacía como si fuera un dato.
    listVisits() {
      return [...summaries.values()];
    },

    getVisit(visitId) {
      return records.get(visitId) ?? null;
    },

    getVisitWithPasses(visitId) {
      const r = records.get(visitId);
      return r ? { visit: r.visit, passes: r.passes } : null;
    },

    // ---- mutaciones (asíncronas, contra el servidor) ----

    async createVisit(input) {
      const res = await pedir('POST', '/visits', input);
      if (!res.ok) return res;

      const { visit } = res.body;
      // El resumen se agrega de una vez para que la lista quede al día sin
      // otra vuelta a la red. Es el único caso en que se escribe la copia
      // local con algo que no vino de una relectura — y aun así el dato es
      // del servidor, no del formulario.
      summaries.set(visit.id, { visit });
      // El expediente recién creado se conoce entero: está vacío porque
      // acaba de nacer, no porque falte pedirlo.
      records.set(visit.id, { visit, appointments: [], passes: [], lodging: null, transfers: [] });
      // Con token: es lo único que hay para mandarle al paciente y hasta
      // hoy se tiraba a la basura.
      return { ok: true, visit };
    },

    addAppointment(visitId, input) {
      return mutar('POST', `/visits/${encodeURIComponent(visitId)}/appointments`, input, 'appointment');
    },

    moveAppointment(visitId, appointmentId, startsAt) {
      return mutar(
        'PATCH',
        `/visits/${encodeURIComponent(visitId)}/appointments/${encodeURIComponent(appointmentId)}`,
        { action: 'move', startsAt },
        'appointment',
      );
    },

    // Editar cubre serviceName/durationMin/locationId nada más. startsAt
    // sigue siendo trabajo de moveAppointment, y status no se toca: el
    // enum cerrado de Appointment.status (PRD §7) no tiene un valor para
    // "editado" porque editar contenido no es un cambio de estado. El
    // servidor lo impone además de esto (visitMutations.js).
    editAppointment(visitId, appointmentId, input) {
      return mutar(
        'PATCH',
        `/visits/${encodeURIComponent(visitId)}/appointments/${encodeURIComponent(appointmentId)}`,
        { action: 'edit', ...input },
        'appointment',
      );
    },

    cancelAppointment(visitId, appointmentId) {
      return mutar(
        'PATCH',
        `/visits/${encodeURIComponent(visitId)}/appointments/${encodeURIComponent(appointmentId)}`,
        { action: 'cancel' },
        'appointment',
      );
    },

    setLodging(visitId, lodging) {
      return mutar('PUT', `/visits/${encodeURIComponent(visitId)}/lodging`, lodging, 'lodging');
    },

    issueQpass(visitId, input) {
      return mutar('POST', `/visits/${encodeURIComponent(visitId)}/passes`, input, 'qpass');
    },

    // Revocar es PATCH y no DELETE porque no borra nada: le estampa
    // revokedAt al pase y lo deja en la lista. Un pase emitido es historia
    // de la visita — quién entró con qué y hasta cuándo — y esa historia
    // no se reescribe (§6.5).
    revokeQpass(visitId, passId) {
      return mutar(
        'PATCH',
        `/visits/${encodeURIComponent(visitId)}/passes/${encodeURIComponent(passId)}`,
        { action: 'revoke' },
        'qpass',
      );
    },

    // ---- traslados (Etapa G) ----

    addTransfer(visitId, input) {
      return mutar('POST', `/visits/${encodeURIComponent(visitId)}/transfers`, input, 'transfer');
    },

    editTransfer(visitId, transferId, input) {
      return mutar(
        'PATCH',
        `/visits/${encodeURIComponent(visitId)}/transfers/${encodeURIComponent(transferId)}`,
        { action: 'edit', ...input },
        'transfer',
      );
    },

    // Cancelar, no borrar, por lo mismo que un pase revocado: el paciente
    // apartó ese traslado y tiene que verlo tachado. Uno que se esfuma deja
    // a alguien esperando un coche que nadie canceló "en su pantalla".
    cancelTransfer(visitId, transferId) {
      return mutar(
        'PATCH',
        `/visits/${encodeURIComponent(visitId)}/transfers/${encodeURIComponent(transferId)}`,
        { action: 'cancel' },
        'transfer',
      );
    },
  };
}

function resolveInitialLang(navigatorLanguage, storedLang) {
  if (storedLang && SUPPORTED_LANGS.includes(storedLang)) return storedLang;
  if (navigatorLanguage && navigatorLanguage.toLowerCase().startsWith('en')) return 'en';
  return DEFAULT_LANG;
}

// Acceso por ruta de puntos ("home.nextStepCta"). Lanza si la llave no
// existe en vez de devolver undefined en silencio: una llave mal escrita
// debe romper visiblemente en desarrollo, no aparecer como "undefined" en
// pantalla.
//
// Se llama "translate", no "t": src/ui/app.js necesita el nombre corto "t"
// para la función local que cada pantalla recibe como ctx.t (usada por
// docenas de llamadas en los 7 archivos de src/ui/screens/), y build.py
// (fase 05) no soporta "import { t as translate }" — aplana los módulos a
// un solo scope por nombre declarado, sin manejar alias. Dos nombres
// distintos de origen evita necesitar un alias en primer lugar.
function translate(lang, path) {
  const dict = STRINGS[SUPPORTED_LANGS.includes(lang) ? lang : DEFAULT_LANG];
  const value = path.split('.').reduce((node, key) => {
    if (node === undefined) throw new Error(`i18n: falta la llave "${path}" en "${lang}"`);
    return node[key];
  }, dict);
  if (value === undefined) throw new Error(`i18n: falta la llave "${path}" en "${lang}"`);
  return value;
}

// Fase 09 (D28) — attachNav(root): cablea todo elemento [data-nav] de root
// a navegación por hash (location.hash = '#/<valor>'). Extraído del
// cableado que antes vivía inline dentro de render() en src/ui/app.js,
// para que src/ui/coordinatorApp.js (fase 09) use exactamente el mismo
// mecanismo — no una copia independiente que pudiera volver a divergir en
// el nombre del atributo, que es justo la causa raíz de D28
// (docs/DECISIONS.md): src/ui/components/tabs.js emitía data-tab="${id}"
// mientras que app.js solo escuchaba [data-nav], y la barra inferior del
// paciente nunca navegó al tocarla, en ningún despliegue, hasta que el
// cliente lo reportó en producción.
//
// Requisito para cualquier pantalla nueva que agregue un elemento
// clicable de navegación: usar data-nav="<destino>", nunca otro nombre.
// test/ui/nav.test.js prueba el comportamiento real de clic→hash con un
// doble mínimo de DOM (mismo criterio que ya usa createHighlighter en
// test/map/ids.test.js) — a diferencia de un render*Screen, esto SÍ es
// lógica de cableado, no solo texto, y D28 ya probó que puede fallar en
// silencio si nadie la prueba.
function attachNav(root) {
  root.querySelectorAll('[data-nav]').forEach((el) => {
    el.addEventListener('click', () => {
      location.hash = `#/${el.dataset.nav}`;
    });
  });
}

// --- src/ui/screens/coordinator/formErrors.js ---
// Etapa D — resumen de los errores que devuelve el servidor.
//
// La API contesta `{ errors: { locationId: 'unknown', startsAt: 'noOffset' } }`:
// motivos por campo, en códigos sin idioma, para que la respuesta HTTP no
// dependa del idioma de quien la pidió. Traducirlos es trabajo del
// navegador, y esto es donde se hace — una sola vez, compartido por los
// cuatro formularios del panel, en vez de una copia por pantalla que se
// desincronice.
//
// Se lista TODO lo que está mal de una vez, no el primer error: con seis
// campos, corregir-guardar-descubrir-el-siguiente son seis viajes al
// servidor para capturar una cita.



// Estos viven en el mismo bloque i18n por comodidad, pero NO son motivos de
// un campo: "Ubicación: no pudimos guardar" no significa nada. Se excluyen
// del resumen por campo y salen por renderRequestError.
const NO_SON_DE_CAMPO = ['network', 'gone'];

// El servidor puede agregar un motivo nuevo antes que nosotros la cadena
// para traducirlo. translate() lanza con una llave inexistente —a
// propósito, para que un typo no salga como "undefined" en pantalla— pero
// aquí eso dejaría la pantalla en blanco por algo que ya se corrigió del
// otro lado. Así que se comprueba antes y se cae en el genérico.
function conocido(motivo) {
  return typeof motivo === 'string' && Object.hasOwn(STRINGS[DEFAULT_LANG].coordinator.error, motivo);
}

function traducirMotivo(t, motivo, permitidos) {
  const usable = conocido(motivo) && permitidos(motivo);
  return t(`coordinator.error.${usable ? motivo : 'invalid'}`);
}

function renderFormErrors(errors, t, labelKeys = {}) {
  const campos = Object.keys(errors ?? {});
  // Cadena vacía y no un contenedor vacío: un recuadro con borde y sin
  // texto se ve como un hueco roto.
  if (campos.length === 0) return '';

  const items = campos
    .map((campo) => {
      // Sin etiqueta conocida se usa el nombre crudo del campo. Feo, pero
      // el error se VE — tragárselo dejaría un formulario que no guarda y
      // no dice por qué, que es peor.
      const etiqueta = labelKeys[campo] ? t(labelKeys[campo]) : campo;
      const motivo = traducirMotivo(t, errors[campo], (m) => !NO_SON_DE_CAMPO.includes(m));
      return `<li>${escapeHtml(etiqueta)}: ${escapeHtml(motivo)}</li>`;
    })
    .join('');

  // role="alert": el resumen aparece sin que la pantalla cambie de sitio,
  // así que con lector de pantalla, sin esto, guardar simplemente "no hace
  // nada".
  return `<ul class="nc-form-errors" role="alert" data-role="form-errors">${items}</ul>`;
}

// El texto pelado, sin HTML. Lo usa qpass.js, que ya tiene su hueco de
// error en el DOM (con su role="alert" puesto por el render) y lo llena con
// textContent: reemplazarlo por un <p> nuevo rompería las referencias que
// su attach ya tiene guardadas. textContent tampoco interpreta HTML, así
// que aquí no se escapa nada — escapar dejaría "&amp;" visible en pantalla.
function errorText(t, code) {
  return traducirMotivo(t, code, () => true);
}

// Lo que falló no fue ningún campo: no hay conexión, o la visita
// desapareció mientras estaba abierta en pantalla. Se separa del resumen
// por campo porque pide cosas distintas: "revisa la conexión" invita a
// reintentar, "esa visita ya no existe" dice que reintentar no va a servir.
function renderRequestError(code, t) {
  if (!code) return '';
  return `<p class="nc-form-errors" role="alert" data-role="request-error">${escapeHtml(errorText(t, code))}</p>`;
}

const FORM_ERRORS_CSS = `
.nc-form-errors { margin: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--nc-danger, #b3261e); color: var(--nc-danger, #b3261e); font-size: 13px; }
ul.nc-form-errors { padding-left: 28px; display: flex; flex-direction: column; gap: 4px; }
`;

// --- src/render/qr.js ---
// Fase 06 — generador de QR sin dependencias externas (ISO/IEC 18004).
//
// ALCANCE DELIBERADAMENTE ACOTADO, no un generador general: versiones 3
// (29×29) y 4 (33×33), nivel de corrección de errores M, modo byte. PRD
// §15.7 no tiene todavía el formato real del payload del QPASS confirmado
// — en vez de construir las 40 versiones × 4 niveles del spec completo sin
// saber qué hace falta de verdad, se acota a lo que el producto necesita y
// se documenta el límite: un payload más largo obliga a ampliar esto, no a
// que el generador falle en silencio (por eso generateQrMatrix lanza una
// excepción clara si no cabe, en vez de truncar o corromper el símbolo).
//
// La versión 4 entró en la Etapa E: el enlace de visita lleva un token de
// 128 bits y mide ~55 bytes, y en la 3 solo caben 42. La 4 trae la primera
// complicación real del spec — el mensaje ya no es un bloque sino DOS, con
// sus codewords de corrección calculados por separado y luego ENTRELAZADOS
// (D1₁, D2₁, D1₂, D2₂, …). Un entrelazado mal hecho produce un símbolo que
// se ve perfecto y que decodeQrMatrix lee sin quejarse —porque
// de-entrelaza con el mismo error— pero que ningún teléfono puede leer.
// Por eso la comparación contra la implementación de referencia dejó de
// ser un ejercicio de una sola vez y vive congelada en
// test/render/qrReference.fixture.js.
//
// generateQrMatrix elige la versión MÁS CHICA donde quepa el payload, no
// la más grande: el QPASS de la fase 06 sigue pendiente de la prueba con
// lectora física, y subirlo a versión 4 en silencio invalidaría justo esa
// verificación. Lo que cabía en la 3 se sigue emitiendo idéntico.
//
// Verificación real de este archivo (no solo que mi propio decodificador
// esté de acuerdo consigo mismo, que es una prueba débil — encoder y
// decoder comparten código, así que un error sistemático en los dos se
// disfraza de éxito): se instaló la librería de referencia
// nayuki/QR-Code-generator (MIT, PyPI: qrcodegen) y OpenCV, y se comparó
// byte a byte / módulo a módulo contra ella para la misma versión, nivel
// y máscara — 0 diferencias tras la corrección final — y por separado se
// decodificó el símbolo generado por ESTE archivo con QRCodeDetector de
// OpenCV (independiente de nayuki y de mi propio código) para varios
// textos, incluyendo no-ASCII y el largo máximo: los 6 casos coincidieron
// exactos. En el camino aparecieron y se corrigieron cuatro bugs reales
// que las pruebas de redondeo propias NUNCA habrían detectado por sí
// solas (compartían el mismo malentendido en encode y decode): el
// recorrido en zigzag de columnas, las dos copias de información de
// formato con fila/columna transpuestas, y — el más caro de encontrar —
// que `FORMAT_INFO_M` está indexado bit-más-significativo-primero (como
// lo publica thonky.com y como lo da mi propio cálculo de BCH) mientras
// que el algoritmo de referencia coloca los bits contando desde el menos
// significativo; bitAt() traduce entre las dos convenciones.
//
// Lo que esta verificación NO cubre: una prueba contra un lector físico
// real, que es justo lo que el archivo de esta fase exige antes de darla
// por terminada — un símbolo que decodifica bien en dos programas no
// garantiza que se lea bien desde la pantalla de un teléfono a brillo
// normal.

const GF_EXP = new Array(512);
const GF_LOG = new Array(256);
(function initGaloisField() {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = x;
    GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d; // x^8 + x^4 + x^3 + x^2 + 1
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();

function gfMul(a, b) {
  if (a === 0 || b === 0) return 0;
  return GF_EXP[GF_LOG[a] + GF_LOG[b]];
}

// Multiplica dos polinomios (coeficientes de mayor a menor grado) en GF(256).
function polyMulGf(a, b) {
  const result = new Array(a.length + b.length - 1).fill(0);
  for (let i = 0; i < a.length; i++) {
    for (let j = 0; j < b.length; j++) {
      result[i + j] ^= gfMul(a[i], b[j]);
    }
  }
  return result;
}

function rsGeneratorPoly(numEccCodewords) {
  let g = [1];
  for (let i = 0; i < numEccCodewords; i++) {
    g = polyMulGf(g, [1, GF_EXP[i]]);
  }
  return g;
}

// Codewords de corrección de error para un solo bloque de datos, vía
// división polinomial "sintética" (LFSR) — algoritmo estándar de
// libro de texto para codificar Reed-Solomon sistemático.
function rsComputeEcc(dataCodewords, numEccCodewords) {
  const generator = rsGeneratorPoly(numEccCodewords);
  const remainder = dataCodewords.concat(new Array(numEccCodewords).fill(0));
  for (let i = 0; i < dataCodewords.length; i++) {
    const factor = remainder[i];
    if (factor === 0) continue;
    for (let j = 0; j < generator.length; j++) {
      remainder[i + j] ^= gfMul(generator[j], factor);
    }
  }
  return remainder.slice(dataCodewords.length);
}

// --- Nivel M, modo byte — constantes verificadas, ver comentario de cabecera ---
//
// `blocks` es lo que separa a la 3 de la 4: la versión 4 parte el mensaje
// en dos bloques de 32 codewords, cada uno con sus 18 de corrección. Los
// dos bloques miden lo mismo, así que el entrelazado es una simple
// alternancia; las versiones donde los bloques son de tamaños distintos
// (grupo 1 / grupo 2) no están soportadas y no hace falta que lo estén.
const QR_VERSION_SPECS = {
  3: { blocks: 1, dataPerBlock: 44, eccPerBlock: 26 },
  4: { blocks: 2, dataPerBlock: 32, eccPerBlock: 18 },
};

// El resto se deriva: repetir a mano `size: 29` o `maxBytes: 42` sería
// dejar dos fuentes que pueden separarse. 4 bits de modo + 8 bits de
// contador (bytes, versión ≤9) = 2 codewords que el payload no puede usar.
const QR_VERSIONS = Object.fromEntries(
  Object.entries(QR_VERSION_SPECS).map(([v, spec]) => {
    const version = Number(v);
    const dataCodewords = spec.blocks * spec.dataPerBlock;
    return [
      version,
      {
        ...spec,
        version,
        size: 17 + version * 4,
        dataCodewords,
        eccCodewords: spec.blocks * spec.eccPerBlock,
        maxBytes: dataCodewords - 2,
      },
    ];
  }),
);

const VERSIONS_ASCENDENTES = Object.values(QR_VERSIONS).sort((a, b) => a.version - b.version);
const QR_MAX_BYTES = VERSIONS_ASCENDENTES[VERSIONS_ASCENDENTES.length - 1].maxBytes;

// La versión más chica donde quepa: ver el comentario de cabecera sobre por
// qué no se usa siempre la más grande.
function versionForBytes(numBytes) {
  const spec = VERSIONS_ASCENDENTES.find((v) => numBytes <= v.maxBytes);
  if (!spec) {
    throw new Error(`qr: el payload mide ${numBytes} bytes UTF-8 y el máximo que este generador sabe emitir es ${QR_MAX_BYTES} (versión 4, nivel M, modo byte)`);
  }
  return spec.version;
}

function specForVersion(version) {
  const spec = QR_VERSIONS[version];
  if (!spec) {
    throw new Error(`qr: versión ${version} no soportada; este generador solo emite ${Object.keys(QR_VERSIONS).join(' y ')}`);
  }
  return spec;
}

// Strings de información de formato (15 bits, ya con BCH + máscara XOR
// aplicados) para nivel M, índice = patrón de máscara 0–7. Verificados por
// partida doble: coinciden con thonky.com/qr-code-tutorial/format-version-tables
// Y con un cálculo propio de BCH(15,5) (generador 0x537, máscara 0x5412).
const FORMAT_INFO_M = [
  '101010000010010',
  '101000100100101',
  '101111001111100',
  '101101101001011',
  '100010111111001',
  '100000011001110',
  '100111110010111',
  '100101010100000',
];

// Posiciones del patrón de alineación — fórmula de
// nayuki/QR-Code-generator (getAlignmentPatternPositions), no una tabla
// copiada a mano. Para versión 3 da [6, 22]; se excluyen las
// combinaciones que caen sobre un patrón buscador, dejando un único
// patrón de alineación en (22, 22).
function alignmentPatternCenters(version) {
  if (version === 1) return [];
  const numAlign = Math.floor(version / 7) + 2;
  const size = 17 + version * 4;
  const step = Math.floor((version * 8 + numAlign * 3 + 5) / (numAlign * 4 - 4)) * 2;
  const positions = [6];
  for (let pos = size - 7; positions.length < numAlign; pos -= step) {
    positions.splice(1, 0, pos);
  }
  return positions;
}

function isNearFinder(r, c, size) {
  const inTopLeft = r < 9 && c < 9;
  const inTopRight = r < 9 && c >= size - 8;
  const inBottomLeft = r >= size - 8 && c < 9;
  return inTopLeft || inTopRight || inBottomLeft;
}

function createGrid(fill, size) {
  return Array.from({ length: size }, () => new Array(size).fill(fill));
}

function stampFinderPattern(modules, reserved, topRow, leftCol, size) {
  for (let r = -1; r <= 7; r++) {
    for (let c = -1; c <= 7; c++) {
      const rr = topRow + r;
      const cc = leftCol + c;
      if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
      reserved[rr][cc] = true;
      if (r < 0 || r > 6 || c < 0 || c > 6) {
        modules[rr][cc] = false; // separador
      } else {
        const onRing = r === 0 || r === 6 || c === 0 || c === 6;
        const onCore = r >= 2 && r <= 4 && c >= 2 && c <= 4;
        modules[rr][cc] = onRing || onCore;
      }
    }
  }
}

function stampAlignmentPattern(modules, reserved, centerRow, centerCol) {
  for (let r = -2; r <= 2; r++) {
    for (let c = -2; c <= 2; c++) {
      const rr = centerRow + r;
      const cc = centerCol + c;
      reserved[rr][cc] = true;
      const onRing = r === -2 || r === 2 || c === -2 || c === 2;
      modules[rr][cc] = onRing || (r === 0 && c === 0);
    }
  }
}

function buildFunctionPatterns(spec) {
  const { size, version } = spec;
  const modules = createGrid(false, size);
  const reserved = createGrid(false, size);

  stampFinderPattern(modules, reserved, 0, 0, size);
  stampFinderPattern(modules, reserved, 0, size - 7, size);
  stampFinderPattern(modules, reserved, size - 7, 0, size);

  // Patrón de temporización (timing): fila 6 y columna 6, alternando,
  // entre los separadores de los tres buscadores.
  for (let i = 8; i < size - 8; i++) {
    modules[6][i] = i % 2 === 0;
    reserved[6][i] = true;
    modules[i][6] = i % 2 === 0;
    reserved[i][6] = true;
  }

  const centers = alignmentPatternCenters(version);
  for (const cr of centers) {
    for (const cc of centers) {
      if (isNearFinder(cr, cc, size)) continue;
      stampAlignmentPattern(modules, reserved, cr, cc);
    }
  }

  // Módulo oscuro fijo, versión V: (4V+9, 8) en (fila, columna).
  modules[4 * version + 9][8] = true;
  reserved[4 * version + 9][8] = true;

  // Áreas reservadas para información de formato (se rellenan después de
  // elegir máscara): franjas junto a los tres buscadores. Deben calzar
  // EXACTO con dónde escribe stampFormatInfo — de ahí el error real que
  // tuvo esta fase: un `i <= 8` simétrico para las cuatro franjas parecía
  // razonable pero reservaba una celda de más en cada una de las dos
  // mitades de la segunda copia (columna 8 fila 8, y fila 8 columna 20),
  // celdas que en realidad le tocaban a los datos — verificado generando
  // 12 símbolos con codewords aleatorios vía la librería de referencia de
  // nayuki y viendo cuáles celdas nunca cambiaban.
  for (let i = 0; i <= 8; i++) {
    reserved[8][i] = true; // copia 1, primera mitad: fila 8, columnas 0–8
    reserved[i][8] = true; // copia 1, segunda mitad: columna 8, filas 0–8
  }
  for (let i = 0; i < 8; i++) {
    reserved[8][size - 1 - i] = true; // copia 2, primera mitad: fila 8, las 8 últimas columnas
  }
  for (let i = 8; i < 15; i++) {
    reserved[size - 15 + i][8] = true; // copia 2, segunda mitad: columna 8, las 7 últimas filas
  }

  return { modules, reserved };
}

// FORMAT_INFO_M[m][0] es el bit MÁS significativo (así se publican en
// thonky.com y así los devuelve mi propio cálculo de BCH). El algoritmo de
// referencia (nayuki) coloca los bits con `(valor >> i) & 1` — es decir,
// i=0 es el bit MENOS significativo. bitAt(bits, i) traduce entre las dos
// convenciones; usarla en vez de `bits[i]` directo en todo este archivo es
// justo lo que faltaba — confirmado leyendo el algoritmo verbatim con
// marcadores de índice en vez de booleanos (no hay forma de que ese
// resultado sea ambiguo) y viéndolo coincidir bit a bit contra
// FORMAT_INFO_M solo después de invertir el índice.
function bitAt(bits, i) {
  return bits[14 - i] === '1';
}

function stampFormatInfo(modules, maskPattern, size) {
  const bits = FORMAT_INFO_M[maskPattern];
  // Copia 1 — envuelve la esquina del buscador superior izquierdo: baja
  // por la columna 8 (bits 0–5, filas 0–5), gira en (7,8)/(8,8) [bits
  // 6–7], gira otra vez en (8,7) [bit 8] y cruza la fila 8 hacia la
  // izquierda (bits 9–14, columnas 5..0).
  for (let i = 0; i < 6; i++) modules[i][8] = bitAt(bits, i);
  modules[7][8] = bitAt(bits, 6);
  modules[8][8] = bitAt(bits, 7);
  modules[8][7] = bitAt(bits, 8);
  for (let i = 9; i < 15; i++) modules[8][14 - i] = bitAt(bits, i);

  // Copia 2: fila 8 cerca del buscador superior derecho (bits 0–7, las 8
  // últimas columnas de derecha a izquierda), luego columna 8 cerca del
  // buscador inferior izquierdo (bits 8–14, las 7 últimas filas).
  for (let i = 0; i < 8; i++) modules[8][size - 1 - i] = bitAt(bits, i);
  for (let i = 8; i < 15; i++) modules[size - 15 + i][8] = bitAt(bits, i);
}

function encodeDataCodewords(bytes, spec) {
  if (bytes.length > spec.maxBytes) {
    throw new Error(`qr: el payload mide ${bytes.length} bytes UTF-8, el máximo para la versión ${spec.version} (nivel M, modo byte) es ${spec.maxBytes}`);
  }
  const bits = [];
  const pushBits = (value, len) => {
    for (let i = len - 1; i >= 0; i--) bits.push((value >> i) & 1);
  };
  pushBits(0b0100, 4); // indicador de modo: byte
  pushBits(bytes.length, 8); // contador de caracteres, 8 bits (versión ≤9, modo byte)
  for (const b of bytes) pushBits(b, 8);

  const capacityBits = spec.dataCodewords * 8;
  for (let i = 0; i < 4 && bits.length < capacityBits; i++) bits.push(0); // terminador, hasta 4 ceros
  while (bits.length % 8 !== 0) bits.push(0); // relleno a byte completo

  const codewords = [];
  for (let i = 0; i < bits.length; i += 8) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
    codewords.push(byte);
  }
  const pads = [0xec, 0x11];
  let padIndex = 0;
  while (codewords.length < spec.dataCodewords) {
    codewords.push(pads[padIndex % 2]);
    padIndex++;
  }
  return codewords;
}

// Entrelazado (ISO/IEC 18004 §8.6). Con más de un bloque, los codewords NO
// van en el símbolo en el orden del mensaje: se toma el primero de cada
// bloque, luego el segundo de cada bloque, y así — y lo mismo, por
// separado, con los de corrección. Es lo que hace que una mancha sobre el
// símbolo reparta el daño entre los dos bloques en vez de destruir uno
// entero. Con un solo bloque esto es la identidad, y por eso la versión 3
// sale byte a byte igual que antes de la Etapa E.
function interleave(dataCodewords, spec) {
  const { blocks, dataPerBlock, eccPerBlock } = spec;
  const bloques = [];
  for (let b = 0; b < blocks; b++) {
    const data = dataCodewords.slice(b * dataPerBlock, (b + 1) * dataPerBlock);
    bloques.push({ data, ecc: rsComputeEcc(data, eccPerBlock) });
  }
  const out = [];
  for (let i = 0; i < dataPerBlock; i++) for (const bl of bloques) out.push(bl.data[i]);
  for (let i = 0; i < eccPerBlock; i++) for (const bl of bloques) out.push(bl.ecc[i]);
  return out;
}

// La inversa: de la tira leída del símbolo al mensaje original. Solo los
// codewords de datos — este decodificador no corrige errores, así que los
// de corrección no se tocan (ver el comentario de decodeQrMatrix).
function deinterleaveData(codewords, spec) {
  const { blocks, dataPerBlock } = spec;
  const mensaje = [];
  for (let b = 0; b < blocks; b++) {
    for (let i = 0; i < dataPerBlock; i++) mensaje.push(codewords[i * blocks + b]);
  }
  return mensaje;
}

// Recorre las columnas de derecha a izquierda en pares, de abajo hacia
// arriba y luego de arriba hacia abajo alternando, saltando la columna de
// temporización (6) sin perder ni duplicar ninguna otra. Antes esto se
// resolvía sustituyendo col=5 solo en la iteración de colPair=6 sin
// arrastrar el ajuste a las iteraciones siguientes: la columna 4 quedaba
// escrita dos veces y la columna 0 nunca se tocaba. Verificado con
// OpenCV (QRCodeDetector, fuera de este proyecto) contra el bug original:
// ubicaba el símbolo (los patrones buscadores estaban bien) pero no podía
// decodificar el contenido — exactamente el síntoma de un mapeo de bits
// de datos incorrecto. Con el puntero `right` mutable y arrastrado entre
// iteraciones, todas las columnas menos la 6 se visitan una vez cada una.
function walkColumnPairs(size, callback) {
  let upward = true;
  let right = size - 1;
  while (right >= 1) {
    if (right === 6) right = 5;
    for (let step = 0; step < size; step++) {
      const row = upward ? size - 1 - step : step;
      callback(row, right);
      callback(row, right - 1);
    }
    upward = !upward;
    right -= 2;
  }
}

function placeDataBits(modules, reserved, allCodewords, size) {
  const bits = [];
  for (const byte of allCodewords) {
    for (let i = 7; i >= 0; i--) bits.push((byte >> i) & 1);
  }
  let bitIndex = 0;
  walkColumnPairs(size, (row, c) => {
    if (reserved[row][c]) return;
    const bit = bitIndex < bits.length ? bits[bitIndex] : 0;
    modules[row][c] = bit === 1;
    bitIndex++;
  });
  return modules;
}

function applyMask(modules, reserved, maskPattern, size) {
  const maskFn = MASK_FUNCTIONS[maskPattern];
  const out = createGrid(false, size);
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const bit = modules[r][c];
      out[r][c] = reserved[r][c] ? bit : bit !== maskFn(r, c);
    }
  }
  return out;
}

const MASK_FUNCTIONS = [
  (r, c) => (r + c) % 2 === 0,
  (r, c) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
  (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
];

// Puntuación de penalización (ISO/IEC 18004 §8.8.2), las 4 reglas
// estándar — más bajo es mejor. Se usa para elegir, de las 8 máscaras
// posibles, la que produce el símbolo más "parejo" (mejor fiabilidad de
// lectura real, aunque cualquiera de las 8 sea técnicamente decodificable).
function maskPenalty(modules, size) {
  let penalty = 0;

  // Regla 1: 5+ módulos iguales seguidos, por fila y por columna.
  for (let r = 0; r < size; r++) {
    penalty += runPenalty(Array.from({ length: size }, (_, c) => modules[r][c]));
  }
  for (let c = 0; c < size; c++) {
    penalty += runPenalty(Array.from({ length: size }, (_, r) => modules[r][c]));
  }

  // Regla 2: bloques 2×2 del mismo color.
  for (let r = 0; r < size - 1; r++) {
    for (let c = 0; c < size - 1; c++) {
      const v = modules[r][c];
      if (v === modules[r][c + 1] && v === modules[r + 1][c] && v === modules[r + 1][c + 1]) {
        penalty += 3;
      }
    }
  }

  // Regla 3: patrón 1:1:3:1:1 (como un buscador) con margen de 4 claros.
  const finderLike = [true, false, true, true, true, false, true, false, false, false, false];
  const finderLikeRev = [...finderLike].reverse();
  for (let r = 0; r < size; r++) {
    for (let c = 0; c <= size - 11; c++) {
      const window = Array.from({ length: 11 }, (_, i) => modules[r][c + i]);
      if (arraysEqual(window, finderLike) || arraysEqual(window, finderLikeRev)) penalty += 40;
    }
  }
  for (let c = 0; c < size; c++) {
    for (let r = 0; r <= size - 11; r++) {
      const window = Array.from({ length: 11 }, (_, i) => modules[r + i][c]);
      if (arraysEqual(window, finderLike) || arraysEqual(window, finderLikeRev)) penalty += 40;
    }
  }

  // Regla 4: qué tan lejos del 50% está la proporción de módulos oscuros.
  let dark = 0;
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (modules[r][c]) dark++;
  const percent = (dark * 100) / (size * size);
  penalty += Math.floor(Math.abs(percent - 50) / 5) * 10;

  return penalty;
}

function runPenalty(line) {
  let penalty = 0;
  let runLen = 1;
  for (let i = 1; i < line.length; i++) {
    if (line[i] === line[i - 1]) {
      runLen++;
    } else {
      if (runLen >= 5) penalty += runLen - 2;
      runLen = 1;
    }
  }
  if (runLen >= 5) penalty += runLen - 2;
  return penalty;
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function utf8Bytes(text) {
  return Array.from(new TextEncoder().encode(text));
}

// generateQrMatrix(text, { version }) -> { size, modules: boolean[size][size] }
// modules[row][col] === true significa módulo oscuro. Sin `version`, se usa
// la más chica donde quepa el payload.
function generateQrMatrix(text, { version } = {}) {
  const bytes = utf8Bytes(text);
  const spec = specForVersion(version === undefined ? versionForBytes(bytes.length) : version);

  const allCodewords = interleave(encodeDataCodewords(bytes, spec), spec);

  const { modules: base, reserved } = buildFunctionPatterns(spec);
  const withData = placeDataBits(base, reserved, allCodewords, spec.size);

  let best = null;
  for (let mask = 0; mask < 8; mask++) {
    const masked = applyMask(withData, reserved, mask, spec.size);
    stampFormatInfo(masked, mask, spec.size);
    const penalty = maskPenalty(masked, spec.size);
    if (best === null || penalty < best.penalty) best = { mask, modules: masked, penalty };
  }

  return { size: spec.size, modules: best.modules, maskPattern: best.mask };
}

function renderQrSvg(matrix, { quietZone = 4, moduleSize = 8 } = {}) {
  const total = matrix.size + quietZone * 2;
  const px = total * moduleSize;
  let rects = '';
  for (let r = 0; r < matrix.size; r++) {
    for (let c = 0; c < matrix.size; c++) {
      if (!matrix.modules[r][c]) continue;
      const x = (c + quietZone) * moduleSize;
      const y = (r + quietZone) * moduleSize;
      rects += `<rect x="${x}" y="${y}" width="${moduleSize}" height="${moduleSize}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${px} ${px}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="0" y="0" width="${px}" height="${px}" fill="#FFFFFF"/><g fill="#000000">${rects}</g></svg>`;
}

// --- decodeQrMatrix — SOLO para probar el redondeo encode→decode en las
// pruebas de esta fase (test/render/qr.test.js). No es un lector general:
// no corrige errores (no usa los codewords EC para reparar nada), asume
// nivel M / modo byte y una de las dos versiones que este archivo genera.
// Un lector real de verdad es justo lo que la fase deja para la prueba
// física con lectora, no algo que este archivo deba reemplazar.
function decodeQrMatrix(matrix) {
  // La versión se deduce del tamaño (size = 4V + 17), no se recibe como
  // parámetro: así una matriz ajena —la de la implementación de referencia,
  // por ejemplo— se lee sin que nadie tenga que decir de qué versión es.
  const spec = specForVersion((matrix.size - 17) / 4);
  const { size } = spec;
  const maskPattern = detectMaskPattern(matrix);
  const { reserved } = buildFunctionPatterns(spec);
  const maskFn = MASK_FUNCTIONS[maskPattern];
  const unmasked = createGrid(false, size);
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      unmasked[r][c] = reserved[r][c] ? matrix.modules[r][c] : matrix.modules[r][c] !== maskFn(r, c);
    }
  }
  const bits = readDataBits(unmasked, reserved, size);
  // Se leen los de datos, que en el símbolo van entrelazados y ANTES que
  // los de corrección; de-interleaveData los devuelve al orden del mensaje.
  const codewordsBits = bits.slice(0, spec.dataCodewords * 8);
  const entrelazados = [];
  for (let i = 0; i < codewordsBits.length; i += 8) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | codewordsBits[i + j];
    entrelazados.push(byte);
  }
  const dataCodewords = deinterleaveData(entrelazados, spec);
  const mode = dataCodewords[0] >> 4;
  if (mode !== 0b0100) throw new Error(`qr decode: modo inesperado ${mode.toString(2)}, este decodificador solo entiende modo byte`);
  const length = ((dataCodewords[0] & 0x0f) << 4) | (dataCodewords[1] >> 4);
  const outBytes = [];
  for (let i = 0; i < length; i++) {
    const hi = dataCodewords[1 + i] & 0x0f;
    const lo = dataCodewords[2 + i] >> 4;
    outBytes.push((hi << 4) | lo);
  }
  return new TextDecoder().decode(new Uint8Array(outBytes));
}

function detectMaskPattern(matrix) {
  // Se lee por posición (i=0..14, igual que stampFormatInfo escribe) y
  // luego se arma el string en el orden MSB-primero de FORMAT_INFO_M
  // (byI[14] primero) — el mismo giro de índice que bitAt(), en la
  // dirección contraria.
  const byI = new Array(15);
  for (let i = 0; i < 6; i++) byI[i] = matrix.modules[i][8] ? '1' : '0';
  byI[6] = matrix.modules[7][8] ? '1' : '0';
  byI[7] = matrix.modules[8][8] ? '1' : '0';
  byI[8] = matrix.modules[8][7] ? '1' : '0';
  for (let i = 9; i < 15; i++) byI[i] = matrix.modules[8][14 - i] ? '1' : '0';
  const str = byI.slice().reverse().join('');
  const idx = FORMAT_INFO_M.indexOf(str);
  if (idx === -1) throw new Error('qr decode: información de formato no reconocida (¿matriz corrupta o de otra versión/nivel?)');
  return idx;
}

function readDataBits(modules, reserved, size) {
  const bits = [];
  walkColumnPairs(size, (row, c) => {
    if (reserved[row][c]) return;
    bits.push(modules[row][c] ? 1 : 0);
  });
  return bits;
}

// --- src/ui/screens/coordinator/handoff.js ---
// Etapa E — Enviar al paciente: el enlace, el QR y el botón de WhatsApp.
//
// Esta pantalla es la respuesta a la pregunta que abrió toda la etapa:
// "¿dónde se genera el QR para que la coordinadora se lo mande al
// paciente?". Hasta la Etapa D la respuesta era "en ningún lado" —
// createVisit acuñaba el token y el router lo tiraba; la palabra `token`
// no aparecía en ninguna de las cinco pantallas del panel.
//
// ctx = { store, visitId, lang, t, origin }. `origin` entra por ctx y no
// se lee de `location` aquí adentro para que la pantalla siga siendo pura
// y probable sin DOM, igual que el resto de render*Screen del proyecto.
//
// Es una PESTAÑA de la visita, no un aviso que aparece al crearla. Un
// aviso se pierde con la primera recarga y el enlace es lo único que
// existe para llegar al paciente: si se pierde, la visita queda muda. Como
// pestaña, se puede volver a ella mañana, después de haberle cargado el
// itinerario y el hospedaje — que es el orden en que de verdad se trabaja
// (por eso el alta sigue aterrizando en #/itinerary y no aquí: mandarle a
// alguien un itinerario vacío es peor que no mandarle nada).
//
// El mensaje de WhatsApp va en el idioma del PACIENTE (visit.lang), no en
// el del panel: la coordinadora puede tener la interfaz en español y estar
// atendiendo a alguien que solo lee inglés. Es el único lugar del proyecto
// donde se traducen dos idiomas a la vez en la misma pantalla, y por eso
// este archivo importa `translate` directamente en vez de conformarse con
// el `t` que trae ctx (precedente: coordinator/formErrors.js).
//
// wa.me SIN número, a propósito: el Visit no guarda teléfono del paciente
// (PRD §7) y agregarlo sería empezar a almacenar un dato personal que
// nadie pidió. Sin número, WhatsApp abre con el texto listo y la
// coordinadora elige el chat — que además es el paso donde confirma con
// los ojos a quién se lo está mandando.





// Única definición de la forma del enlace, exportada para que las pruebas
// —y quien mañana tenga que cambiar el prefijo— no la reescriban a mano en
// dos lados. El otro extremo de este contrato es la regla `/v/*` de
// _redirects, que lo traduce a `?p=<token>` (test/deploy/redirects.test.js).
function visitUrl(origin, token) {
  return `${origin}/v/${token}`;
}

// "null" es lo que devuelve location.origin en file:// (Chrome, Firefox).
// Un doble clic en coordinator.html es exactamente el tipo de cosa que
// pasa, y sin este guard la pantalla armaría `null/v/<token>`: un enlace
// roto que se ve igual de real que uno bueno y que sale por WhatsApp hacia
// un paciente.
function origenUsable(origin) {
  return typeof origin === 'string' && /^https?:\/\/[^/]+$/.test(origin);
}

function pantalla(title, cuerpo) {
  return `
    <section class="nc-screen">
      <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
      ${cuerpo}
    </section>
  `;
}

function aviso(title, mensaje) {
  return pantalla(title, `<p class="nc-empty-state">${escapeHtml(mensaje)}</p>`);
}

// El QR puede no caber: v4/M topa en 62 bytes UTF-8. Con el dominio de hoy
// (https://nchpatient.netlify.app + /v/ + token de 22) son 55 y sobra; con
// un dominio propio más largo, no. Ese día la pantalla tiene que seguir
// sirviendo el enlace copiable en vez de tumbarse — mismo criterio que
// renderSymbol en screens/pass.js.
function bloqueQr(url, t) {
  try {
    return `
      <div class="nc-handoff-qr">${renderQrSvg(generateQrMatrix(url))}</div>
      <p class="nc-handoff-hint">${escapeHtml(t('coordinator.handoff.qrHint'))}</p>
    `;
  } catch {
    return `<p class="nc-handoff-hint">${escapeHtml(t('coordinator.handoff.qrTooLong'))}</p>`;
  }
}

function renderHandoffScreen(ctx) {
  const { store, visitId, t, origin } = ctx;
  const title = t('coordinator.handoff.title');
  const record = store.getVisit(visitId);

  // Mismo guard y mismo mensaje que itinerary/lodging/qpass: una visita que
  // no está no es un caso especial de esta pantalla.
  if (!record) return aviso(title, t('coordinator.visitNotFound'));

  const { visit } = record;
  // Sin token no hay nada que entregar. No es hipotético: GET /visits borra
  // el token a propósito (sinToken, src/server/coordinatorHandler.js), así
  // que basta con que algún día un resumen acabe en `records` para que esto
  // se vuelva el camino real.
  if (!visit.token) return aviso(title, t('coordinator.handoff.noToken'));
  if (!origenUsable(origin)) return aviso(title, t('coordinator.handoff.noOrigin'));

  const url = visitUrl(origin, visit.token);
  const mensaje = translate(visit.lang, 'coordinator.handoff.waMessage')(visit.patientFirstName, url);
  const waHref = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;

  return pantalla(title, `
    <p class="nc-handoff-intro">${escapeHtml(t('coordinator.handoff.intro'))}</p>
    ${renderCard(`
      <p class="nc-handoff-label">${escapeHtml(t('coordinator.handoff.linkLabel'))}</p>
      <a class="nc-handoff-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>
      <div class="nc-handoff-actions">
        <button type="button" class="nc-button" data-role="copy-link" data-link="${escapeHtml(url)}">${escapeHtml(t('coordinator.handoff.copy'))}</button>
        <a class="nc-button nc-button--primary" href="${escapeHtml(waHref)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t('coordinator.handoff.whatsapp'))}</a>
      </div>
      <p class="nc-handoff-copied" data-role="copy-feedback" hidden>${escapeHtml(t('coordinator.handoff.copied'))}</p>
    `, { variant: 'accent' })}
    ${renderCard(bloqueQr(url, t))}
  `);
}

// Mismo patrón de copiado que screens/stay.js del lado paciente: si el
// navegador niega el portapapeles (requiere gesto o permiso según el
// caso), no se rompe la pantalla — simplemente no aparece la confirmación,
// y el enlace sigue seleccionable a mano en el <a> de arriba.
function attachHandoffScreen(rootEl) {
  const btn = rootEl.querySelector('[data-role="copy-link"]');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const feedback = rootEl.querySelector('[data-role="copy-feedback"]');
    try {
      await navigator.clipboard.writeText(btn.dataset.link);
    } catch {
      return;
    }
    if (feedback) {
      feedback.hidden = false;
      setTimeout(() => { feedback.hidden = true; }, 2000);
    }
  });
}

const HANDOFF_CSS = `
.nc-handoff-intro { margin: 0 0 12px; font-size: 14px; opacity: 0.85; }
.nc-handoff-label { margin: 0 0 4px; font-size: 12px; opacity: 0.7; }
.nc-handoff-link { display: block; word-break: break-all; font-size: 14px; margin: 0 0 12px; color: var(--nc-teal-ink); }
.nc-handoff-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.nc-handoff-copied { margin: 8px 0 0; font-size: 12px; color: var(--nc-teal-ink); font-weight: 700; }
.nc-handoff-qr { max-width: 260px; margin: 0 auto; }
.nc-handoff-hint { margin: 10px 0 0; font-size: 13px; opacity: 0.8; text-align: center; }
`;

// --- src/ui/screens/coordinator/intake.js ---
// Fase 09 — Alta de visita (docs/phases/phase-09-coordinator-demo.md):
// formulario con el subconjunto de Visit (PRD §7) que le toca capturar a
// la coordinadora — patientFirstName, lang, startsAt, endsAt. Primer
// <form> del proyecto: sin librería de date-picker, así que startsAt/
// endsAt son <input type="text"> con placeholder de ejemplo ISO en vez de
// datetime-local, tal como decide el doc de esta fase.
//
// Al guardar, esta pantalla NO navega por sí misma — coordinatorApp.js
// (el enrutador, construido aparte) decide qué hacer con la visita nueva
// vía el callback onCreated; por eso este archivo no trae ningún
// data-nav.
//
// Etapa D — onCreated ya no recibe la visita, recibe el resultado entero
// del store: { ok, visit } o { ok: false, errors } . La visita solo existe
// si el servidor la aceptó, y antes esa diferencia no viajaba a ningún
// lado. El servidor valida lo mismo que el `required` de los campos, y
// además lo que el navegador no puede: que las fechas se entiendan y que
// endsAt vaya después de startsAt.



// El sufijo no es decorativo: intake, itinerary y lodging tenían los tres
// un `const CAMPOS` privado de su módulo, y build.py aplana todo el grafo a
// un solo scope, así que al empaquetar el panel (Etapa F, #10) los tres
// chocaron. Como pasa con las clases .nc-coord-* de itinerary.js, era un
// conflicto que solo estaba dormido porque nadie había construido esto.
const CAMPOS_INTAKE = {
  patientFirstName: 'coordinator.intake.firstNameLabel',
  lang: 'coordinator.intake.langLabel',

function attachIntakeScreen(rootEl, ctx = {}) {
  const { store, onCreated } = ctx;
  const form = rootEl.querySelector('[data-role="intake-form"]');
  form?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = new FormData(form);
    // Deshabilitar el botón mientras viaja no es cosmética aquí: crear dos
    // veces la misma visita deja dos expedientes con dos tokens, y el
    // paciente recibe uno de los dos sin manera de saber cuál es el bueno.
    const boton = form.querySelector('button[type="submit"]');
    if (boton) boton.disabled = true;

    const res = await store.createVisit({
      patientFirstName: data.get('patientFirstName'),
      lang: data.get('lang'),
      startsAt: data.get('startsAt'),
      endsAt: data.get('endsAt'),
    });

    // Sin repintado no hay botón nuevo: si falló, se reactiva este. Si
    // salió bien, el router se lleva la pantalla por delante y da igual.
    if (!res.ok && boton) boton.disabled = false;
    onCreated?.(res);
  });
}

const STARTS_AT_PLACEHOLDER = '2026-03-10T08:00-07:00';

function renderAppointmentCard(appointment, lang, t) {
  const cancelled = appointment.status === 'cancelled';
  const moved = appointment.status === 'moved';

  // Cancelar y editar se omiten para una cita que ya está cancelada
  // (editar contenido de algo cancelado no tiene sentido de negocio,
  // mismo criterio ya aplicado a cancelar); mover sigue disponible siempre
  // (no hay razón de negocio dada para bloquearlo).
  const cancelControl = cancelled
    ? ''
    : `<button type="button" class="nc-button" data-role="cancel-appointment" data-appointment-id="${escapeHtml(appointment.id)}">${escapeHtml(t('coordinator.itinerary.cancel'))}</button>`;

  // "editarla" (docs/phases/phase-09-coordinator-demo.md) es una acción
  // propia, distinta de "moverla": edita serviceName/durationMin/
  // locationId, nunca startsAt ni status (coordinatorStore.js#
  // editAppointment). El botón no captura nada: revela el formulario
  // inline de su tarjeta (renderEditForm, abajo). Mismo patrón que "mover",
  // para no tener dos interacciones distintas en el mismo archivo para dos
  // acciones hermanas.
  const editControl = cancelled
    ? ''
    : `<button type="button" class="nc-button" data-role="edit-appointment" data-appointment-id="${escapeHtml(appointment.id)}">${escapeHtml(t('coordinator.itinerary.edit'))}</button>`;

  // Fix (revisión adversarial, fase 09): coordinator.itinerary.
  // cancelledBadge/movedBadge (i18n.js) existían sin usar, y el estado se
  // pintaba como el enum crudo ("cancelled"/"moved") igual en es que en
  // en — violando el criterio de aceptación "ninguna cadena nueva queda
  // fija en un solo idioma". renderBadge es el mismo componente que ya
  // usa ../itinerary.js (paciente) y qpass.js, no texto libre nuevo.
  // 'updated' es la variante ya usada por el lado paciente para señalar
  // que una cita cambió de horario — mismo significado que "movida" aquí.
  // Los cinco status ya tienen llave i18n (itinerary.status.*, src/ui/
  // i18n.js) — el comentario de cabecera de este archivo afirmaba lo
  // contrario y era falso: scheduled/in_progress/done existen ahí desde la
  // fase 05. Se pintan traducidos como los otros dos, en vez de dejar el
  // enum crudo en inglés en ambos idiomas.
  const statusHtml = cancelled
    ? `<p class="nc-coord-itin-status-badge">${renderBadge(t('coordinator.itinerary.cancelledBadge'), 'cancelled')}</p>`
    : moved
      ? `<p class="nc-coord-itin-status-badge">${renderBadge(t('coordinator.itinerary.movedBadge'), 'updated')}</p>`
      : `<p class="nc-coord-itin-status">${escapeHtml(t(`itinerary.status.${appointment.status}`))}</p>`;

  return renderCard(
    `
      <p class="${classNames(['nc-coord-itin-what', cancelled && 'nc-coord-itin-what--cancelled'])}">${escapeHtml(appointment.serviceName)}</p>
      <p class="nc-coord-itin-row"><span>${escapeHtml(t('coordinator.itinerary.startsAtLabel'))}</span> ${escapeHtml(appointment.startsAt)}</p>
      <p class="nc-coord-itin-row"><span>${escapeHtml(t('coordinator.itinerary.durationLabel'))}</span> ${escapeHtml(appointment.durationMin)}</p>
      <p class="nc-coord-itin-row"><span>${escapeHtml(t('coordinator.itinerary.locationLabel'))}</span> ${escapeHtml(locationName(locations, appointment.locationId, lang))}</p>
      ${statusHtml}
      <div class="nc-coord-itin-actions">
        <button type="button" class="nc-button" data-role="move-appointment" data-appointment-id="${escapeHtml(appointment.id)}">${escapeHtml(t('coordinator.itinerary.move'))}</button>
        ${editControl}
        ${cancelControl}
      </div>
      ${renderMoveForm(appointment, t)}
      ${cancelled ? '' : renderEditForm(appointment, lang, t)}
    `,
    { extraClass: cancelled ? 'nc-card--muted' : '' }
  );
}

function renderItineraryScreen(ctx) {
  const { store, visitId, lang, t, errors, requestError } = ctx;
  const title = t('coordinator.itinerary.title');
  const record = store.getVisit(visitId);

  // Guard: visita inexistente -> alternativa corta, sin lanzar (misma
  // disciplina de defensa en profundidad que ya usa src/ui/screens/
  // stay.js para lodging ausente). El mensaje sale de
  // coordinator.visitNotFound, la MISMA llave que usan lodging.js y
  // qpass.js: antes cada archivo traía su propio `lang === 'en' ? … : …`,
  // la única traducción del proyecto hecha fuera de i18n.js.
  if (!record) {
    return `
      <section class="nc-screen">
        <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
        <p class="nc-empty-state">${escapeHtml(t('coordinator.visitNotFound'))}</p>
      </section>
    `;
  }

  const { appointments } = record;

  // Fix (revisión adversarial, fase 09): el criterio de aceptación del
  // doc de esta fase pide que "una cita movida reordene la línea de
  // tiempo" — antes se pintaba appointments tal cual, en su orden de
  // inserción original, sin importar el startsAt nuevo tras moverla.
  // Copia nueva vía spread + sort (nunca se muta record.appointments, el
  // array real de la store) — new Date(...).getTime() en vez de comparar
  // los strings ISO tal cual, para no depender de que todas las visitas
  // usen el mismo offset de zona horaria.
  const sortedAppointments = [...appointments].sort(
    (a, b) => new Date(a.startsAt).getTime() - new Date(b.startsAt).getTime()
  );

  const body = sortedAppointments.length === 0
    ? `<p class="nc-empty-state">${escapeHtml(t('coordinator.itinerary.empty'))}</p>`
    : `<div class="nc-coord-itin-list">${sortedAppointments.map((a) => renderAppointmentCard(a, lang, t)).join('\n')}</div>`;

  return `
    <section class="nc-screen">
      <h1 class="nc-screen-title">${escapeHtml(title)}</h1>
      ${body}
      ${renderRequestError(requestError, t)}
      ${renderFormErrors(errors, t, CAMPOS_CITA)}
      ${renderAddAppointmentForm(lang, t)}
    </section>
  `;
}

// ctx aquí además trae { onChange } (mismo contrato que el resto de
// attach*Screen interactivos): onChange se llama con el RESULTADO de cada
// mutación, no solo cuando salió bien, y el router decide qué pintar —
// repintar con los datos nuevos, o el motivo por el que el servidor dijo
// que no.
//
// Etapa D: `now` ya no se recibe ni se manda. La store llama a la API y la
// hora de lo que se guarda la estampa el servidor, que es el único que
// puede decirla igual para todas las coordinadoras.
function attachItineraryScreen(rootEl, ctx) {
  const { store, visitId, onChange } = ctx;

  const form = rootEl.querySelector('[data-role="add-appointment-form"]');
  form?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const fields = form.elements;
    const res = await store.addAppointment(visitId, {
      serviceName: fields.serviceName.value,
      startsAt: fields.startsAt.value,
      durationMin: Number(fields.durationMin.value),
      locationId: fields.locationId.value,
    });
    onChange?.(res);
  });

  // D40 — los botones ya no piden datos: revelan el formulario inline de su
  // propia tarjeta. Mostrar uno esconde cualquier otro abierto, para que no
  // queden dos ediciones a medias en pantalla al mismo tiempo.
  function toggleInlineForm(role, appointmentId) {
    const target = rootEl.querySelector(`[data-role="${role}"][data-appointment-id="${appointmentId}"]`);
    if (!target) return;
    const wasHidden = target.hidden;
    rootEl.querySelectorAll('.nc-coord-itin-form--inline').forEach((f) => { f.hidden = true; });
    target.hidden = !wasHidden;
    if (!target.hidden) target.querySelector('input, select')?.focus();
  }

  rootEl.querySelectorAll('[data-role="move-appointment"]').forEach((btn) => {
    btn.addEventListener('click', () => toggleInlineForm('move-appointment-form', btn.dataset.appointmentId));
  });

  rootEl.querySelectorAll('[data-role="edit-appointment"]').forEach((btn) => {
    btn.addEventListener('click', () => toggleInlineForm('edit-appointment-form', btn.dataset.appointmentId));
  });

  rootEl.querySelectorAll('[data-role="move-appointment-form"]').forEach((moveForm) => {
    moveForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const newStartsAt = moveForm.elements.moveStartsAt.value.trim();
      if (!newStartsAt) return;
      const res = await store.moveAppointment(visitId, moveForm.dataset.appointmentId, newStartsAt);
      onChange?.(res);
    });
  });

  rootEl.querySelectorAll('[data-role="edit-appointment-form"]').forEach((editForm) => {
    editForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const fields = editForm.elements;
      const res = await store.editAppointment(visitId, editForm.dataset.appointmentId, {
        serviceName: fields.editServiceName.value.trim(),
        durationMin: Number(fields.editDurationMin.value),
        locationId: fields.editLocationId.value,
      });
      onChange?.(res);
    });
  });

  rootEl.querySelectorAll('[data-role="cancel-appointment"]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const res = await store.cancelAppointment(visitId, btn.dataset.appointmentId);
      onChange?.(res);
    });
  });
}
