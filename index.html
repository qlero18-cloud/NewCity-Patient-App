// --- src/domain/time.js ---
// Formato y aritmética de horas en America/Tijuana (PRD §7.1 INV-5, R6).
//
// Regla de esta fase: ninguna función de este archivo consulta el reloj
// del sistema (INV-1) ni la zona horaria del proceso (INV-5). Toda lectura
// de "qué hora es en Tijuana" pasa por Intl.DateTimeFormat con
// timeZone: 'America/Tijuana' explícito — eso es independiente de
// process.env.TZ, a diferencia de Date#getHours/getMinutes/getDay/getDate,
// que sí leen la zona local del proceso y por eso están prohibidas aquí.
//
// `new Date(iso)` con argumento es aritmética de instante (milisegundos
// desde epoch, siempre UTC internamente) y no depende de ninguna zona
// horaria: es distinto de `new Date()` sin argumento, que sí lee el reloj
// del sistema y está prohibido por INV-1.

const TZ = 'America/Tijuana';
const HOUR_MS = 60 * 60 * 1000;

const WEEKDAYS_ES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const WEEKDAYS_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const PARTS_FORMATTER = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ,
  hour12: false,
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
  hour: '2-digit',
  minute: '2-digit',
  second: '2-digit',
  weekday: 'long',
});

// Descompone un instante en sus campos de calendario/reloj vistos desde
// America/Tijuana. No usa Date#getHours ni similares: todo sale de
// Intl.DateTimeFormat con timeZone explícito.
function tijuanaParts(date) {
  const raw = Object.fromEntries(PARTS_FORMATTER.formatToParts(date).map((p) => [p.type, p.value]));
  const hour = raw.hour === '24' ? 0 : Number(raw.hour); // ICU a veces da "24" para medianoche
  return {
    year: Number(raw.year),
    month: Number(raw.month),
    day: Number(raw.day),
    hour,
    minute: Number(raw.minute),
    second: Number(raw.second),
    weekdayEn: raw.weekday,
  };
}

// Offset UTC vigente en America/Tijuana para ese instante (en minutos,
// negativo porque Tijuana siempre está al oeste de UTC). Se deriva
// comparando el instante real contra el mismo instante interpretado como
// si sus campos de calendario fueran UTC — funciona en cualquier lado del
// cambio de horario de verano sin tabla de reglas propia.
function tijuanaOffsetMinutes(date) {
  const p = tijuanaParts(date);
  const asIfUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
  return Math.round((asIfUtc - date.getTime()) / 60000);
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function formatOffset(minutes) {
  const sign = minutes <= 0 ? '-' : '+';
  const abs = Math.abs(minutes);
  return `${sign}${pad2(Math.floor(abs / 60))}:${pad2(abs % 60)}`;
}

// Convierte cualquier ISO con desplazamiento explícito a milisegundos desde
// epoch. Es aritmética de instante pura, no lectura de reloj (INV-1: el
// argumento siempre llega desde afuera).
function instantMs(iso) {
  return new Date(iso).getTime();
}

// Suma milisegundos a un instante y lo serializa como ISO 8601 con el
// desplazamiento que America/Tijuana tenga vigente en ese instante
// resultante (nunca 'Z', nunca sin zona — PRD §7).
function toTijuanaIso(ms) {
  const date = new Date(ms);
  const p = tijuanaParts(date);
  const offset = tijuanaOffsetMinutes(date);
  return `${p.year}-${pad2(p.month)}-${pad2(p.day)}T${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}${formatOffset(offset)}`;
}

// Clave de día de calendario en America/Tijuana, ordenable como string
// ("2026-03-10"). Se usa para agrupar (itinerary.js) y para medir
// diferencia de días.
function dayKeyTijuana(iso) {
  const p = tijuanaParts(new Date(iso));
  return `${p.year}-${pad2(p.month)}-${pad2(p.day)}`;
}

// Diferencia en días de calendario (Tijuana) entre iso y referenceIso:
// 0 = mismo día, 1 = el día siguiente, -1 = el día anterior, etc.
function dayDiffTijuana(iso, referenceIso) {
  const a = tijuanaParts(new Date(iso));
  const b = tijuanaParts(new Date(referenceIso));
  const utcA = Date.UTC(a.year, a.month - 1, a.day);
  const utcB = Date.UTC(b.year, b.month - 1, b.day);
  return Math.round((utcA - utcB) / 86400000);
}

// formatTimeTijuana(iso, lang) -> "9:00 AM" (en) / "9:00 a.m." (es)
// Reloj de 12 horas sin cero a la izquierda en la hora, minutos siempre a
// dos dígitos. "a.m./p.m." en minúsculas con puntos es la convención
// habitual en español de México; no la dicta el PRD de forma literal, así
// que queda documentada aquí como decisión de implementación, no de
// producto.
function formatTimeTijuana(iso, lang) {
  const { hour, minute } = tijuanaParts(new Date(iso));
  const isAm = hour < 12;
  const period = lang === 'es' ? (isAm ? 'a.m.' : 'p.m.') : isAm ? 'AM' : 'PM';
  let hour12 = hour % 12;
  if (hour12 === 0) hour12 = 12;
  return `${hour12}:${pad2(minute)} ${period}`;
}

// isOpenNow(hours, now) -> true | false | null
//
// Añadido en la fase 05 (pantalla "Horarios"): la fase pide un indicador
// "abierto ahora / cerrado" "calculado con now inyectado, nunca con el
// reloj leído dentro de la vista" — eso es una regla de dominio (lee hora
// de Tijuana, compara contra un horario), no una decisión de presentación,
// así que vive aquí y no en src/ui/screens/hours.js, igual que el resto de
// este archivo.
//
// hours.weekly[].day usa la misma convención que Date#getUTCDay():
// 0 = domingo … 6 = sábado. Ningún dato real del proyecto lo confirma
// todavía (locations.js, support.js y plaza.js traen el mismo horario
// placeholder los 7 días, así que el número en sí es indistinguible en la
// práctica) — queda documentada aquí como la convención a seguir cuando
// haya horario real distinto por día.
//
// hours.exceptions no se consulta: ninguna fixture ni contenido real lo
// puebla todavía (siempre `[]`) y el PRD no fija su forma. Inventar una
// forma sin dato real que la respalde sería peor que dejarlo pendiente —
// mismo criterio que ya se aplicó en fase 03 para amenidades y farmacia.
function isOpenNow(hours, now) {
  if (!hours || !Array.isArray(hours.weekly)) return null;
  const p = tijuanaParts(new Date(now));
  const dow = WEEKDAYS_EN.indexOf(p.weekdayEn); // 0=domingo..6=sábado
  const today = hours.weekly.find((w) => w.day === dow);
  if (!today) return false;
  const hm = `${pad2(p.hour)}:${pad2(p.minute)}`;
  return hm >= today.open && hm <= today.close;
}

// formatDayLabel(iso, now, lang) -> { es, en }
// Devuelve SIEMPRE ambos idiomas (igual que groupByDay's `label`): la UI
// puede alternar ES/EN sin volver a llamar al dominio. El parámetro `lang`
// se acepta por simetría con formatTimeTijuana y porque quien llama ya lo
// tiene a mano, pero no cambia qué se calcula.
function formatDayLabel(iso, now, _lang) {
  const diff = dayDiffTijuana(iso, now);
  const { day, weekdayEn } = tijuanaParts(new Date(iso));
  const idx = WEEKDAYS_EN.indexOf(weekdayEn);
  const weekdayEs = WEEKDAYS_ES[idx];

  const es = diff === 0 ? `Hoy · ${weekdayEs} ${day}` : diff === 1 ? `Mañana · ${weekdayEs} ${day}` : `${weekdayEs} ${day}`;
  const en = diff === 0 ? `Today · ${weekdayEn} ${day}` : diff === 1 ? `Tomorrow · ${weekdayEn} ${day}` : `${weekdayEn} ${day}`;

  return { es, en };
}

// --- src/domain/expiry.js ---
// R1 — Caducidad del enlace (PRD §8).
//
//   expiresAt = max( última cita no cancelada , checkout del hospedaje ) + 24h
//
// `lodging` puede ser null (visita sin hospedaje, caso 1g). Si además no
// hay ninguna cita no cancelada, no hay de dónde tomar el máximo: cae al
// caso degenerado 1e (visit.startsAt + 24h) para que el enlace no quede
// vivo para siempre.


function lastNonCancelledAppointmentEndMs(appointments) {
  const ends = appointments
    .filter((a) => a.status !== 'cancelled')
    .map((a) => instantMs(a.startsAt) + a.durationMin * 60 * 1000);
  return ends.length > 0 ? Math.max(...ends) : null;
}

function computeExpiresAt(visit, appointments, lodging) {
  const lastAppointmentEndMs = lastNonCancelledAppointmentEndMs(appointments);
  const checkoutMs = lodging ? instantMs(lodging.checkOut) : null;

  const candidates = [lastAppointmentEndMs, checkoutMs].filter((v) => v !== null);
  const baseMs = candidates.length > 0 ? Math.max(...candidates) : instantMs(visit.startsAt);

  return toTijuanaIso(baseMs + 24 * HOUR_MS);
}

function isExpired(visit, appointments, lodging, now) {
  const expiresAt = computeExpiresAt(visit, appointments, lodging);
  return instantMs(now) > instantMs(expiresAt);
}

// --- src/domain/itinerary.js ---
// R5 — Cita movida (PRD §8) y agrupado del itinerario por día (PRD §9,
// "Visita de varios días").
//
// groupByDay incluye TODAS las citas, también las cancelled (§9 "Cita
// cancelada": permanece en la línea de tiempo, tachada y en gris). Que una
// cancelled quede fuera de "tu siguiente paso" lo decide nextStep.js, no
// este módulo.


function groupByDay(appointments, now) {
  const sorted = [...appointments].sort((a, b) => instantMs(a.startsAt) - instantMs(b.startsAt));

  const groups = new Map();
  for (const appointment of sorted) {
    const key = dayKeyTijuana(appointment.startsAt);
    if (!groups.has(key)) {
      groups.set(key, {
        dayKey: key,
        label: formatDayLabel(appointment.startsAt, now),
        items: [],
      });
    }
    groups.get(key).items.push(appointment);
  }

  return [...groups.values()].sort((a, b) => a.dayKey.localeCompare(b.dayKey));
}

// El distintivo "actualizado" se muestra si el cambio es posterior a la
// última vez que el paciente vio el itinerario en este dispositivo. Sin
// una marca previa (dispositivo nuevo, caso 5c) no se inventa una
// referencia: no hay distintivos.
function isUpdated(appointment, lastViewedItineraryAt) {
  if (lastViewedItineraryAt === null || lastViewedItineraryAt === undefined) return false;
  return instantMs(appointment.updatedAt) > instantMs(lastViewedItineraryAt);
}

// --- src/domain/nextStep.js ---
// R2 — "Tu siguiente paso" (PRD §8).
//
// Si existe una cita in_progress, esa es el siguiente paso. Si no, la
// scheduled más próxima con startsAt >= now. cancelled y done nunca son
// candidatas. Desempate determinista: startsAt, luego locationId, luego id.


function byTiebreak(a, b) {
  const byStart = instantMs(a.startsAt) - instantMs(b.startsAt);
  if (byStart !== 0) return byStart;
  const byLocation = a.locationId.localeCompare(b.locationId);
  if (byLocation !== 0) return byLocation;
  return a.id.localeCompare(b.id);
}

function nextStep(appointments, now) {
  const inProgress = appointments.filter((a) => a.status === 'in_progress');
  if (inProgress.length > 0) {
    return [...inProgress].sort(byTiebreak)[0];
  }

  const nowMs = instantMs(now);
  const upcoming = appointments.filter((a) => a.status === 'scheduled' && instantMs(a.startsAt) >= nowMs);
  if (upcoming.length === 0) return null;

  return [...upcoming].sort(byTiebreak)[0];
}

// --- src/domain/passes.js ---
// R3 — Qué QPASS se muestra (PRD §8, §6.5).
//
// Visible si se cumplen las tres:
//   1. now >= validFrom
//   2. validUntil == null (no caduca) O now <= validUntil
//   3. revokedAt == null
//
// `revokedAt` no es "revocado a partir de esa hora": es la marca de que YA
// se revocó. Cualquier valor no nulo lo apaga de inmediato, sin comparar
// contra `now` — es el único mecanismo de invalidación de un pase sin
// caducidad (INV-4, §6.5).
//
// Orden en pantalla: torre → piso27 → estacionamiento.


const SCOPE_ORDER = { torre: 0, piso27: 1, estacionamiento: 2 };

// Exportada (antes era local a este módulo): la pantalla de emisión del
// panel necesita el MISMO criterio de "revocado" para no contar un pase
// revocado como pase vigente (src/ui/screens/coordinator/qpass.js). Que
// sean dos definiciones distintas de "revocado" es exactamente el bug
// que INV-4 no perdona, así que hay una sola.
function isRevoked(pass) {
  return pass.revokedAt !== null && pass.revokedAt !== undefined;
}

function hasStarted(pass, nowMs) {
  return instantMs(pass.validFrom) <= nowMs;
}

function notYetExpired(pass, nowMs) {
  if (pass.validUntil === null || pass.validUntil === undefined) return true; // no caduca — §6.5
  return instantMs(pass.validUntil) >= nowMs;
}

function visiblePasses(passes, now) {
  const nowMs = instantMs(now);

  return passes
    .filter((p) => !isRevoked(p) && hasStarted(p, nowMs) && notYetExpired(p, nowMs))
    .sort((a, b) => {
      const byScope = SCOPE_ORDER[a.scope] - SCOPE_ORDER[b.scope];
      if (byScope !== 0) return byScope;
      return a.id.localeCompare(b.id);
    });
}

// concatenación de plantillas, y aunque hoy todas las comillas de atributo
// son dobles, un nombre como "Farmer's Table" dentro de un atributo con
// comillas simples se escaparía del valor. Escapar los cinco caracteres
// cuesta lo mismo que escapar cuatro y quita la dependencia de que quien
// escriba la siguiente plantilla se acuerde de usar comillas dobles.
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// classNames(['a', cond && 'b', 'c']) -> "a c"  (omite valores falsy)
function classNames(list) {
  return list.filter(Boolean).join(' ');
}

// Nombre de ubicación en el idioma activo, con reserva razonable si el id
// no existiera en el catálogo (no debería pasar — probado en fase 03/04 —
// pero una pantalla nunca debe reventar por un locationId huérfano).
function locationName(locations, locationId, lang) {
  const loc = getLocationById(locations, locationId);
  if (!loc) return locationId;
  return loc.name[lang] ?? loc.name.es;
}

// El mismo .find() estaba repetido inline en media docena de sitios. Vive
// aquí para que "buscar una Location por id" tenga un solo nombre.
function getLocationById(locations, locationId) {
  return locations.find((l) => l.id === locationId) ?? null;
}

// Opciones de un <select> de ubicación, en el idioma activo. La comparten
// el formulario de agregar cita y el de editar (src/ui/screens/coordinator/
// itinerary.js), que necesitan la misma lista pero con distinto valor
// preseleccionado.
function locationOptionsHtml(locations, lang, selectedId = null) {
  return locations
    .map((loc) => {
      const selected = loc.id === selectedId ? ' selected' : '';
      return `<option value="${escapeHtml(loc.id)}"${selected}>${escapeHtml(loc.name[lang] ?? loc.name.es)}</option>`;
    })
    .join('\n');
}

function renderFicha({ title, lines = [], unconfirmed = false, t, extra = '' }) {

function resolveInitialLang(navigatorLanguage, storedLang) {
  if (storedLang && SUPPORTED_LANGS.includes(storedLang)) return storedLang;
  if (navigatorLanguage && navigatorLanguage.toLowerCase().startsWith('en')) return 'en';
  return DEFAULT_LANG;
}

// Acceso por ruta de puntos ("home.nextStepCta"). Lanza si la llave no
// existe en vez de devolver undefined en silencio: una llave mal escrita
// debe romper visiblemente en desarrollo, no aparecer como "undefined" en
// pantalla.
//
// Se llama "translate", no "t": src/ui/app.js necesita el nombre corto "t"
// para la función local que cada pantalla recibe como ctx.t (usada por
// docenas de llamadas en los 7 archivos de src/ui/screens/), y build.py
// (fase 05) no soporta "import { t as translate }" — aplana los módulos a
// un solo scope por nombre declarado, sin manejar alias. Dos nombres
// distintos de origen evita necesitar un alias en primer lugar.
function translate(lang, path) {
  const dict = STRINGS[SUPPORTED_LANGS.includes(lang) ? lang : DEFAULT_LANG];
  const value = path.split('.').reduce((node, key) => {
    if (node === undefined) throw new Error(`i18n: falta la llave "${path}" en "${lang}"`);
    return node[key];
  }, dict);
  if (value === undefined) throw new Error(`i18n: falta la llave "${path}" en "${lang}"`);
  return value;
}

// --- src/domain/routing.js ---
// R7 — Origen por defecto de la ruta (PRD §8) + resolución de rutas
// origen→destino (fase 02). Sin posicionamiento en vivo (PRD §6.3): la app
// propone el origen, nunca lo detecta.


// defaultOrigin(appointment, appointments, lodging) -> locationId | null
//
// Regla: la ubicación de la cita anterior del mismo día (Tijuana),
// ignorando canceladas. Si no hay ninguna anterior (primera cita del día),
// el origen es Quartz cuando el paciente ya tiene el hospedaje activo a
// esa hora (checkIn <= startsAt <= checkOut) — si no, Estacionamiento.
// Devuelve null si `appointment` no aparece en `appointments` (no hay
// forma confiable de determinar "la anterior").
function defaultOrigin(appointment, appointments, lodging) {
  const found = appointments.some((a) => a.id === appointment.id);
  if (!found) return null;

  const sameDayKey = dayKeyTijuana(appointment.startsAt);
  const startMs = instantMs(appointment.startsAt);

  const priorSameDay = appointments
    .filter((a) => a.id !== appointment.id)
    .filter((a) => a.status !== 'cancelled')
    .filter((a) => dayKeyTijuana(a.startsAt) === sameDayKey)
    .filter((a) => instantMs(a.startsAt) < startMs)
    .sort((a, b) => instantMs(b.startsAt) - instantMs(a.startsAt)); // más reciente primero

  if (priorSameDay.length > 0) {
    return priorSameDay[0].locationId;
  }

  // Primera cita (no cancelada) del día: ¿el paciente ya está hospedado?
  if (lodging) {
    const checkInMs = instantMs(lodging.checkIn);
    const checkOutMs = instantMs(lodging.checkOut);
    if (checkInMs <= startMs && startMs <= checkOutMs) {
      return 'quartz';
    }
  }

  return 'estacionamiento';
}

// Nodo por el que pasa todo el complejo: se entra por ahí desde el
// estacionamiento y desde el hotel, y de ahí salen los elevadores a la torre
// y los accesos a Nivel 1 y farmacia. Por eso es el punto de composición.
const HUB_LOCATION_ID = 'lobby_torre';

// resolveRoute(fromLocationId, toLocationId, routes) -> Route | SameLocation | null
//
// Primero busca una ruta directa redactada a mano. Si no existe, compone
// origen → lobby → destino (D41). El catálogo directo cubre 17 de los 42
// pares ordenados; escribir los otros 32 a mano habría sido inventar
// contenido par por par, cuando todos siguen siendo provisionales hasta que
// lleguen los planos oficiales (PRD §15.1). Componer por el lobby es
// provisional igual, pero al menos es cierto: así se camina el edificio.
//
// La ruta compuesta tiene exactamente la misma forma que una directa (el
// mapa la consume sin saber la diferencia) y se marca `composed: true` por
// si alguna pantalla quiere distinguirla.
function resolveRoute(fromLocationId, toLocationId, routes) {
  if (fromLocationId === toLocationId) {
    return { kind: 'same_location', locationId: fromLocationId };
  }

  const direct = routes.find((r) => r.fromLocationId === fromLocationId && r.toLocationId === toLocationId);
  if (direct) return direct;

  // Si uno de los extremos ya es el lobby, no hay nada que componer: o había
  // ruta directa o no la hay. (El catálogo garantiza las 12 contra el lobby
  // — probado en test/domain/routing.test.js —, así que esto solo se alcanza
  // con un locationId que no existe.)
  if (fromLocationId === HUB_LOCATION_ID || toLocationId === HUB_LOCATION_ID) return null;

  const toHub = routes.find((r) => r.fromLocationId === fromLocationId && r.toLocationId === HUB_LOCATION_ID);
  const fromHub = routes.find((r) => r.fromLocationId === HUB_LOCATION_ID && r.toLocationId === toLocationId);
  if (!toHub || !fromHub) return null;

  return {
    id: `${toHub.id}+${fromHub.id}`,
    fromLocationId,
    toLocationId,
    estimatedMinutes: toHub.estimatedMinutes + fromHub.estimatedMinutes,
    unconfirmed: true,
    composed: true,
    steps: [...toHub.steps, ...fromHub.steps].map((s, i) => ({ ...s, order: i + 1 })),
  };
}

// Geometría del esquema (D30) — coordenadas leídas directamente del fondo
// del mapa a resolución completa (1 unidad de este SVG = 1px de esa
// imagen, ver MAP_BACKGROUND_SRC arriba), no una fila
// abstracta como en D26. El ancho del viewBox SÍ cambió esta vez (420→700):
// a diferencia de D26, aquí no había forma de preservar el ancho anterior
// y a la vez mostrar la imagen real sin recortarla ni deformarla, así que
// la medición de radio de toque de D26 (52.27px) queda invalidada a
// propósito y hay que volver a medirla con getBoundingClientRect() en el
// navegador real antes de dar esto por terminado — no reescribir este
// comentario con un número sin haberlo medido de nuevo.
//
// Radio 46 en las 7 (antes 32, viewBox 420 ancho; un primer intento con
// 44 en el viewBox 700 de ahora midió 43.12px, por debajo del mínimo).
// Medido de verdad con getBoundingClientRect() en el navegador, a 375px de
// ancho de viewport: el SVG ocupa 343px efectivos dentro de su contenedor
// (mismo número que D26, el padding del contenedor no cambió), y con
// radio 46 el diámetro tocable real dio 45.08px — por encima del mínimo de
// 44px pedido, no solo cerca.
const POINT_LAYOUT = {
  mp_parking: { x: 60, y: 165, r: 46 },
  mp_pharmacy: { x: 620, y: 175, r: 46 },
  mp_lobby: { x: 522, y: 235, r: 46 },
  mp_floor27: { x: 500, y: 115, r: 46 },
  mp_quartz: { x: 130, y: 609, r: 46 },

const CAPTION = {
  es: 'Esquema referencial — sujeto a los planos oficiales',
  en: 'Reference schematic — subject to official floor plans',
};

const ARIA_MAP_LABEL = {
  es: 'Mapa esquemático del complejo NewCity',
  en: 'Schematic map of the NewCity complex',
};

function escapeXml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function shortLabel(location, lang) {
  // Etiqueta corta bajo cada punto: primera parte del nombre bilingüe
  // (antes del " · "), para no saturar un círculo de 56 unidades con el
  // nombre completo de ubicaciones compuestas como "Nivel 1 · Gastronomía
  // (Farmer's Table, The Park Restaurante)".
  const full = location.name[lang] ?? location.name.es;
  return full.split(' · ')[0];
}

function getMapPointMeta(mapPointId, lang = 'es') {
  const location = locations.find((l) => l.mapPointId === mapPointId);
  if (!location) return null;
  const blurb = POINT_BLURB[mapPointId]?.[lang] ?? POINT_BLURB[mapPointId]?.es ?? '';
  return {
    id: mapPointId,
    locationId: location.id,
    name: location.name[lang] ?? location.name.es,
    blurb,
    hours: location.hours,
    unconfirmed: location.unconfirmed === true,
  };
}

// Ancho estimado del texto de la etiqueta, para dibujar una placa de
// fondo detrás de ella (D30): sobre un fondo blanco liso bastaba con el
// contraste de color, pero sobre la imagen real esas mismas letras caen a
// veces sobre bloques de color oscuro o intenso (H8 azul, G3 morado) donde
// dejarían de leerse. No hay DOM real aquí para medir el ancho de verdad
// (mismo motivo que ya documenta test/ui/plaza.test.js para no simular
// clics) — 7.2px por carácter es un promedio razonable para Barlow 600
// 13px, con margen de sobra a propósito: una placa un poco más ancha de lo
// estrictamente necesario es inofensiva, una más angosta corta letras.
function estimateLabelWidth(text) {
  return text.length * 7.2 + 16;
}

function pointGroupSvg(mapPointId, lang) {
  const layout = POINT_LAYOUT[mapPointId];
  const location = locations.find((l) => l.mapPointId === mapPointId);
  if (!layout || !location) return '';
  const label = escapeXml(shortLabel(location, lang));
  const ariaLabel = escapeXml(location.name[lang] ?? location.name.es);
  const labelY = layout.y + layout.r + 16;
  const labelWidth = estimateLabelWidth(label);
  return `
    <g class="nc-map-point" data-map-point-id="${mapPointId}" role="button" tabindex="0" aria-label="${ariaLabel}">
      <circle class="nc-map-point-hit" cx="${layout.x}" cy="${layout.y}" r="${layout.r}"></circle>
      <rect class="nc-map-label-bg" x="${layout.x - labelWidth / 2}" y="${labelY - 13}" width="${labelWidth}" height="18" rx="5"></rect>
      <text class="nc-map-point-label" x="${layout.x}" y="${labelY}" text-anchor="middle">${label}</text>
    </g>`;
}

// Líneas conectoras decorativas — no interactivas, solo dan idea de
// "todos los puntos están conectados dentro del mismo complejo" (misma
// leyenda que ya traía la imagen de referencia). Se derivan del catálogo
// real de rutas (src/data/routes.js) en vez de inventar qué conecta con
// qué: cada par from→to del catálogo dibuja una línea entre sus dos
// mapPointId, sin duplicar cuando el catálogo trae ambos sentidos (p. ej.
// quartz→lobby_torre y lobby_torre→quartz son la misma línea visual).
function connectorsSvg() {
  const mapPointIdByLocationId = new Map(locations.map((l) => [l.id, l.mapPointId]));
  const seen = new Set();
  const lines = [];
  for (const route of routes) {
    const fromId = mapPointIdByLocationId.get(route.fromLocationId);
    const toId = mapPointIdByLocationId.get(route.toLocationId);
    if (!fromId || !toId || fromId === toId) continue;
    const key = [fromId, toId].sort().join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    const a = POINT_LAYOUT[fromId];
    const b = POINT_LAYOUT[toId];
    if (!a || !b) continue;
    lines.push(`<line class="nc-map-connector" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"></line>`);
  }
  return lines.join('\n    ');
}

// --- src/map/highlights.js ---
// Fase 04 — resaltado del mapa. `highlightStep(mapHighlightId)` debe
// "resaltar el tramo correspondiente y quitar el resaltado anterior"
// (criterio de aceptación de la fase). mapHighlightId y mapPointId
// comparten el mismo espacio de 7 valores (routes.js reusa a propósito el
// vocabulario de mapPointId para resaltar, ver su comentario de cabecera),
// así que "resaltar un tramo" en la práctica es resaltar el punto del mapa
// asociado al paso de ruta actual.
//
// División deliberada en dos partes:
//   - computeHighlightChange: pura, decide QUÉ cambia (qué se quita, qué se
//     agrega). Se prueba con node:test sin ningún DOM.
//   - createHighlighter: envoltorio delgado que aplica ese cambio sobre un
//     `root` real (clases CSS en el SVG vivo). No asume el DOM completo del
//     navegador — solo pide un objeto con getElementsByMapPointId(id), que
//     el propio SVG generado por complexMap.js implementa vía
//     querySelectorAll y que un doble de prueba puede implementar con un
//     Map en memoria (ver test/map/ids.test.js). Así "quita el resaltado
//     anterior" queda probado con node:test puro; solo la verificación de
//     que el SVG *vivo* en un navegador real de verdad se ve resaltado
//     queda para el navegador integrado, como pide la fase 04 en su propia
//     sección de Verificación.

const HIGHLIGHT_CLASS = 'nc-map-highlight';

function computeHighlightChange(previousId, nextId) {
  return {
    remove: previousId ?? null,
    add: nextId,
  };
}

function createHighlighter(root) {
  let currentId = null;
  return {
    highlightStep(mapHighlightId) {
      const change = computeHighlightChange(currentId, mapHighlightId);
      if (change.remove !== null) {
        for (const el of root.getElementsByMapPointId(change.remove)) {
          el.classList.remove(HIGHLIGHT_CLASS);
        }
      }
      for (const el of root.getElementsByMapPointId(change.add)) {
        el.classList.add(HIGHLIGHT_CLASS);
      }
      currentId = change.add;
      return change;
    },
    currentHighlightId() {
      return currentId;
    },
  };
}

// Adaptador de conveniencia para usar createHighlighter contra un SVG real
// insertado en el DOM del navegador (elementNode = <svg> o cualquier
// contenedor que lo envuelva). No se prueba con node:test (no hay DOM ahí);
// lo ejercita src/map/demo.html a mano en el navegador integrado.
function highlighterForSvgElement(svgElement) {
  return createHighlighter({
    getElementsByMapPointId(id) {
      return Array.from(svgElement.querySelectorAll(`[data-map-point-id="${id}"]`));
    },
  });
}

// --- src/ui/screens/map.js ---
// Mapa y accesos — el mapa de la fase 04 más la ruta paso a paso (fase 05).
// Ruta por defecto: origen = R7 (defaultOrigin) a partir de "tu siguiente
// paso" (R2); destino = la ubicación de esa cita. Tocar cualquier otro
// punto del mapa recalcula la ruta hacia ESE punto sin cambiar el origen.
//
// Esta pantalla no decide nada de dominio por sí misma: nextStep,
// defaultOrigin y resolveRoute son las tres únicas fuentes de verdad, y
// las tres vienen de src/domain/.








function mapPointIdForLocation(locationId) {
  return locations.find((l) => l.id === locationId)?.mapPointId ?? null;
}

function renderMapScreen(ctx) {
  const { t, lang } = ctx;
  return `
    <section class="nc-screen nc-map-screen">
      <h1 class="nc-screen-title">${escapeHtml(t('map.title'))}</h1>
      <div class="nc-map-mount"></div>
      <div class="nc-route-panel" data-role="route-panel"></div>
      <div class="nc-ficha-slot" data-role="ficha-slot"></div>
    </section>

}

// Llamado después de insertar renderMapScreen en el DOM: monta el SVG,
// calcula la ruta por defecto y engancha la interacción. Toda la parte
// "esto se resalta al tocar" es DOM real (igual que src/map/demo.html en
// fase 04) — no se puede probar con node:test, por eso no hay
// test/ui/map.test.js: el criterio de la fase 05 para esta pantalla se
// cumple en el recorrido de navegador, no con una prueba automatizada.
function attachMapScreen(rootEl, ctx) {
  const { appointments, lodging, now, lang, t } = ctx;
  const mount = rootEl.querySelector('.nc-map-mount');
  mount.innerHTML = renderComplexMapSvg({ lang });
  const svgEl = mount.querySelector('svg');
  const highlighter = highlighterForSvgElement(svgEl);

  const routePanel = rootEl.querySelector('[data-role="route-panel"]');
  const fichaSlot = rootEl.querySelector('[data-role="ficha-slot"]');

  const focusedAppointment = nextStep(appointments, now);
  const origin = focusedAppointment ? defaultOrigin(focusedAppointment, appointments, lodging) : 'estacionamiento';

  let stepIndex = 0;

  function renderRouteFor(destinationLocationId) {
    if (!destinationLocationId) {
      routePanel.innerHTML = `<p class="nc-route-empty">${escapeHtml(t('map.chooseDestination'))}</p>`;
      return;
    }
    const result = resolveRoute(origin, destinationLocationId, routes);
    stepIndex = 0;
    if (result === null) {
      routePanel.innerHTML = `<p class="nc-route-empty">${escapeHtml(t('map.routeNone'))}</p>`;
      return;
    }
    if (result.kind === 'same_location') {
      routePanel.innerHTML = `<p class="nc-route-empty">${escapeHtml(t('map.sameLocation'))}</p>`;
      const mp = mapPointIdForLocation(result.locationId);
      if (mp) highlighter.highlightStep(mp);
      return;
    }
    renderStepPanel(result);
  }

  function renderStepPanel(route) {
    const step = route.steps[stepIndex];
    highlighter.highlightStep(step.mapHighlightId);
    routePanel.innerHTML = `
      <p class="nc-route-step-count">${escapeHtml(t('map.routeStep')(stepIndex + 1, route.steps.length))}</p>
      <p class="nc-route-step-text">${escapeHtml(step.instruction[lang])}</p>
      <div class="nc-route-nav">
        <button type="button" class="nc-button" data-role="prev" ${stepIndex === 0 ? 'disabled' : ''}>${escapeHtml(t('map.routePrev'))}</button>
        <button type="button" class="nc-button" data-role="next" ${stepIndex === route.steps.length - 1 ? 'disabled' : ''}>${escapeHtml(t('map.routeNext'))}</button>
      </div>
    `;
    routePanel.querySelector('[data-role="prev"]')?.addEventListener('click', () => {
      if (stepIndex > 0) {
        stepIndex -= 1;
        renderStepPanel(route);
      }
    });
    routePanel.querySelector('[data-role="next"]')?.addEventListener('click', () => {
      if (stepIndex < route.steps.length - 1) {
        stepIndex += 1;
        renderStepPanel(route);
      }
    });
  }

  function openFicha(mapPointId) {
    fichaSlot.innerHTML = renderFichaHtml(mapPointId, lang);
    const meta = getMapPointMeta(mapPointId, lang);
    fichaSlot.querySelector('[data-directions-for]')?.addEventListener('click', () => {
      renderRouteFor(meta.locationId);
    });
  }

  for (const id of MAP_POINT_IDS) {
    const group = svgEl.querySelector(`[data-map-point-id="${id}"]`);
    if (!group) continue;
    group.addEventListener('click', () => openFicha(id));
    group.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        openFicha(id);
      }
    });
  }

  renderRouteFor(focusedAppointment ? focusedAppointment.locationId : null);
}

.nc-route-step-count { margin: 0 0 4px; font-size: 12px; opacity: 0.7; }

// --- src/render/code128.js ---
// Fase 06 — generador de Code128 (subset B) sin dependencias externas.
//
// Solo Code Set B: cubre ASCII imprimible 32–126 (`valor = código - 32`),
// que es todo lo que produce src/data/fixtures.js hoy (`payload-${id}`).
// A diferencia de qr.js (modo byte, acepta UTF-8 arbitrario), Code128 no
// tiene un "modo byte" universal — un payload con acentos simplemente no
// es representable en subset B y esta función lo rechaza con un mensaje
// claro en vez de corromperlo o transliterarlo por su cuenta.
//
// La tabla de 107 patrones de barras (CODES) y el algoritmo de checksum
// (start + Σ valor_i × posición_i, mod 103) se verificaron leyendo el
// código fuente de la librería de referencia python-barcode (MIT, PyPI)
// instalada en este entorno — no de memoria — y el símbolo resultante se
// decodificó con éxito con cv2.barcode_BarcodeDetector de OpenCV
// (independiente de este archivo y de esa librería) para varios textos.

const CODES = [
  '11011001100', '11001101100', '11001100110', '10010011000', '10010001100',
  '10001001100', '10011001000', '10011000100', '10001100100', '11001001000',
  '11001000100', '11000100100', '10110011100', '10011011100', '10011001110',
  '10111001100', '10011101100', '10011100110', '11001110010', '11001011100',
  '11001001110', '11011100100', '11001110100', '11101101110', '11101001100',
  '11100101100', '11100100110', '11101100100', '11100110100', '11100110010',
  '11011011000', '11011000110', '11000110110', '10100011000', '10001011000',
  '10001000110', '10110001000', '10001101000', '10001100010', '11010001000',
  '11000101000', '11000100010', '10110111000', '10110001110', '10001101110',
  '10111011000', '10111000110', '10001110110', '11101110110', '11010001110',
  '11000101110', '11011101000', '11011100010', '11011101110', '11101011000',
  '11101000110', '11100010110', '11101101000', '11101100010', '11100011010',
  '11101111010', '11001000010', '11110001010', '10100110000', '10100001100',
  '10010110000', '10010000110', '10000101100', '10000100110', '10110010000',
  '10110000100', '10011010000', '10011000010', '10000110100', '10000110010',
  '11000010010', '11001010000', '11110111010', '11000010100', '10001111010',
  '10100111100', '10010111100', '10010011110', '10111100100', '10011110100',
  '10011110010', '11110100100', '11110010100', '11110010010', '11011011110',
  '11011110110', '11110110110', '10101111000', '10100011110', '10001011110',
  '10111101000', '10111100010', '11110101000', '11110100010', '10111011110',
  '10111101110', '11101011110', '11110101110', '11010000100', '11010010000',
  '11010011100',
];
const STOP_PATTERN = '11000111010' + '11'; // patrón de paro + barra final ancha

const START_B = 104;
const MIN_CHAR = 32;
const MAX_CHAR = 126;

function charValueB(char) {
  const code = char.charCodeAt(0);
  if (code < MIN_CHAR || code > MAX_CHAR) {
    throw new Error(`code128: el carácter "${char}" (código ${code}) no está en el subset B (ASCII ${MIN_CHAR}–${MAX_CHAR})`);
  }
  return code - MIN_CHAR;
}

function encodedValues(text) {
  const values = [START_B];
  for (const char of text) values.push(charValueB(char));
  let checksum = values[0];
  for (let i = 1; i < values.length; i++) checksum += i * values[i];
  values.push(checksum % 103);
  return values;
}

// generateCode128Bars(text) -> string de '1'/'0' (ancho de barra=1 unidad
// por carácter), sin margen quieto. El renderer decide unidades por
// símbolo y margen.
function generateCode128Bars(text) {
  const values = encodedValues(text);
  return values.map((v) => CODES[v]).join('') + STOP_PATTERN;
}

function renderCode128Svg(text, { quietZone = 10, unitWidth = 2, height = 80 } = {}) {
  const bars = generateCode128Bars(text);
  const totalUnits = bars.length + quietZone * 2;
  const px = totalUnits * unitWidth;
  let rects = '';
  let x = quietZone * unitWidth;
  for (const bit of bars) {
    if (bit === '1') rects += `<rect x="${x}" y="0" width="${unitWidth}" height="${height}"/>`;
    x += unitWidth;
  }
  // Sin width/height explícitos en el <svg>: "auto" no es un valor válido
  // para el atributo SVG height (a diferencia de CSS) — el viewBox solo ya
  // alcanza para que escale, y el ancho/alto real lo pone el CSS del
  // contenedor (.nc-pass-symbol svg en src/ui/screens/pass.js).
  return `<svg viewBox="0 0 ${px} ${height}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="0" y="0" width="${px}" height="${height}" fill="#FFFFFF"/><g fill="#000000">${rects}</g></svg>`;
}

// decodeCode128Bars — SOLO para el redondeo de las pruebas de esta fase,
// igual que decodeQrMatrix en qr.js: no es un lector general (asume un
// símbolo bien formado, subset B puro, sin corrección de errores — Code128
// no la tiene, a diferencia de QR).
function decodeCode128Bars(bars) {
  if (!bars.endsWith(STOP_PATTERN)) {
    throw new Error('code128 decode: no termina en el patrón de paro esperado');
  }
  const body = bars.slice(0, -STOP_PATTERN.length);
  if (body.length % 11 !== 0) {
    throw new Error('code128 decode: longitud de cuerpo no es múltiplo de 11');
  }
  const values = [];
  for (let i = 0; i < body.length; i += 11) {
    const chunk = body.slice(i, i + 11);
    const idx = CODES.indexOf(chunk);
    if (idx === -1) throw new Error(`code128 decode: patrón de 11 bits no reconocido en la posición ${i}`);
    values.push(idx);
  }
  if (values[0] !== START_B) throw new Error('code128 decode: no empieza con START B — este decodificador solo entiende subset B');
  const dataValues = values.slice(1, -1);
  const checksum = values[values.length - 1];
  let expected = values[0];
  for (let i = 0; i < dataValues.length; i++) expected += (i + 1) * dataValues[i];
  if (expected % 103 !== checksum) throw new Error('code128 decode: checksum no coincide');
  return dataValues.map((v) => String.fromCharCode(v + MIN_CHAR)).join('');
}

const CODE128_CONFIG = { minChar: MIN_CHAR, maxChar: MAX_CHAR };

// --- src/render/qr.js ---
// Fase 06 — generador de QR sin dependencias externas (ISO/IEC 18004).
//
// ALCANCE DELIBERADAMENTE ACOTADO, no un generador general: Versión 3
// (29×29), nivel de corrección de errores M, modo byte, un solo bloque
// (sin entrelazado). PRD §15.7 no tiene todavía el formato real del
// payload del QPASS confirmado — en vez de construir las 40 versiones ×
// 4 niveles del spec completo sin saber qué hace falta de verdad,
// se acota a una configuración que cubre payloads cortos (hasta 42 bytes
// UTF-8) y se documenta el límite: un payload real más largo obliga a
// ampliar esto, no a que el generador falle en silencio (por eso
// generateQrMatrix lanza una excepción clara si no cabe, en vez de
// truncar o corromper el símbolo).
//
// Verificación real de este archivo (no solo que mi propio decodificador
// esté de acuerdo consigo mismo, que es una prueba débil — encoder y
// decoder comparten código, así que un error sistemático en los dos se
// disfraza de éxito): se instaló la librería de referencia
// nayuki/QR-Code-generator (MIT, PyPI: qrcodegen) y OpenCV, y se comparó
// byte a byte / módulo a módulo contra ella para la misma versión, nivel
// y máscara — 0 diferencias tras la corrección final — y por separado se
// decodificó el símbolo generado por ESTE archivo con QRCodeDetector de
// OpenCV (independiente de nayuki y de mi propio código) para varios
// textos, incluyendo no-ASCII y el largo máximo: los 6 casos coincidieron
// exactos. En el camino aparecieron y se corrigieron cuatro bugs reales
// que las pruebas de redondeo propias NUNCA habrían detectado por sí
// solas (compartían el mismo malentendido en encode y decode): el
// recorrido en zigzag de columnas, las dos copias de información de
// formato con fila/columna transpuestas, y — el más caro de encontrar —
// que `FORMAT_INFO_M` está indexado bit-más-significativo-primero (como
// lo publica thonky.com y como lo da mi propio cálculo de BCH) mientras
// que el algoritmo de referencia coloca los bits contando desde el menos
// significativo; bitAt() traduce entre las dos convenciones.
//
// Lo que esta verificación NO cubre: una prueba contra un lector físico
// real, que es justo lo que el archivo de esta fase exige antes de darla
// por terminada — un símbolo que decodifica bien en dos programas no
// garantiza que se lea bien desde la pantalla de un teléfono a brillo
// normal.

const GF_EXP = new Array(512);
const GF_LOG = new Array(256);
(function initGaloisField() {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = x;
    GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d; // x^8 + x^4 + x^3 + x^2 + 1
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();

function gfMul(a, b) {
  if (a === 0 || b === 0) return 0;
  return GF_EXP[GF_LOG[a] + GF_LOG[b]];
}

// Multiplica dos polinomios (coeficientes de mayor a menor grado) en GF(256).
function polyMulGf(a, b) {
  const result = new Array(a.length + b.length - 1).fill(0);
  for (let i = 0; i < a.length; i++) {
    for (let j = 0; j < b.length; j++) {
      result[i + j] ^= gfMul(a[i], b[j]);
    }
  }
  return result;
}

function rsGeneratorPoly(numEccCodewords) {
  let g = [1];
  for (let i = 0; i < numEccCodewords; i++) {
    g = polyMulGf(g, [1, GF_EXP[i]]);
  }
  return g;
}

// Codewords de corrección de error para un solo bloque de datos, vía
// división polinomial "sintética" (LFSR) — algoritmo estándar de
// libro de texto para codificar Reed-Solomon sistemático.
function rsComputeEcc(dataCodewords, numEccCodewords) {
  const generator = rsGeneratorPoly(numEccCodewords);
  const remainder = dataCodewords.concat(new Array(numEccCodewords).fill(0));
  for (let i = 0; i < dataCodewords.length; i++) {
    const factor = remainder[i];
    if (factor === 0) continue;
    for (let j = 0; j < generator.length; j++) {
      remainder[i + j] ^= gfMul(generator[j], factor);
    }
  }
  return remainder.slice(dataCodewords.length);
}

// --- Versión 3 / nivel M — constantes verificadas, ver comentario de cabecera ---
const SIZE = 29;
const DATA_CODEWORDS = 44;
const ECC_CODEWORDS = 26;
const MAX_BYTES = Math.floor((DATA_CODEWORDS * 8 - 4 - 8) / 8); // 4 bits modo + 8 bits contador (bytes, versión ≤9) — 42

// Strings de información de formato (15 bits, ya con BCH + máscara XOR
// aplicados) para nivel M, índice = patrón de máscara 0–7. Verificados por
// partida doble: coinciden con thonky.com/qr-code-tutorial/format-version-tables
// Y con un cálculo propio de BCH(15,5) (generador 0x537, máscara 0x5412).
const FORMAT_INFO_M = [
  '101010000010010',
  '101000100100101',
  '101111001111100',
  '101101101001011',
  '100010111111001',
  '100000011001110',
  '100111110010111',
  '100101010100000',
];

// Posiciones del patrón de alineación — fórmula de
// nayuki/QR-Code-generator (getAlignmentPatternPositions), no una tabla
// copiada a mano. Para versión 3 da [6, 22]; se excluyen las
// combinaciones que caen sobre un patrón buscador, dejando un único
// patrón de alineación en (22, 22).
function alignmentPatternCenters(version) {
  if (version === 1) return [];
  const numAlign = Math.floor(version / 7) + 2;
  const size = 17 + version * 4;
  const step = Math.floor((version * 8 + numAlign * 3 + 5) / (numAlign * 4 - 4)) * 2;
  const positions = [6];
  for (let pos = size - 7; positions.length < numAlign; pos -= step) {
    positions.splice(1, 0, pos);
  }
  return positions;
}

function isNearFinder(r, c) {
  const inTopLeft = r < 9 && c < 9;
  const inTopRight = r < 9 && c >= SIZE - 8;
  const inBottomLeft = r >= SIZE - 8 && c < 9;
  return inTopLeft || inTopRight || inBottomLeft;
}

function createGrid(fill) {
  return Array.from({ length: SIZE }, () => new Array(SIZE).fill(fill));
}

function stampFinderPattern(modules, reserved, topRow, leftCol) {
  for (let r = -1; r <= 7; r++) {
    for (let c = -1; c <= 7; c++) {
      const rr = topRow + r;
      const cc = leftCol + c;
      if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) continue;
      reserved[rr][cc] = true;
      if (r < 0 || r > 6 || c < 0 || c > 6) {
        modules[rr][cc] = false; // separador
      } else {
        const onRing = r === 0 || r === 6 || c === 0 || c === 6;
        const onCore = r >= 2 && r <= 4 && c >= 2 && c <= 4;
        modules[rr][cc] = onRing || onCore;
      }
    }
  }
}

function stampAlignmentPattern(modules, reserved, centerRow, centerCol) {
  for (let r = -2; r <= 2; r++) {
    for (let c = -2; c <= 2; c++) {
      const rr = centerRow + r;
      const cc = centerCol + c;
      reserved[rr][cc] = true;
      const onRing = r === -2 || r === 2 || c === -2 || c === 2;
      modules[rr][cc] = onRing || (r === 0 && c === 0);
    }
  }
}

function buildFunctionPatterns() {
  const modules = createGrid(false);
  const reserved = createGrid(false);

  stampFinderPattern(modules, reserved, 0, 0);
  stampFinderPattern(modules, reserved, 0, SIZE - 7);
  stampFinderPattern(modules, reserved, SIZE - 7, 0);

  // Patrón de temporización (timing): fila 6 y columna 6, alternando,
  // entre los separadores de los tres buscadores.
  for (let i = 8; i < SIZE - 8; i++) {
    modules[6][i] = i % 2 === 0;
    reserved[6][i] = true;
    modules[i][6] = i % 2 === 0;
    reserved[i][6] = true;
  }

  const centers = alignmentPatternCenters(3);
  for (const cr of centers) {
    for (const cc of centers) {
      if (isNearFinder(cr, cc)) continue;
      stampAlignmentPattern(modules, reserved, cr, cc);
    }
  }

  // Módulo oscuro fijo, versión V: (4V+9, 8) en (fila, columna).
  modules[4 * 3 + 9][8] = true;
  reserved[4 * 3 + 9][8] = true;

  // Áreas reservadas para información de formato (se rellenan después de
  // elegir máscara): franjas junto a los tres buscadores. Deben calzar
  // EXACTO con dónde escribe stampFormatInfo — de ahí el error real que
  // tuvo esta fase: un `i <= 8` simétrico para las cuatro franjas parecía
  // razonable pero reservaba una celda de más en cada una de las dos
  // mitades de la segunda copia (columna 8 fila 8, y fila 8 columna 20),
  // celdas que en realidad le tocaban a los datos — verificado generando
  // 12 símbolos con codewords aleatorios vía la librería de referencia de
  // nayuki y viendo cuáles celdas nunca cambiaban.
  for (let i = 0; i <= 8; i++) {
    reserved[8][i] = true; // copia 1, primera mitad: fila 8, columnas 0–8
    reserved[i][8] = true; // copia 1, segunda mitad: columna 8, filas 0–8
  }
  for (let i = 0; i < 8; i++) {
    reserved[8][SIZE - 1 - i] = true; // copia 2, primera mitad: fila 8, columnas 21–28
  }
  for (let i = 8; i < 15; i++) {
    reserved[SIZE - 15 + i][8] = true; // copia 2, segunda mitad: columna 8, filas 22–28
  }

  return { modules, reserved };
}

// FORMAT_INFO_M[m][0] es el bit MÁS significativo (así se publican en
// thonky.com y así los devuelve mi propio cálculo de BCH). El algoritmo de
// referencia (nayuki) coloca los bits con `(valor >> i) & 1` — es decir,
// i=0 es el bit MENOS significativo. bitAt(bits, i) traduce entre las dos
// convenciones; usarla en vez de `bits[i]` directo en todo este archivo es
// justo lo que faltaba — confirmado leyendo el algoritmo verbatim con
// marcadores de índice en vez de booleanos (no hay forma de que ese
// resultado sea ambiguo) y viéndolo coincidir bit a bit contra
// FORMAT_INFO_M solo después de invertir el índice.
function bitAt(bits, i) {
  return bits[14 - i] === '1';
}

function stampFormatInfo(modules, maskPattern) {
  const bits = FORMAT_INFO_M[maskPattern];
  // Copia 1 — envuelve la esquina del buscador superior izquierdo: baja
  // por la columna 8 (bits 0–5, filas 0–5), gira en (7,8)/(8,8) [bits
  // 6–7], gira otra vez en (8,7) [bit 8] y cruza la fila 8 hacia la
  // izquierda (bits 9–14, columnas 5..0).
  for (let i = 0; i < 6; i++) modules[i][8] = bitAt(bits, i);
  modules[7][8] = bitAt(bits, 6);
  modules[8][8] = bitAt(bits, 7);
  modules[8][7] = bitAt(bits, 8);
  for (let i = 9; i < 15; i++) modules[8][14 - i] = bitAt(bits, i);

  // Copia 2: fila 8 cerca del buscador superior derecho (bits 0–7,
  // columnas 28..21), luego columna 8 cerca del buscador inferior
  // izquierdo (bits 8–14, filas 22..28).
  for (let i = 0; i < 8; i++) modules[8][SIZE - 1 - i] = bitAt(bits, i);
  for (let i = 8; i < 15; i++) modules[SIZE - 15 + i][8] = bitAt(bits, i);
}

function encodeDataCodewords(bytes) {
  if (bytes.length > MAX_BYTES) {
    throw new Error(`qr: el payload mide ${bytes.length} bytes UTF-8, el máximo para esta configuración (versión 3, nivel M, modo byte) es ${MAX_BYTES}`);
  }
  const bits = [];
  const pushBits = (value, len) => {
    for (let i = len - 1; i >= 0; i--) bits.push((value >> i) & 1);
  };
  pushBits(0b0100, 4); // indicador de modo: byte
  pushBits(bytes.length, 8); // contador de caracteres, 8 bits (versión ≤9, modo byte)
  for (const b of bytes) pushBits(b, 8);

  const capacityBits = DATA_CODEWORDS * 8;
  for (let i = 0; i < 4 && bits.length < capacityBits; i++) bits.push(0); // terminador, hasta 4 ceros
  while (bits.length % 8 !== 0) bits.push(0); // relleno a byte completo

  const codewords = [];
  for (let i = 0; i < bits.length; i += 8) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
    codewords.push(byte);
  }
  const pads = [0xec, 0x11];
  let padIndex = 0;
  while (codewords.length < DATA_CODEWORDS) {
    codewords.push(pads[padIndex % 2]);
    padIndex++;
  }
  return codewords;
}

// Recorre las columnas de derecha a izquierda en pares, de abajo hacia
// arriba y luego de arriba hacia abajo alternando, saltando la columna de
// temporización (6) sin perder ni duplicar ninguna otra. Antes esto se
// resolvía sustituyendo col=5 solo en la iteración de colPair=6 sin
// arrastrar el ajuste a las iteraciones siguientes: la columna 4 quedaba
// escrita dos veces y la columna 0 nunca se tocaba. Verificado con
// OpenCV (QRCodeDetector, fuera de este proyecto) contra el bug original:
// ubicaba el símbolo (los patrones buscadores estaban bien) pero no podía
// decodificar el contenido — exactamente el síntoma de un mapeo de bits
// de datos incorrecto. Con el puntero `right` mutable y arrastrado entre
// iteraciones, las 28 columnas de datos (todas menos la 6) se visitan
// una vez cada una.
function walkColumnPairs(callback) {
  let upward = true;
  let right = SIZE - 1;
  while (right >= 1) {
    if (right === 6) right = 5;
    for (let step = 0; step < SIZE; step++) {
      const row = upward ? SIZE - 1 - step : step;
      callback(row, right);
      callback(row, right - 1);
    }
    upward = !upward;
    right -= 2;
  }
}

function placeDataBits(modules, reserved, allCodewords) {
  const bits = [];
  for (const byte of allCodewords) {
    for (let i = 7; i >= 0; i--) bits.push((byte >> i) & 1);
  }
  let bitIndex = 0;
  walkColumnPairs((row, c) => {
    if (reserved[row][c]) return;
    const bit = bitIndex < bits.length ? bits[bitIndex] : 0;
    modules[row][c] = bit === 1;
    bitIndex++;
  });
  return modules;
}

function applyMask(modules, reserved, maskPattern) {
  const maskFn = MASK_FUNCTIONS[maskPattern];
  const out = createGrid(false);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const bit = modules[r][c];
      out[r][c] = reserved[r][c] ? bit : bit !== maskFn(r, c);
    }
  }
  return out;
}

const MASK_FUNCTIONS = [
  (r, c) => (r + c) % 2 === 0,
  (r, c) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
  (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
];

// Puntuación de penalización (ISO/IEC 18004 §8.8.2), las 4 reglas
// estándar — más bajo es mejor. Se usa para elegir, de las 8 máscaras
// posibles, la que produce el símbolo más "parejo" (mejor fiabilidad de
// lectura real, aunque cualquiera de las 8 sea técnicamente decodificable).
function maskPenalty(modules) {
  let penalty = 0;

  // Regla 1: 5+ módulos iguales seguidos, por fila y por columna.
  for (let r = 0; r < SIZE; r++) {
    penalty += runPenalty(Array.from({ length: SIZE }, (_, c) => modules[r][c]));
  }
  for (let c = 0; c < SIZE; c++) {
    penalty += runPenalty(Array.from({ length: SIZE }, (_, r) => modules[r][c]));
  }

  // Regla 2: bloques 2×2 del mismo color.
  for (let r = 0; r < SIZE - 1; r++) {
    for (let c = 0; c < SIZE - 1; c++) {
      const v = modules[r][c];
      if (v === modules[r][c + 1] && v === modules[r + 1][c] && v === modules[r + 1][c + 1]) {
        penalty += 3;
      }
    }
  }

  // Regla 3: patrón 1:1:3:1:1 (como un buscador) con margen de 4 claros.
  const finderLike = [true, false, true, true, true, false, true, false, false, false, false];
  const finderLikeRev = [...finderLike].reverse();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c <= SIZE - 11; c++) {
      const window = Array.from({ length: 11 }, (_, i) => modules[r][c + i]);
      if (arraysEqual(window, finderLike) || arraysEqual(window, finderLikeRev)) penalty += 40;
    }
  }
  for (let c = 0; c < SIZE; c++) {
    for (let r = 0; r <= SIZE - 11; r++) {
      const window = Array.from({ length: 11 }, (_, i) => modules[r + i][c]);
      if (arraysEqual(window, finderLike) || arraysEqual(window, finderLikeRev)) penalty += 40;
    }
  }

  // Regla 4: qué tan lejos del 50% está la proporción de módulos oscuros.
  let dark = 0;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (modules[r][c]) dark++;
  const percent = (dark * 100) / (SIZE * SIZE);
  penalty += Math.floor(Math.abs(percent - 50) / 5) * 10;

  return penalty;
}

function runPenalty(line) {
  let penalty = 0;
  let runLen = 1;
  for (let i = 1; i < line.length; i++) {
    if (line[i] === line[i - 1]) {
      runLen++;
    } else {
      if (runLen >= 5) penalty += runLen - 2;
      runLen = 1;
    }
  }
  if (runLen >= 5) penalty += runLen - 2;
  return penalty;
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function utf8Bytes(text) {
  return Array.from(new TextEncoder().encode(text));
}

// generateQrMatrix(text) -> { size: 29, modules: boolean[29][29] }
// modules[row][col] === true significa módulo oscuro.
function generateQrMatrix(text) {
  const bytes = utf8Bytes(text);
  const dataCodewords = encodeDataCodewords(bytes);
  const eccCodewords = rsComputeEcc(dataCodewords, ECC_CODEWORDS);
  const allCodewords = dataCodewords.concat(eccCodewords);

  const { modules: base, reserved } = buildFunctionPatterns();
  const withData = placeDataBits(base, reserved, allCodewords);

  let best = null;
  for (let mask = 0; mask < 8; mask++) {
    const masked = applyMask(withData, reserved, mask);
    stampFormatInfo(masked, mask);
    const penalty = maskPenalty(masked);
    if (best === null || penalty < best.penalty) best = { mask, modules: masked, penalty };
  }

  return { size: SIZE, modules: best.modules, maskPattern: best.mask };
}

function renderQrSvg(matrix, { quietZone = 4, moduleSize = 8 } = {}) {
  const total = matrix.size + quietZone * 2;
  const px = total * moduleSize;
  let rects = '';
  for (let r = 0; r < matrix.size; r++) {
    for (let c = 0; c < matrix.size; c++) {
      if (!matrix.modules[r][c]) continue;
      const x = (c + quietZone) * moduleSize;
      const y = (r + quietZone) * moduleSize;
      rects += `<rect x="${x}" y="${y}" width="${moduleSize}" height="${moduleSize}"/>`;
    }
  }
  return `<svg viewBox="0 0 ${px} ${px}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="0" y="0" width="${px}" height="${px}" fill="#FFFFFF"/><g fill="#000000">${rects}</g></svg>`;
}

// --- decodeQrMatrix — SOLO para probar el redondeo encode→decode en las
// pruebas de esta fase (test/render/qr.test.js). No es un lector general:
// no corrige errores (no usa los codewords EC para reparar nada), asume
// exactamente la versión 3 / nivel M / modo byte que este archivo genera.
// Un lector real de verdad es justo lo que la fase deja para la prueba
// física con lectora, no algo que este archivo deba reemplazar.
function decodeQrMatrix(matrix) {
  const maskPattern = detectMaskPattern(matrix);
  const { reserved } = buildFunctionPatterns();
  const maskFn = MASK_FUNCTIONS[maskPattern];
  const unmasked = createGrid(false);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      unmasked[r][c] = reserved[r][c] ? matrix.modules[r][c] : matrix.modules[r][c] !== maskFn(r, c);
    }
  }
  const bits = readDataBits(unmasked, reserved);
  const codewordsBits = bits.slice(0, DATA_CODEWORDS * 8);
  const dataCodewords = [];
  for (let i = 0; i < codewordsBits.length; i += 8) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | codewordsBits[i + j];
    dataCodewords.push(byte);
  }
  const mode = dataCodewords[0] >> 4;
  if (mode !== 0b0100) throw new Error(`qr decode: modo inesperado ${mode.toString(2)}, este decodificador solo entiende modo byte`);
  const length = ((dataCodewords[0] & 0x0f) << 4) | (dataCodewords[1] >> 4);
  const outBytes = [];
  for (let i = 0; i < length; i++) {
    const hi = dataCodewords[1 + i] & 0x0f;
    const lo = dataCodewords[2 + i] >> 4;
    outBytes.push((hi << 4) | lo);
  }
  return new TextDecoder().decode(new Uint8Array(outBytes));
}

function detectMaskPattern(matrix) {
  // Se lee por posición (i=0..14, igual que stampFormatInfo escribe) y
  // luego se arma el string en el orden MSB-primero de FORMAT_INFO_M
  // (byI[14] primero) — el mismo giro de índice que bitAt(), en la
  // dirección contraria.
  const byI = new Array(15);
  for (let i = 0; i < 6; i++) byI[i] = matrix.modules[i][8] ? '1' : '0';
  byI[6] = matrix.modules[7][8] ? '1' : '0';
  byI[7] = matrix.modules[8][8] ? '1' : '0';
  byI[8] = matrix.modules[8][7] ? '1' : '0';
  for (let i = 9; i < 15; i++) byI[i] = matrix.modules[8][14 - i] ? '1' : '0';
  const str = byI.slice().reverse().join('');
  const idx = FORMAT_INFO_M.indexOf(str);
  if (idx === -1) throw new Error('qr decode: información de formato no reconocida (¿matriz corrupta o de otra versión/nivel?)');
  return idx;
}

function readDataBits(modules, reserved) {
  const bits = [];
  walkColumnPairs((row, c) => {
    if (reserved[row][c]) return;
    bits.push(modules[row][c] ? 1 : 0);
  });
  return bits;
}

const QR_CONFIG = { size: SIZE, dataCodewords: DATA_CODEWORDS, eccCodewords: ECC_CODEWORDS, maxBytes: MAX_BYTES };

// --- src/ui/passCache.js ---
// Fase 06 — guarda el último estado de pases conocido en el dispositivo
// para que "sin conexión" siga mostrando algo (PRD/fase 06). Guarda los
// pases CRUDOS (con su propio revokedAt/validUntil), no un resultado ya
// filtrado: filtra de nuevo con visiblePasses (R3, fase 01) usando el
// `now` de cada apertura, nunca el guardado — así un pase revocado
// DESPUÉS de guardarse en caché deja de verse la próxima vez que se
// evalúa, en vez de quedar "congelado" como válido para siempre (INV-4).
//
// JSON.stringify/parse preserva `null` como `null` (no como string ni
// como campo ausente), así que `validUntil: null` sobrevive el viaje
// completo por localStorage sin ambigüedad — es el caso que el archivo de
// esta fase marca como "el fallo más caro": un null mal interpretado como
// fecha inválida apagaría un pase que en realidad nunca caduca.


const CACHE_KEY_PREFIX = 'nc_pass_cache:';

function savePassCache(visitId, passes, now) {
  const record = { visitId, passes, savedAt: now };
  localStorage.setItem(CACHE_KEY_PREFIX + visitId, JSON.stringify(record));
}

function loadPassCache(visitId) {
  const raw = localStorage.getItem(CACHE_KEY_PREFIX + visitId);
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.passes) || typeof parsed.savedAt !== 'string') return null;
    return parsed;
  } catch {
    return null; // JSON corrupto: se trata como "sin caché", no rompe la pantalla
  }
}

// getCachedVisiblePasses(visitId, now) -> { passes: Pass[], savedAt } | null
// Los `passes` ya vienen filtrados por R3 evaluado con el `now` de AHORA,
// no con el que tenía el dispositivo cuando se guardó la caché.
function getCachedVisiblePasses(visitId, now) {
  const cache = loadPassCache(visitId);
  if (!cache) return null;
  return { passes: visiblePasses(cache.passes, now), savedAt: cache.savedAt };
}

// --- src/ui/screens/pass.js ---
// Fase 06 — pantalla completa del QPASS. Reemplaza el placeholder de la
// fase 05 (que solo probaba R3 con texto plano). Comportamiento pedido
// por la fase:
//   - símbolo lo más grande posible, margen quieto, negro sobre blanco
//     puro — ESTA pantalla nunca usa tema oscuro, a propósito
//   - debajo: para qué acceso sirve y hasta qué hora vale
//   - varios pases válidos: deslizar entre ellos
//   - sin conexión: último pase guardado, con aviso "guardado a las HH:MM"
//   - Wake Lock mientras la pantalla esté abierta, si el navegador lo
//     soporta
//
// Brillo de pantalla al máximo: NO existe una API web estándar para
// controlarlo (por diseño — ninguna página puede subir el brillo del
// teléfono de alguien sin su permiso explícito fuera de flujos muy
// específicos). Se le pide al paciente que lo suba él mismo con un aviso
// en pantalla, en vez de fingir que la app lo hace.
//
// "Sin conexión" en ESTE prototipo: no hay backend real (fase 08, fuera
// de alcance) — nunca hay una petición de red que de verdad pueda
// fallar. El mecanismo de caché (src/ui/passCache.js) SÍ es real y está
// probado, pero no hay forma honesta de ejercitar "modo avión" sin una
// fuente de datos viva de la que desconectarse; por eso showFallback se
// deja disponible para cuando exista un backend, no se simula aquí.






// t como segundo parámetro (fase 09, D29): la rama 'image' necesita
// traducir pass.scope para el atributo alt de la imagen — a diferencia de
// 'qr'/'code128', que nunca tocaron t. Sin este parámetro la rama nueva
// lanzaría ReferenceError la primera vez que corriera (t no existe en el
// scope de nivel de módulo de esta función, solo dentro de
// attachPassScreen más abajo). Documentado así en el doc de fase 09 antes
// de escribir este archivo, precisamente para no repetir ese error.
function renderSymbol(pass, t) {
  try {
    if (pass.format === 'image') {
      // QPASS real (D29): una imagen que ya subió la coordinadora, no un
      // payload corto para que este archivo lo codifique — el símbolo ya
      // viene armado, solo se pinta. No pasa por generateQrMatrix ni por
      // el generador de Code128.
      return `<img src="${escapeHtml(pass.payload)}" alt="${escapeHtml(t(`pass.scope.${pass.scope}`))}" class="nc-pass-image" />`;
    }
    if (pass.format === 'code128') {
      return renderCode128Svg(pass.payload);
    }
    return renderQrSvg(generateQrMatrix(pass.payload));
  } catch (err) {
    // Un payload real que no quepa (QR) o tenga caracteres fuera de
    // subset B (Code128) no debe tumbar la pantalla completa — se avisa
    // en vez de dejar una página en blanco justo donde el paciente más
    // la necesita.
    return `<p class="nc-pass-error">${escapeHtml(err.message)}</p>`;
  }
}

function renderPassScreen(ctx) {
  const { t } = ctx;
  return `
    <section class="nc-screen nc-pass-screen">
      <h1 class="nc-screen-title">${escapeHtml(t('pass.title'))}</h1>
      <p class="nc-pass-brightness-hint">${escapeHtml(t('pass.brightnessHint'))}</p>
      <div data-role="pass-mount"></div>
    </section>
  `;
}

function attachPassScreen(rootEl, ctx) {
  const { visit, passes, now, lang, t, ephemeral } = ctx;
  const mount = rootEl.querySelector('[data-role="pass-mount"]');

  const live = visiblePasses(passes, now);
  let source, savedAt;
  if (live.length > 0) {
    // ephemeral (fase 09, D29): bandera opt-in, default undefined/false —
    // el resto del proyecto (la sesión real del paciente vía app.js) nunca
    // la pasa, así que su comportamiento aquí queda byte a byte igual que
    // fase 06. La única llamada que SÍ pasa ephemeral: true es la ruta
    // #/pass-preview de coordinatorApp.js: ese botón abre el pase de una
    // visita AJENA (la que esté armando la coordinadora en ese momento),
    // sobre el mismo localStorage del navegador — sin este guard,
    // guardaría ahí el payload real de esa visita, violando la promesa
    // explícita del doc de esa fase ("nunca... localStorage"). Fix de
    // revisión adversarial, fase 09 — se coló en la primera pasada porque
    // nadie había ejecutado #/pass-preview de verdad, solo leído el código
    // (ver test/ui/pass.test.js para el porqué de la prueba dedicada).
    //
    // format:'image' (D29) sigue quedando fuera del caché aparte de esto,
    // sin importar ephemeral: es una data: URL completa, no el string
    // corto que este mecanismo manejaba hasta ahora, y la demo de fase 09
    // promete que nada de lo que emite sobrevive un refresh — si se
    // guardara aquí, esa promesa se rompería justo por este archivo.
    // qr/code128 se siguen cacheando exactamente igual que en fase 06
    // cuando ephemeral no está activo.
    if (!ephemeral) {
      savePassCache(visit.id, passes.filter((p) => p.format !== 'image'), now);
    }
    source = live;
    savedAt = null;
  } else {
    const cached = getCachedVisiblePasses(visit.id, now);
    source = cached ? cached.passes : [];
    savedAt = cached ? cached.savedAt : null;
  }

  let index = 0;
  requestWakeLock();

  function render() {
    if (source.length === 0) {
      mount.innerHTML = `<p class="nc-pass-empty">${escapeHtml(t('pass.empty'))}</p>`;
      return;
    }
    const pass = source[index];
    const offlineNotice = savedAt
      ? `<p class="nc-pass-offline">${escapeHtml(t('pass.offline'))} · ${escapeHtml(t('pass.savedAt')(formatSavedAt(savedAt)))}</p>`
      : '';
    const validUntilText = pass.validUntil ? t('pass.validUntil')(formatSavedAt(pass.validUntil)) : t('pass.noExpiry');
    const nav =
      source.length > 1
        ? `<div class="nc-pass-nav">
            <button type="button" class="nc-button" data-role="pass-prev" ${index === 0 ? 'disabled' : ''}>${escapeHtml(t('map.routePrev'))}</button>
            <span class="nc-pass-count">${index + 1} / ${source.length}</span>
            <button type="button" class="nc-button" data-role="pass-next" ${index === source.length - 1 ? 'disabled' : ''}>${escapeHtml(t('map.routeNext'))}</button>
          </div>`
        : '';
    mount.innerHTML = `
      ${offlineNotice}
      <div class="nc-pass-symbol">${renderSymbol(pass, t)}</div>
      <p class="nc-pass-scope">${escapeHtml(t(`pass.scope.${pass.scope}`))}</p>
      <p class="nc-pass-expiry">${escapeHtml(validUntilText)}</p>
      ${nav}
    `;
    mount.querySelector('[data-role="pass-prev"]')?.addEventListener('click', () => {
      if (index > 0) { index--; render(); }
    });
    mount.querySelector('[data-role="pass-next"]')?.addEventListener('click', () => {
      if (index < source.length - 1) { index++; render(); }
    });
  }

  render();
}

function formatSavedAt(iso) {
  // Solo hora, formato de reloj de 24h simple para el aviso "guardado a
  // las HH:MM" — no usa formatTimeTijuana (esa función es AM/PM, fase 01)
  // para no forzar una convención horaria distinta a la de esta nota
  // corta; es texto de UI, no una regla de dominio.
  const d = new Date(iso);
  return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
}

let wakeLockSentinel = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
  } catch {
    // Puede fallar por permisos, pestaña no visible, etc. — no es un
    // error que deba interrumpir la pantalla del pase.
  }
}

// src/data/locations.js: build.py (fase 05) aplana todos los módulos a un

function plazaOpeningHours() {
  return {
    tz: 'America/Tijuana',
    weekly: [0, 1, 2, 3, 4, 5, 6].map((day) => ({ day, open: '07:00', close: '20:00' })),
    exceptions: [],
    unconfirmed: true,
  };
}

// category: 'gastronomia' | 'salud' | 'belleza' | 'servicios' | 'moda' | 'amenidad'
// (los 5 rótulos tal cual los usa directorio-plaza-exterior.pdf, más
// "amenidad" para los íconos de servicio sin marca propia). `type` se
// deriva de category solo para las dos vistas que el PRD ya nombraba
// (PlazaVenue type: "restaurant" | "amenity"); category es el dato real.
function venue(id, name, category, level, mapPointId) {
  return {
    id,
    name,
    type: category === 'gastronomia' ? 'restaurant' : category === 'amenidad' ? 'amenity' : 'directory',
    category,
    cuisine: [], // PRD §15.2: tipo de comida sin confirmar (solo aplica a gastronomia)
    level,
    hours: plazaOpeningHours(),
    mapPointId,
    unconfirmed: true,
  };
}

// --- src/ui/screens/plaza.js ---
// Plaza — tres secciones sobre el mismo catálogo (src/data/plaza.js):
// Restaurantes (category: gastronomia, con filtro por tipo de comida, sin
// cambios de fase 05), Directorio (salud/belleza/servicios/moda, fase 07 —
// D27) y Amenidades (antes siempre vacía, PRD §15.3 — fase 07 la llena con
// dato real). Fase 03 no confirmó ningún tipo de comida todavía (cuisine:
// [] en gastronomia) ni horario de ningún local — el filtro de comida se
// arma leyendo los tags que de verdad existan (hoy: ninguno además de
// "Todos"), listo para cuando haya dato real sin tocar este archivo otra
// vez.




// venue.name es un string (nombre de marca, igual en los dos idiomas —
// "7-Eleven", "Skin Point") en la mayoría de los locales, pero un objeto
// {es,en} en las amenidades (D27): "Baños"/"Restrooms" sí necesita
// traducirse, a diferencia de una marca. Mismo patrón `?? .es` que ya usa
// locationName() en util.js para Location.
function venueName(venue, lang) {
  if (typeof venue.name === 'string') return venue.name;
  return venue.name[lang] ?? venue.name.es;
}

function byCategory(category) {
  return plazaVenues.filter((v) => v.category === category);
}

function allCuisineTags() {
  return [...new Set(byCategory('gastronomia').flatMap((v) => v.cuisine))].sort();
}

function allDirectoryCategories() {
  // Orden fijo (el mismo del documento fuente), no alfabético.
  return ['salud', 'belleza', 'servicios', 'moda'].filter((c) => byCategory(c).length > 0);
}

// venue.level es "N1"/"Quartz" (código corto, sin traducir, desde fase 03
// — se muestra tal cual en los dos idiomas) en los venues originales, o
// "calle"/"plaza"/"ambos" (D27) en los nuevos: esos SÍ son palabras reales
// que deben traducirse, no códigos. LEVEL_KEYS distingue los dos casos sin
// necesitar un campo aparte.
const LEVEL_KEYS = new Set(['calle', 'plaza', 'ambos']);
function levelLine(venue, t) {
  return LEVEL_KEYS.has(venue.level) ? t(`plaza.level.${venue.level}`) : venue.level;
}

function venueLines(venue, t, lang) {
  if (venue.category === 'gastronomia') {
    const cuisineLine = venue.cuisine.length > 0 ? venue.cuisine.join(', ') : t('plaza.cuisineUnknown');
    return [cuisineLine, levelLine(venue, t)];
  }
  if (venue.category === 'amenidad') {
    return [levelLine(venue, t)];
  }
  return [t(`plaza.category.${venue.category}`), levelLine(venue, t)];
}

function renderPlazaScreen(ctx) {
  const { t, lang } = ctx;
  const cuisineTags = allCuisineTags();
  const directoryCategories = allDirectoryCategories();
  const amenities = byCategory('amenidad');

  const cuisineFilterHtml = `
    <div class="nc-cuisine-filter" role="group" aria-label="${escapeHtml(t('plaza.restaurantsTitle'))}">
      <button type="button" class="nc-chip nc-chip--active" data-cuisine="">${escapeHtml(t('plaza.cuisineFilterAll'))}</button>
      ${cuisineTags.map((tag) => `<button type="button" class="nc-chip" data-cuisine="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`).join('\n')}
    </div>
  `;
  const restaurantsHtml = byCategory('gastronomia')
    .map((v) => `<div data-venue-cuisines="${escapeHtml(v.cuisine.join('|'))}">${renderFicha({ title: venueName(v, lang), lines: venueLines(v, t, lang), unconfirmed: v.unconfirmed === true, t })}</div>`)
    .join('\n');

  const categoryFilterHtml = `
    <div class="nc-cuisine-filter" role="group" aria-label="${escapeHtml(t('plaza.directoryTitle'))}">
      <button type="button" class="nc-chip nc-chip--active" data-category="">${escapeHtml(t('plaza.cuisineFilterAll'))}</button>
      ${directoryCategories.map((c) => `<button type="button" class="nc-chip" data-category="${escapeHtml(c)}">${escapeHtml(t(`plaza.category.${c}`))}</button>`).join('\n')}
    </div>
  `;
  const directoryHtml = directoryCategories
    .flatMap((c) => byCategory(c))
    .map((v) => `<div data-venue-category="${escapeHtml(v.category)}">${renderFicha({ title: venueName(v, lang), lines: venueLines(v, t, lang), unconfirmed: v.unconfirmed === true, t })}</div>`)
    .join('\n');

  const amenitiesHtml = amenities.length === 0
    ? `<p class="nc-empty-state">${escapeHtml(t('plaza.amenitiesEmpty'))}</p>`
    : amenities.map((v) => renderFicha({ title: venueName(v, lang), lines: venueLines(v, t, lang), unconfirmed: v.unconfirmed === true, t })).join('\n');

  return `
    <section class="nc-screen">
      <h1 class="nc-screen-title">${escapeHtml(t('plaza.title'))}</h1>

      <h2 class="nc-section-title">${escapeHtml(t('plaza.restaurantsTitle'))}</h2>
      ${cuisineFilterHtml}

      <h2 class="nc-section-title">${escapeHtml(t('plaza.directoryTitle'))}</h2>
      ${categoryFilterHtml}
      <div class="nc-venue-list" data-role="directory-list">${directoryHtml}</div>

      <h2 class="nc-section-title">${escapeHtml(t('plaza.amenitiesTitle'))}</h2>
      <div class="nc-venue-list" data-role="amenities-list">${amenitiesHtml}</div>
    </section>
  `;
}

function attachPlazaScreen(rootEl) {
  // data-cuisine y data-category no se traslapan (son dos filtros
  // distintos, cada chip lleva solo uno de los dos atributos), así que
  // seleccionar por atributo alcanza sin necesitar acotar por contenedor.
  const cuisineChips = rootEl.querySelectorAll('[data-cuisine]');
  const venues = rootEl.querySelectorAll('[data-venue-cuisines]');
  cuisineChips.forEach((chip) => {
    chip.addEventListener('click', () => {
      cuisineChips.forEach((c) => c.classList.remove('nc-chip--active'));
      chip.classList.add('nc-chip--active');
      const wanted = chip.dataset.cuisine;
      venues.forEach((v) => {
        const cuisines = v.dataset.venueCuisines.split('|').filter(Boolean);
        v.style.display = !wanted || cuisines.includes(wanted) ? '' : 'none';
      });
    });
  });

  const categoryChips = rootEl.querySelectorAll('[data-category]');
  const directoryVenues = rootEl.querySelectorAll('[data-venue-category]');
  categoryChips.forEach((chip) => {
    chip.addEventListener('click', () => {
      categoryChips.forEach((c) => c.classList.remove('nc-chip--active'));
      chip.classList.add('nc-chip--active');
      const wanted = chip.dataset.category;
      directoryVenues.forEach((v) => {
        v.style.display = !wanted || v.dataset.venueCategory === wanted ? '' : 'none';
      });
    });
  });
}

// --- src/ui/screens/stay.js ---
// Mi estancia — reservación de Quartz con botón copiar (fase 05). "Si la
// visita no tiene hospedaje, la pantalla y su acceso no existen — no se
// muestra vacía": src/ui/app.js nunca enruta aquí sin lodging, y esta
// función además se niega a pintar algo si de todos modos la llaman así
// (defensa en profundidad, no el único lugar que decide).




function renderStayScreen(ctx) {
  const { lodging, now, lang, t } = ctx;
  if (!lodging) return '';

  const checkInLabel = `${formatDayLabel(lodging.checkIn, now, lang)[lang]} · ${formatTimeTijuana(lodging.checkIn, lang)}`;
  const checkOutLabel = `${formatDayLabel(lodging.checkOut, now, lang)[lang]} · ${formatTimeTijuana(lodging.checkOut, lang)}`;
  const yesNo = (v) => (v ? t('stay.yes') : t('stay.no'));

  return `
    <section class="nc-screen">
      <h1 class="nc-screen-title">${escapeHtml(t('stay.title'))}</h1>
      ${renderCard(`
        <p class="nc-stay-hotel">${escapeHtml(lodging.hotel)}</p>
        <p class="nc-stay-row"><span>${escapeHtml(t('stay.reservationCode'))}</span> <strong data-role="res-code">${escapeHtml(lodging.reservationCode)}</strong></p>
        <button type="button" class="nc-button" data-role="copy-code" data-code="${escapeHtml(lodging.reservationCode)}">${escapeHtml(t('stay.copyButton'))}</button>
        <p class="nc-copy-feedback" data-role="copy-feedback" hidden>${escapeHtml(t('stay.copied'))}</p>
      `, { variant: 'accent' })}
      ${renderCard(`
        <p class="nc-stay-row"><span>${escapeHtml(t('stay.checkIn'))}</span> ${escapeHtml(checkInLabel)}</p>
        <p class="nc-stay-row"><span>${escapeHtml(t('stay.checkOut'))}</span> ${escapeHtml(checkOutLabel)}</p>
        <p class="nc-stay-row"><span>${escapeHtml(t('stay.breakfastIncluded'))}</span> ${escapeHtml(yesNo(lodging.breakfastIncluded))}</p>
        <p class="nc-stay-row"><span>${escapeHtml(t('stay.recoveryRoom'))}</span> ${escapeHtml(yesNo(lodging.recoveryRoom))}</p>
      `)}
    </section>
  `;
}

function attachStayScreen(rootEl) {
  const btn = rootEl.querySelector('[data-role="copy-code"]');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const feedback = rootEl.querySelector('[data-role="copy-feedback"]');
    try {
      await navigator.clipboard.writeText(btn.dataset.code);
    } catch {
      // Clipboard API puede requerir permiso/gesto del usuario según el
      // navegador — si falla, no rompemos la pantalla, solo no mostramos
      // la retroalimentación de éxito.
      return;
    }
    if (feedback) {
      feedback.hidden = false;
      setTimeout(() => { feedback.hidden = true; }, 2000);
    }
  });
}

const STAY_CSS = `

.nc-stay-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin: 0 0 8px; }
